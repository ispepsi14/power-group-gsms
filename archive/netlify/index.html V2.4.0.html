/* ---------------- Realtime listeners ---------------- */
function detachListeners(){
  listeners.forEach(fn => { try{ fn(); }catch(e){} });
  listeners = [];
}

/* A snapshot can arrive at any moment — including while someone is halfway through
   typing a price. render() rebuilds the whole DOM and would throw away their caret,
   so if a field is focused we hold the redraw until they move off it. */
let pendingRender = false;
function safeRender(){
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){
    pendingRender = true;
    return;
  }
  pendingRender = false;
  render();
}
document.addEventListener('focusout', () => {
  if(!pendingRender) return;
  setTimeout(() => {
    const el = document.activeElement;
    if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    pendingRender = false;
    render();
  }, 120);
});

function startSync(){
  state = emptyState();
  shadow = {};
  shadowConfig = '';
  dataReady = false;
  SYNC_COLLECTIONS.forEach(col => { shadow[col] = {}; });

  let pending = SYNC_COLLECTIONS.length + 1;
  const oneReady = () => {
    pending--;
    if(pending === 0){
      dataReady = true;
      runSafeMigrations();
      applyTheme(state.settings && state.settings.themeId);
      render();
      // Backfill the customer board for jobs that predate the feature. Once per session.
      if(!boardReconciled){
        boardReconciled = true;
        setTimeout(() => reconcileBoard(false), 1200);
      }
    }
  };

  SYNC_COLLECTIONS.forEach(col => {
    let first = true;
    // At 20-30 cars a day the jobs collection grows by ~9,000 rows a year. Loading all
    // of them into every device on startup would get slower every month, so the live
    // listener is capped at the most recent slice. This is SAFE with the diff-based
    // save because `shadow` is rebuilt from this same snapshot — flushState only ever
    // considers documents it can actually see, so older jobs are never treated as
    // "deleted". They stay in Firestore and remain in the exported backup.
    const ref = (col === 'jobs')
      ? db.collection(col).orderBy('createdAt', 'desc').limit(RECENT_JOBS_LIMIT)
      : db.collection(col);
    const unsub = ref.onSnapshot(snap => {
      const rows = [];
      shadow[col] = {};
      snap.forEach(doc => {
        const data = Object.assign({}, doc.data(), { id: doc.id });
        rows.push(data);
        shadow[col][doc.id] = JSON.stringify(data);
      });
      state[col] = rows;
      if(first){ first = false; oneReady(); }
      else if(dataReady){ safeRender(); }
    }, err => {
      console.error('sync ' + col, err);
      if(first){ first = false; oneReady(); }
      flashToast('ซิงค์ ' + col + ' ไม่สำเร็จ');
    });
    listeners.push(unsub);
  });

  let firstCfg = true;
  const unsubCfg = db.collection('config').doc('main').onSnapshot(doc => {
    if(doc.exists){
      const d = doc.data();
      if(d.shop) state.shop = d.shop;
      if(d.settings) state.settings = d.settings;
      state.deletedMasterPartNames = d.deletedMasterPartNames || [];
      shadowConfig = JSON.stringify({ shop: state.shop, settings: state.settings, deletedMasterPartNames: state.deletedMasterPartNames });
    }
    if(firstCfg){ firstCfg = false; oneReady(); }
    else if(dataReady){ applyTheme(state.settings && state.settings.themeId); safeRender(); }
  }, err => {
    console.error('sync config', err);
    if(firstCfg){ firstCfg = false; oneReady(); }
  });
  listeners.push(unsubCfg);
}

// Only field backfills that touch records already present — nothing that CREATES
// catalog records. Seeding the standard 25 parts / 25 models is a deliberate,
// admin-only action (see seedInitialData) so 7 devices can't each seed their own copy.
function runSafeMigrations(){
  if(!state.settings) state.settings = emptyState().settings;
  if(!state.shop) state.shop = emptyState().shop;
  if(!Array.isArray(state.deletedMasterPartNames)) state.deletedMasterPartNames = [];
  try{
    ensureModelBrandSplit();
    ensurePartFields();
    ensureVehicleModelBrandFix();
    ensureJobFields();
  }catch(e){ console.error('migration', e); }
}

/* ---------------- Diff-based save ----------------
   Writes only the documents whose JSON actually changed since the last server
   snapshot, so simultaneous edits on different records don't clobber each other. */
function saveState(showToast){
  if(!db || !dataReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { flushState(showToast); }, 250);
}

function flushState(showToast){
  if(!db || !dataReady) return;
  let batch = db.batch();
  let ops = 0;
  const commits = [];
  const bump = () => {
    ops++;
    if(ops >= 400){ commits.push(batch.commit()); batch = db.batch(); ops = 0; }
  };

  SYNC_COLLECTIONS.forEach(col => {
    const rows = Array.isArray(state[col]) ? state[col] : [];
    const seen = {};
    rows.forEach(row => {
      if(!row || !row.id) return;
      seen[row.id] = true;
      const payload = Object.assign({}, row);
      const encoded = JSON.stringify(Object.assign({}, payload, { id: row.id }));
      if(shadow[col][row.id] === encoded) return;   // unchanged — skip
      delete payload.id;                            // id lives in the doc path
      batch.set(db.collection(col).doc(row.id), cleanForFirestore(payload));
      shadow[col][row.id] = encoded;
      bump();
      // Keep the public waiting-room board in step with any job that changed.
      if(col === 'jobs'){
        batch.set(db.collection('board').doc(row.id), cleanForFirestore(boardPayloadFor(row)));
        bump();
      }
    });
    Object.keys(shadow[col]).forEach(id => {
      if(seen[id]) return;
      batch.delete(db.collection(col).doc(id));
      delete shadow[col][id];
      bump();
      if(col === 'jobs'){
        batch.delete(db.collection('board').doc(id));
        bump();
      }
    });
  });

  const cfg = {
    shop: state.shop,
    settings: state.settings,
    deletedMasterPartNames: state.deletedMasterPartNames || []
  };
  const cfgEncoded = JSON.stringify(cfg);
  if(cfgEncoded !== shadowConfig){
    batch.set(db.collection('config').doc('main'), cleanForFirestore(cfg));
    shadowConfig = cfgEncoded;
    bump();
  }

  if(ops > 0) commits.push(batch.commit());
  if(commits.length === 0){
    if(showToast) flashToast('บันทึกแล้ว');
    return;
  }
  Promise.all(commits)
    .then(() => { if(showToast) flashToast('บันทึกแล้ว'); })
    .catch(err => {
      console.error('save', err);
      if(err && err.code === 'permission-denied'){
        flashToast('ไม่มีสิทธิ์แก้ไขส่วนนี้');
      } else {
        flashToast('บันทึกไม่สำเร็จ — จะลองส่งอีกครั้งเมื่อเน็ตกลับมา');
      }
    });
}

function flashToast(msg){

/* ================= In-app dialogs =================
   Replaces the browser's native confirm()/prompt(). Those are silently suppressed in
   several mobile contexts (notably when the file is opened from local storage, e.g.
   edge://external-file on iOS), which made buttons look completely dead — you'd tap
   ลบ and nothing whatsoever happened. These are plain DOM, so they always show.
   They're appended to <body> rather than #app so a render() doesn't wipe them.
   Note both are ASYNC: the result arrives in a callback, not a return value. */
function closeUiModal(){
  const el = document.getElementById('ui-modal-root');
  if(el) el.remove();
}

function uiModal(opts){
  closeUiModal();
  const hasInput = opts.input === true;
  const root = document.createElement('div');
  root.id = 'ui-modal-root';
  root.className = 'ui-modal-overlay';
  root.innerHTML = `
    <div class="ui-modal" role="dialog" aria-modal="true">
      <div class="ui-modal-msg">${escapeHtml(opts.message || '')}</div>
      ${hasInput ? `<input type="text" id="ui-modal-input" class="ui-modal-input" value="${escapeAttr(opts.defaultValue || '')}" placeholder="${escapeAttr(opts.placeholder || '')}">` : ''}
      <div class="ui-modal-btns">
        <button type="button" class="btn secondary" id="ui-modal-cancel">ยกเลิก</button>
        <button type="button" class="btn ${opts.danger ? 'danger-solid' : ''}" id="ui-modal-ok">${escapeHtml(opts.okLabel || 'ตกลง')}</button>
      </div>
    </div>`;
  document.body.appendChild(root);

  const input = document.getElementById('ui-modal-input');
  const okBtn = document.getElementById('ui-modal-ok');
  okBtn.onclick = function(){
    const value = input ? input.value : true;
    closeUiModal();
    if(opts.onOk) opts.onOk(value);
  };
  document.getElementById('ui-modal-cancel').onclick = closeUiModal;
  root.onclick = function(e){ if(e.target === root) closeUiModal(); };
  if(input){
    input.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); okBtn.click(); } };
    setTimeout(() => { input.focus(); input.select(); }, 30);
  }
}

// uiConfirm('ลบไหม?', () => { ...ทำจริง... })
function uiConfirm(message, onOk, okLabel){
  uiModal({ message, danger:true, okLabel: okLabel || 'ยืนยัน', onOk: () => onOk() });
}

// uiPrompt('ชื่อใหม่', 'ค่าเดิม', value => { ... })  — cancel simply never fires onOk.
function uiPrompt(message, defaultValue, onOk, placeholder){
  uiModal({
    message, input:true, defaultValue: defaultValue || '', placeholder: placeholder || '',
    okLabel:'บันทึก', onOk: value => onOk(value)
  });
}

// uiChoice('หัวข้อ', [{value,label,current}], value => { ... })
// A single-tap picker — choosing an option closes the dialog and fires onPick.
function uiChoice(title, options, onPick){
  closeUiModal();
  const root = document.createElement('div');
  root.id = 'ui-modal-root';
  root.className = 'ui-modal-overlay';
  root.innerHTML = `
    <div class="ui-modal" role="dialog" aria-modal="true">
      <div class="ui-modal-msg">${escapeHtml(title || '')}</div>
      <div class="ui-choice-list">
        ${options.map((o, i) => `<button type="button" class="ui-choice ${o.current ? 'current' : ''}" data-i="${i}">
          <span>${escapeHtml(o.label)}</span>${o.current ? `<span class="ui-choice-now">ปัจจุบัน</span>` : ''}
        </button>`).join('')}
      </div>
      <div class="ui-modal-btns">
        <button type="button" class="btn secondary" id="ui-modal-cancel">ปิด</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  root.querySelectorAll('.ui-choice').forEach(btn => {
    btn.onclick = function(){
      const opt = options[parseInt(btn.getAttribute('data-i'), 10)];
      closeUiModal();
      if(opt && onPick) onPick(opt.value);
    };
  });
  document.getElementById('ui-modal-cancel').onclick = closeUiModal;
  root.onclick = function(e){ if(e.target === root) closeUiModal(); };
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

function genJobNumber(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ymd = `${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const todayCount = state.jobs.filter(j => j.jobNumber && j.jobNumber.startsWith('PG'+ymd)).length;
  return `PG${ymd}-${String(todayCount+1).padStart(3,'0')}`;
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// Re-encode an existing dataURL at a smaller size (used to derive the list thumbnail
// from a photo we've already resized once).
function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

/* Photos are the one thing that can wreck this app at 20-30 cars a day: a raw phone
   photo is 2-4MB, and Firestore caps a document at 1MB. Every picture therefore gets
   shrunk twice — a ~1000px copy that lives in its OWN document (fetched only when you
   open that job) and a ~240px thumbnail that rides along on the job itself so the list
   can show it instantly without downloading anything else. */
const MAX_PHOTOS_PER_JOB = 6;

async function onCiPhotoInput(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  flashToast('กำลังย่อรูป...');
  for(const f of files){
    if(view.ci_photos.length >= MAX_PHOTOS_PER_JOB){
      flashToast('ใส่รูปได้สูงสุด ' + MAX_PHOTOS_PER_JOB + ' รูปต่อคัน');
      break;
    }
    const full = await resizeImageFile(f, 1000, 0.6);
    if(!full) continue;
    const thumb = await resizeDataUrl(full, 240, 0.5);
    view.ci_photos.push({ full, thumb: thumb || full });
  }
  input.value = '';
  render();
}
function removeCiPhoto(idx){
  view.ci_photos.splice(idx,1);
  render();
}

// The card thumbnail. Prefers the small dedicated thumb; falls back to the old
// inline photos array so jobs created before this change still show a picture.
function jobThumb(job){
  if(job.thumb) return job.thumb;
  if(Array.isArray(job.photos) && job.photos.length){
    const first = job.photos[0];
    return typeof first === 'string' ? first : (first && first.thumb) || '';
  }
  return '';
}

// Full-size photos live outside the job document, one per doc.
function savePhotosForJob(jobId, dataUrls){
  if(!db || !dataUrls || !dataUrls.length) return Promise.resolve();
  const batch = db.batch();
  dataUrls.forEach(d => {
    if(!d) return;
    batch.set(db.collection('jobPhotos').doc(uid()), {
      jobId, dataUrl: d, createdAt: nowIso()
    });
  });
  return batch.commit().catch(err => {
    console.error('photos', err);
    flashToast('อัปโหลดรูปไม่สำเร็จ');
  });
}

// Fetched on demand when a job is opened — never synced wholesale, otherwise every
// device would download every photo the shop has ever taken on startup.
function loadJobPhotos(jobId){
  if(!db) return;
  view.jobPhotosFor = jobId;
  view.jobPhotos = null;
  db.collection('jobPhotos').where('jobId', '==', jobId).get()
    .then(snap => {
      if(view.jobPhotosFor !== jobId) return;   // user already navigated away
      const rows = [];
      snap.forEach(d => rows.push(Object.assign({}, d.data(), { id: d.id })));
      rows.sort((a,b) => String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
      view.jobPhotos = rows;
      safeRender();
    })
    .catch(err => {
      console.error('loadJobPhotos', err);
      if(view.jobPhotosFor === jobId){ view.jobPhotos = []; safeRender(); }
    });
}

function deletePhotosForJob(jobId){
  if(!db) return;
  db.collection('jobPhotos').where('jobId', '==', jobId).get()
    .then(snap => {
      if(snap.empty) return;
      const batch = db.batch();
      snap.forEach(d => batch.delete(d.ref));
      return batch.commit();
    })
    .catch(err => console.error('deletePhotosForJob', err));
}

function addPhotosToJob(jobId, input){
  const job = getJob(jobId);
  if(!job) return;
  const files = Array.from(input.files || []);
  input.value = '';
  if(!files.length) return;
  flashToast('กำลังย่อรูป...');
  (async () => {
    const fulls = [];
    for(const f of files){
      const full = await resizeImageFile(f, 1000, 0.6);
      if(!full) continue;
      fulls.push(full);
      if(!job.thumb){
        job.thumb = (await resizeDataUrl(full, 240, 0.5)) || full;
      }
    }
    if(!fulls.length) return;
    job.photoCount = (job.photoCount || 0) + fulls.length;
    saveState(false);
    await savePhotosForJob(jobId, fulls);
    loadJobPhotos(jobId);
    flashToast('เพิ่มรูปแล้ว');
  })();
}

function deleteJobPhoto(photoId, jobId){
  uiConfirm('ลบรูปนี้?', () => {
    db.collection('jobPhotos').doc(photoId).delete()
      .then(() => {
        const job = getJob(jobId);
        if(job && job.photoCount) { job.photoCount = Math.max(0, job.photoCount - 1); saveState(false); }
        loadJobPhotos(jobId);
      })
      .catch(err => flashToast('ลบรูปไม่สำเร็จ: ' + (err.message||err.code)));
  }, 'ลบรูป');
}

function submitCheckin(){
  const plate = (view.ci_plateQuery||'').trim().toUpperCase();
  const mileage = (view.ci_mileage||'').toString().trim();
  if(!plate){ flashToast('กรุณากรอกทะเบียนรถ'); return; }
  if(!mileage){ flashToast('กรุณากรอกเลขไมล์'); return; }

  const usingModelList = view.ci_newModelKey && view.ci_newModelKey !== CUSTOM_MODEL_KEY;
  const selectedCatalogModel = usingModelList ? state.models.find(m => m.name === view.ci_newModelKey) : null;
  // Uppercased on the way in so hand-typed entries match the catalog's format exactly.
  const resolvedBrand = (usingModelList ? (selectedCatalogModel ? selectedCatalogModel.brand : getModelBrand(view.ci_newModelKey)) : view.ci_newBrand.trim()).toUpperCase();
  const resolvedModel = (usingModelList ? view.ci_newModelKey : view.ci_newModel.trim()).toUpperCase();

  let vehicle, customer;
  if(view.ci_matchedVehicleId && !view.ci_editMatch){
    vehicle = getVehicle(view.ci_matchedVehicleId);
    customer = getCustomer(vehicle.customerId);
    vehicle.mileage = mileage;
  } else if(view.ci_matchedVehicleId && view.ci_editMatch){
    vehicle = getVehicle(view.ci_matchedVehicleId);
    customer = getCustomer(vehicle.customerId);
    customer.name = view.ci_newCustomerName || customer.name;
    customer.phone = view.ci_newCustomerPhone || customer.phone;
    vehicle.province = view.ci_newProvince || vehicle.province;
    vehicle.brand = resolvedBrand || vehicle.brand;
    vehicle.model = resolvedModel || vehicle.model;
    vehicle.year = view.ci_newYear || vehicle.year;
    vehicle.color = view.ci_newColor || vehicle.color;
    vehicle.mileage = mileage;
  } else {
    if(!view.ci_newCustomerName.trim()){ flashToast('กรุณากรอกชื่อลูกค้า'); return; }
    customer = { id: uid(), name: view.ci_newCustomerName.trim(), phone: view.ci_newCustomerPhone.trim() };
    state.customers.push(customer);
    vehicle = {
      id: uid(), customerId: customer.id, plate,
      province: view.ci_newProvince.trim(), brand: resolvedBrand,
      model: resolvedModel, year: view.ci_newYear.trim(),
      color: view.ci_newColor.trim(), mileage
    };
    state.vehicles.push(vehicle);
  }

  const complaints = [
    ...view.ci_checked.map(text => ({ text, custom:false })),
    ...view.ci_customComplaints.map(text => ({ text, custom:true }))
  ];

  const partsModel = vehicle.model ? state.models.find(m => m.name === vehicle.model) : null;
  const partsNeeded = (view.ci_selectedParts || []).map(partId => {
    const p = partsModel ? partsModel.parts.find(pp => pp.id === partId) : null;
    if(!p) return null;
    const firstPriced = (p.brands || []).find(b => b.price);
    return {
      id: uid(), partName: p.partName, variant: p.variant || '',
      qty: p.qty || '', unit: p.unit || 'ชิ้น',
      brand: firstPriced ? (firstPriced.brand || '') : '',
      price: firstPriced ? (firstPriced.price || '') : '',
      note: ''
    };
  }).filter(Boolean);

  const job = {
    id: uid(),
    jobNumber: genJobNumber(),
    queueNo: (view.ci_queueNo || '').trim(),
    vehicleId: vehicle.id,
    customerId: customer.id,
    mileageIn: mileage,
    status: 'received',
    complaints,
    partsNeeded,
    // Only the small thumbnail rides on the job doc; full photos go to jobPhotos/
    thumb: view.ci_photos.length ? (view.ci_photos[0].thumb || '') : '',
    photoCount: view.ci_photos.length,
    photos: [],
    createdAt: nowIso(),
    statusHistory: [{ status:'received', changedAt: nowIso() }]
  };
  const fullPhotos = view.ci_photos.map(p => p.full).filter(Boolean);
  state.jobs.push(job);
  saveState(true);
  savePhotosForJob(job.id, fullPhotos);
  flashToast('รับรถสำเร็จ — ' + job.jobNumber);
  resetCheckin();
  openJob(job.id);
}

function saveEditJob(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const v = getVehicle(job.vehicleId);
  const c = getCustomer(job.customerId);
  const changes = [];

  function diff(label, oldVal, newVal){
    const o = (oldVal||'').toString().trim();
    const n = (newVal||'').toString().trim();
    if(o !== n) changes.push(`${label}: "${o||'-'}" → "${n||'-'}"`);
  }

  diff('ชื่อลูกค้า', c.name, view.je_customerName);
  diff('เบอร์โทร', c.phone, view.je_customerPhone);
  diff('ยี่ห้อ', v.brand, view.je_brand);
  diff('รุ่น', v.model, view.je_model);
  diff('ปี', v.year, view.je_year);
  diff('สี', v.color, view.je_color);
  diff('จังหวัด', v.province, view.je_province);
  diff('เลขไมล์', job.mileageIn, view.je_mileage);

  const newComplaintsList = [
    ...view.je_checked.map(text => ({ text, custom:false })),
    ...view.je_customComplaints.map(text => ({ text, custom:true }))
  ];
  const oldComplaintsText = job.complaints.map(cp => cp.text).sort().join(', ');
  const newComplaintsText = newComplaintsList.map(cp => cp.text).sort().join(', ');
  if(oldComplaintsText !== newComplaintsText){
    changes.push(`อาการที่แจ้ง: "${oldComplaintsText||'-'}" → "${newComplaintsText||'-'}"`);
  }

  if(changes.length === 0){
    flashToast('ไม่มีการเปลี่ยนแปลง');
    view.je_editing = false; view.je_jobId = null;
    render();
    return;
  }

  c.name = view.je_customerName.trim();
  c.phone = view.je_customerPhone.trim();
  v.brand = view.je_brand.trim().toUpperCase();
  v.model = view.je_model.trim().toUpperCase();
  v.year = view.je_year.trim();
  v.color = view.je_color.trim();
  v.province = view.je_province.trim();
  job.mileageIn = view.je_mileage.toString().trim();
  job.complaints = newComplaintsList;

  pushEditLog('edit', job.jobNumber, v.plate, changes.join(' | '));
  saveState(true);
  view.je_editing = false; view.je_jobId = null;
  flashToast('บันทึกการแก้ไขแล้ว');
  render();
}

/* ================= Catalog: สินค้า/อะไหล่กลาง (master parts) ================= */
// Category picker — async, hands the chosen category to a callback. Blank or
// unrecognized input falls back to "ทั่วไป".
function promptCategory(promptText, onPick){
  uiPrompt(
    (promptText || 'หมวดหมู่') + '\n' + PART_CATEGORIES.map((c,i) => (i+1)+'. '+c).join('\n') + '\n\nพิมพ์ตัวเลข หรือชื่อหมวด (เว้นว่าง = ทั่วไป)',
    '',
    answer => {
      const trimmed = (answer || '').trim();
      const byIndex = PART_CATEGORIES[parseInt(trimmed, 10) - 1];
      const byName = PART_CATEGORIES.find(c => c === trimmed);
      onPick(byIndex || byName || 'ทั่วไป');
    }
  );
}

function addMasterPartPrompt(){
  uiPrompt('ชื่ออะไหล่ใหม่', '', name => {
    const trimmed = name.trim();
    if(!trimmed) return;
    if(state.masterParts.some(p => p.name.trim() === trimmed)){ flashToast('มีชื่อนี้อยู่แล้ว'); return; }
    promptCategory('หมวดหมู่ของ "' + trimmed + '"', category => {
      state.masterParts.push({ id: uid(), name: trimmed, category });
      saveState(true);
      flashToast('เพิ่มอะไหล่แล้ว');
      render();
    });
  });
}

function bulkAddMasterParts(){
  const ta = document.getElementById('bulk-parts-input');
  if(!ta) return;
  const lines = ta.value.split('\n').map(l => l.replace(/^\s*\d+[\.\)]?\s*/, '').trim()).filter(Boolean);
  if(lines.length === 0) return;
  promptCategory('หมวดหมู่สำหรับ ' + lines.length + ' รายการนี้ทั้งหมด', category => {
    let added = 0;
    lines.forEach(name => {
      if(!state.masterParts.some(p => p.name === name)){
        state.masterParts.push({ id: uid(), name, category });
        added++;
      }
    });
    ta.value = '';
    saveState(true);
    flashToast(added + ' รายการถูกเพิ่ม');
    render();
  });
}

function deleteMasterPart(id){
  const p = state.masterParts.find(mp => mp.id === id);
  if(!p) return;
  uiConfirm(`ลบ "${p.name}" ออกจากรายการกลาง?\n\nอะไหล่นี้จะถูกลบออกจากรุ่นรถทุกรุ่นที่มีอยู่ด้วย (รวมราคา/แบรนด์ที่เคยใส่ไว้) ยกเลิกไม่ได้`, () => {
    state.masterParts = state.masterParts.filter(mp => mp.id !== id);
    // Remember the deletion so the standard-parts migration doesn't silently re-add
    // this item on the next reload if it happens to be one of the 25 built-in defaults.
    if(!state.deletedMasterPartNames.includes(p.name)) state.deletedMasterPartNames.push(p.name);
    // Cascade: remove the matching part row (by name) from every model too.
    let removedFrom = 0;
    state.models.forEach(m => {
      const before = m.parts.length;
      m.parts = m.parts.filter(part => part.partName !== p.name);
      if(m.parts.length !== before) removedFrom++;
    });
    saveState(true);
    flashToast(removedFrom > 0 ? `ลบออกจาก ${removedFrom} รุ่นแล้ว` : 'ลบแล้ว');
    render();
  }, 'ลบอะไหล่');
}

function onMasterPartCategoryChange(id, value){
  const p = state.masterParts.find(mp => mp.id === id);
  if(!p || !PART_CATEGORIES.includes(value)) return;
  p.category = value;
  saveState(true);
  render();
}

// Renaming an อะไหล่กลาง entry cascades to every รุ่นรถ that has a part with the old
// name, so the master list stays the single source of truth for part names shared
// across the whole catalog. (Renaming a part from inside a specific รุ่นรถ instead —
// via the input on the parts tab — only affects that one model, by design.)
function onMasterPartNameChange(id, value){
  const p = state.masterParts.find(mp => mp.id === id);
  if(!p) return;
  const trimmed = (value || '').trim();
  if(!trimmed || trimmed === p.name){ render(); return; }
  if(state.masterParts.some(mp => mp.id !== id && mp.name === trimmed)){
    flashToast('มีชื่อนี้อยู่แล้ว');
    render();
    return;
  }
  const oldName = p.name;
  p.name = trimmed;
  state.models.forEach(m => {
    (m.parts || []).forEach(part => {
      if(part.partName === oldName) part.partName = trimmed;
    });
  });
  saveState(true);
  render();
}

/* ================= Catalog: parts within a model ================= */
function addExistingPartsToModel(modelId){
  const model = getModel(modelId);
  const checked = Array.from(document.querySelectorAll('.master-check:checked')).map(c => c.value);
  checked.forEach(masterId => {
    const mp = state.masterParts.find(p => p.id === masterId);
    if(mp && !model.parts.some(p => p.partName === mp.name)){
      model.parts.push({ id: uid(), partName: mp.name, category: mp.category || 'ทั่วไป', qty:'', unit:'ชิ้น', brands: [], variant:'' });
    }

// Copies this model's หน่วย (unit) per part — matched by ชื่ออะไหล่ — onto every
// other model's matching parts, so a model with correctly-set units (e.g. ลิตร for
// น้ำมันเครื่อง, คู่ for ปีกนก) can be used as the standard for the whole catalog.
// Parts that don't exist by name on another model, or that model doesn't have that
// part, are left untouched.
function syncUnitsFromModel(modelId){
  const source = getModel(modelId);
  if(!source) return;
  uiConfirm(`คัดลอกหน่วยนับของอะไหล่ทุกรายการจาก "${source.brand||''} ${source.name}" ไปทับหน่วยของรุ่นรถอื่นทั้งหมด?\n\n(จับคู่ตามชื่ออะไหล่ — จะทับหน่วยเดิมของรุ่นอื่น)`, () => {
    const unitByName = {};
    source.parts.forEach(p => { unitByName[p.partName] = p.unit; });
    let updatedParts = 0;
    let updatedModels = 0;
    state.models.forEach(m => {
      if(m.id === modelId) return;
      let changedHere = false;
      m.parts.forEach(p => {
        const u = unitByName[p.partName];
        if(u !== undefined && p.unit !== u){
          p.unit = u;
          updatedParts++;
          changedHere = true;
        }
      });
      if(changedHere) updatedModels++;
    });
    saveState(true);
    flashToast(`อัปเดตหน่วยแล้ว ${updatedParts} รายการ ใน ${updatedModels} รุ่น`);
    render();
  }, 'คัดลอกหน่วย');
}

// Split a part into independent ซ้าย/ขวา rows — each keeps its own qty/unit/brands
// so left and right can end up with completely different code/price if needed.
// Current row becomes "ซ้าย" (keeping its data); a fresh "ขวา" row is inserted after it.
function splitPartLR(modelId, partId){
  const model = getModel(modelId);
  const idx = model.parts.findIndex(p => p.id === partId);
  if(idx === -1) return;
  const part = model.parts[idx];
  if(!part.variant) part.variant = 'ซ้าย';
  const twin = { id: uid(), partName: part.partName, category: part.category, variant: 'ขวา', qty: part.qty, unit: part.unit, brands: [] };
  model.parts.splice(idx + 1, 0, twin);
  saveState(true);
  render();
}

// Duplicate this part as another variant row (covers cases beyond ซ้าย/ขวา — e.g. more
// than one distinct version under the same part name). Staff types the variant label.

  const model = getModel(modelId);

// Active/upcoming/expired based on dateStart/dateEnd (blank = unlimited on that side).
function promoStatus(promo){
  const today = new Date(); today.setHours(0,0,0,0);
  if(promo.dateStart){
    const start = new Date(promo.dateStart); start.setHours(0,0,0,0);
    if(today < start) return 'upcoming';
  }
  if(promo.dateEnd){
    const end = new Date(promo.dateEnd); end.setHours(23,59,59,999);
    if(today > end) return 'expired';
  }
  return 'active';
}
function promoStatusLabel(status){
  return status === 'upcoming' ? 'ยังไม่เริ่ม' : status === 'expired' ? 'หมดอายุ' : 'กำลังใช้งาน';
}

// Each preset's 4 colors are stored darkest-first (sorted by lightness), so they
// map consistently onto the app's dark/accent/border/surface roles regardless of
// what order they were originally given in.
const THEME_PRESETS = [
  { id:'green',  label:'เขียวมะกอก', colors:['#2C3930','#3F4F44','#A27B5C','#DCD7C9'] },
  { id:'slate',  label:'เทาน้ำตาล',  colors:['#222831','#393E46','#948979','#DFD0B8'] },
  { id:'purple', label:'ม่วงเข้ม',   colors:['#18122B','#393053','#443C68','#635985'] }
];

function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  return { r: parseInt(hex.slice(0,2),16)||0, g: parseInt(hex.slice(2,4),16)||0, b: parseInt(hex.slice(4,6),16)||0 };
}
function rgbToHex(r,g,b){
  const c = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,'0');
  return '#' + c(r) + c(g) + c(b);
}
// Blend `hex` toward `toHex` by `ratio` (0 = hex unchanged, 1 = toHex). Used to
// derive readable light surfaces/borders/muted text from a theme's raw colors,
// regardless of how light or dark those raw colors happen to be.
function mixHex(hex, toHex, ratio){
  const a = hexToRgb(hex), b = hexToRgb(toHex);
  return rgbToHex(a.r + (b.r-a.r)*ratio, a.g + (b.g-a.g)*ratio, a.b + (b.b-a.b)*ratio);
}

// Applies (or clears) a theme by overriding the app's :root CSS variables. 'default'
// (or any unknown id) clears overrides, restoring the original built-in colors.
function applyTheme(themeId){
  const root = document.documentElement.style;
  const preset = THEME_PRESETS.find(t => t.id === themeId);
  const vars = ['--dark','--navy','--black','--text','--text-2','--border','--surface','--surface-2'];
  if(!preset){
    vars.forEach(v => root.removeProperty(v));
    return;
  }
  const [c1, c2, c3, c4] = preset.colors;
  root.setProperty('--dark', c1);
  root.setProperty('--navy', c2);
  root.setProperty('--black', c1);
  root.setProperty('--text', c1);
  root.setProperty('--text-2', mixHex(c1, '#ffffff', 0.45));
  root.setProperty('--border', mixHex(c3, '#ffffff', 0.35));
  root.setProperty('--surface', mixHex(c4, '#ffffff', 0.65));
  root.setProperty('--surface-2', mixHex(c4, '#ffffff', 0.5));
}

function setTheme(themeId){
  state.settings = state.settings || {};
  state.settings.themeId = themeId;
  saveState(true);
  applyTheme(themeId);
  render();
}

// Claude AI — for bigger/more complex jobs.
// Turns a raw HTTP status + error body from Claude/Gemini into a short, readable
// Thai message instead of a wall of JSON — especially for quota/billing (429) and
// invalid-key (401/403) cases, which are the most common ones users hit.
function friendlyApiError(provider, status, bodyText){
  const providerName = provider === 'gemini' ? 'Gemini' : 'Claude';
  let msg = bodyText;
  try{
    const parsed = JSON.parse(bodyText);
    const raw = (parsed.error && (parsed.error.message || parsed.error)) || parsed.message || bodyText;
    msg = typeof raw === 'string' ? raw : JSON.stringify(raw);
  }catch(e){ /* keep raw text as-is */ }

  if(status === 429){
    const billingUrl = provider === 'gemini' ? 'Google AI Studio (ai.google.dev)' : 'console.anthropic.com';
    const otherModel = provider === 'gemini' ? 'Claude AI' : 'Gemini';
    return `คำขอเกินโควต้าที่กำหนดของ ${providerName} API (429) — บัญชี/API Key นี้ใช้งานเกินสิทธิ์ที่มีอยู่ในขณะนี้ กรุณาตรวจสอบแผนการใช้งาน/บิลลิ่งที่ ${billingUrl} หรือลองสลับไปใช้ ${otherModel} แทนชั่วคราว`;
  }
  if(status === 401 || status === 403){
    return `API Key ของ ${providerName} ไม่ถูกต้องหรือไม่มีสิทธิ์ใช้งาน กรุณาตรวจสอบ API Key ที่กรอกไว้ในหน้านี้อีกครั้ง`;
  }
  if(status === 529){
    return `เซิร์ฟเวอร์ ${providerName} มีผู้ใช้งานหนาแน่นในขณะนี้ กรุณาลองใหม่อีกครั้งในอีกสักครู่`;
  }
  if(status === 503){
    return `เซิร์ฟเวอร์ ${providerName} มีผู้ใช้งานหนาแน่นชั่วคราว (503) — ระบบลองเรียกซ้ำให้อัตโนมัติแล้วแต่ยังไม่สำเร็จ กรุณากดสรุปงานอีกครั้งในอีกสักครู่`;
  }
  return `เรียก ${providerName} API ไม่สำเร็จ (${status}) ${msg}`.slice(0, 300);
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Status codes worth an automatic retry: transient overload/rate-limit, not
// auth/bad-request errors (those would never succeed on retry).
const RETRYABLE_STATUSES = [429, 503, 529];
const MAX_AI_RETRIES = 2; // total attempts = 1 + this

async function callClaude(apiKey, prompt){
  let lastErr;
  for(let attempt = 0; attempt <= MAX_AI_RETRIES; attempt++){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens: 700,
        messages:[{ role:'user', content: prompt }]
      })
    });
    if(res.ok){
      const data = await res.json();
      return (data.content && data.content[0] && data.content[0].text) || '(ไม่มีผลลัพธ์)';
    }
    const errBody = await res.text();
    lastErr = new Error(friendlyApiError('claude', res.status, errBody));
    if(!RETRYABLE_STATUSES.includes(res.status) || attempt === MAX_AI_RETRIES) throw lastErr;
    await sleep(1200 * (attempt + 1));
  }
  throw lastErr;
}

// Gemini — for everyday/general use. Uses 2.5 Flash-Lite: current stable model with
// the most generous free-tier quota (gemini-2.0-flash was retired by Google).
async function callGemini(apiKey, prompt){
  let lastErr;
  for(let attempt = 0; attempt <= MAX_AI_RETRIES; attempt++){
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=' + encodeURIComponent(apiKey), {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    if(res.ok){
      const data = await res.json();
      const cand = data.candidates && data.candidates[0];
      return (cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text) || '(ไม่มีผลลัพธ์)';
    }
    const errBody = await res.text();
    lastErr = new Error(friendlyApiError('gemini', res.status, errBody));
    if(!RETRYABLE_STATUSES.includes(res.status) || attempt === MAX_AI_RETRIES) throw lastErr;
    await sleep(1200 * (attempt + 1));
  }
  throw lastErr;
}

/* ---------------- Backup: Save / Open (File System Access, overwrite in place) ---------------- */
const BACKUP_FILENAME = "POWER GROUP_GSMS_blackup.json";
const FS_DB_NAME = 'pg-gsms-fs';
const FS_STORE_NAME = 'handles';
const FS_HANDLE_KEY = 'backupFileHandle';

function fsIdbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(FS_STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function fsIdbGet(key){
  return fsIdbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE_NAME, 'readonly');
    const req = tx.objectStore(FS_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function fsIdbSet(key, value){
  return fsIdbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE_NAME, 'readwrite');
    tx.objectStore(FS_STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

async function getBackupFileHandle(forcePick){
  if(!window.showSaveFilePicker) return null;
  if(!forcePick){
    try{
      const saved = await fsIdbGet(FS_HANDLE_KEY);
      if(saved){
        const perm = await saved.queryPermission({ mode:'readwrite' });
        if(perm === 'granted') return saved;
        if(perm === 'prompt'){
          const req = await saved.requestPermission({ mode:'readwrite' });
          if(req === 'granted') return saved;
        }
      }
    }catch(e){ /* handle missing/invalid — fall through to picker */ }
  }
  const handle = await window.showSaveFilePicker({
    suggestedName: BACKUP_FILENAME,
    types: [{ description:'JSON backup', accept: {'application/json':['.json']} }]
  });
  await fsIdbSet(FS_HANDLE_KEY, handle);
  return handle;
}

function downloadBackupFile(dataStr){
  const blob = new Blob([dataStr], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = BACKUP_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  try{
    if(window.showSaveFilePicker){
      const handle = await getBackupFileHandle(false);
      if(handle){
        const writable = await handle.createWritable();
        await writable.write(dataStr);
        await writable.close();
        flashToast('บันทึกทับไฟล์สำรองเดิมแล้ว');
        return;
      }
    }
    downloadBackupFile(dataStr);
    flashToast('บันทึกไฟล์สำรองแล้ว');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    downloadBackupFile(dataStr);
    flashToast('บันทึกไฟล์สำรองแล้ว (ดาวน์โหลดไฟล์ใหม่)');
  }
}

async function chooseBackupLocation(){
  try{
    await getBackupFileHandle(true);
    flashToast('ตั้งตำแหน่งไฟล์บันทึกแล้ว — กด SAVE ครั้งต่อไปจะทับไฟล์นี้');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    flashToast('ตั้งตำแหน่งไฟล์ไม่สำเร็จ');
  }
}

}

function importBackup(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    let parsed;
    try{
      parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.jobs) || !Array.isArray(parsed.vehicles)){
        throw new Error('invalid');
      }
    }catch(e){
      flashToast('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลที่ถูกต้อง');
      evt.target.value = '';
      return;
    }
    if(!isAdmin()){
      flashToast('เฉพาะผู้ดูแลระบบเท่านั้น');
      evt.target.value = '';
      return;
    }
    const counts = `รุ่นรถ ${(parsed.models||[]).length} · อะไหล่กลาง ${(parsed.masterParts||[]).length} · งาน ${(parsed.jobs||[]).length}`;
    uiConfirm(`นำเข้าข้อมูลจากไฟล์นี้?\n${counts}\n\nข้อมูลนี้จะถูกอัปโหลดขึ้นคลาวด์และแทนที่ข้อมูลเดิมทั้งหมด — ทุกเครื่องจะเห็นตรงกันทันที`, () => {
      // Bring the V1 blob up to the current schema before it goes to the cloud.
      state = parsed;
      if(!state.settings) state.settings = emptyState().settings;
      if(!state.shop) state.shop = emptyState().shop;
      if(!Array.isArray(state.deletedMasterPartNames)) state.deletedMasterPartNames = [];
      SYNC_COLLECTIONS.forEach(col => { if(!Array.isArray(state[col])) state[col] = []; });
      ensureCatalogFields();
      ensureModelBrandSplit();
      ensureRequiredModels();
      ensurePartFields();
      ensurePartCategories();
      ensureVehicleModelBrandFix();
      ensureBrandOptions();
      ensureJobFields();
      if(!state.complaintTypes || state.complaintTypes.length === 0){
        state.complaintTypes = DEFAULT_COMPLAINTS.map(name => ({ id: uid(), name }));
      }
      // Any record without an id would be dropped by the diff-based save.
      SYNC_COLLECTIONS.forEach(col => {
        state[col].forEach(row => { if(row && !row.id) row.id = uid(); });
      });
      renderAuthStatus('กำลังอัปโหลดข้อมูลขึ้นคลาวด์...');
      flushState(false);
      setTimeout(() => {
        view.tab = 'joblist'; view.jobId = null; view.modelId = null;
        render();
        flashToast('นำเข้าข้อมูลเรียบร้อยแล้ว');
      }, 900);
    }, 'นำเข้าข้อมูล');
    evt.target.value = '';
  };
  reader.onerror = function(){ flashToast('อ่านไฟล์ไม่สำเร็จ'); evt.target.value=''; };
  reader.readAsText(file);
}

        ${canManageCatalog() ? `<button class="topnav-btn ${settingsActive?'active':''}" onclick="goTab('shop')">${icon('settings')} ตั้งค่า</button>` : ''}
      </div>
    </div>
    <div class="topnav backup-nav">
      <span class="user-chip">
        <span class="sync-dot ${isOnline?'':'offline'}" title="${isOnline?'ซิงค์อยู่':'ออฟไลน์ — จะส่งข้อมูลเมื่อเน็ตกลับมา'}"></span>

    <button class="bn-btn ${view.tab==='ai'?'active':''}" onclick="goTab('ai')">${icon('sparkle',21)}<span>AI</span></button>
    ${canManageCatalog()
      ? `<button class="bn-btn ${settingsActive || view.tab==='blankform'?'active':''}" onclick="goTab('shop')">${icon('settings',21)}<span>ตั้งค่า</span></button>`
      : `<button class="bn-btn" onclick="doLogout()">${icon('x',21)}<span>ออกจากระบบ</span></button>`}
  </nav>`;

  html += `<div class="shell">`;

  if(view.tab === 'bulkprint'){
    html += renderBulkPrintView();
  } else if(view.modelId){
    html += renderModelWorkspace(view.modelId);
  } else if(view.tab === 'detail' && view.jobId){

  } else if(view.tab === 'checkin'){

  } else if(view.tab === 'models'){

function renderJobList(){
  const filtered = getFilteredJobs();
  let html = `<div class="search-bar search-wrap">
    ${icon('search',18)}
    <input type="text" id="job-search-input" placeholder="ค้นหา ทะเบียน / ชื่อลูกค้า / เบอร์โทร / Job No." value="${escapeAttr(view.search)}" oninput="onSearchInput(this.value)">
  </div>`;

  const counts = { all: state.jobs.length };
  STATUS_FLOW.forEach(s => counts[s.key] = state.jobs.filter(j => j.status === s.key).length);
  html += `<div class="status-pills">
    <button class="status-pill ${view.statusFilter==='all'?'active':''}" onclick="setStatusFilter('all')">ทั้งหมด <span class="n">${counts.all}</span></button>`;
  STATUS_FLOW.forEach(s => {
    html += `<button class="status-pill ${view.statusFilter===s.key?'active':''}" onclick="setStatusFilter('${s.key}')"><span class="sw ${s.cls}"></span>${escapeHtml(s.label)} <span class="n">${counts[s.key]}</span></button>`;
  });
  html += `</div>`;

  if(filtered.length === 0){
    html += `<div class="empty-state">ไม่พบงานที่ตรงกับเงื่อนไข</div>`;
    return html;
  }

  html += `<div class="job-grid">`;
  filtered.forEach(job => {
    const v = getVehicle(job.vehicleId) || {};
    const c = getCustomer(job.customerId) || {};
    const st = statusOf(job.status);
    const stIdx = STATUS_FLOW.findIndex(x => x.key === job.status);
    const nextSt = stIdx > -1 && stIdx < STATUS_FLOW.length - 1 ? STATUS_FLOW[stIdx + 1] : null;
    const thumb = jobThumb(job);
    html += `<div class="job-card ${st.cls}">
      <div class="jc-main" onclick="openJob('${job.id}')">
        ${thumb
          ? `<img class="jc-thumb" src="${thumb}" alt="">`
          : `<div class="jc-thumb jc-thumb-empty">${icon('camera',20)}</div>`}
        <div class="jc-left">
          <div class="plate">
            <span class="plate-box">${escapeHtml(v.plate||'-')}</span>
            ${job.queueNo ? `<span class="jc-queue">คิว ${escapeHtml(job.queueNo)}</span>` : ''}
          </div>
          <div class="meta">${escapeHtml(v.brand||'')} ${escapeHtml(v.model||'')}${v.color ? ' · '+escapeHtml(v.color) : ''}</div>
          <div class="meta">${escapeHtml(c.name||'-')}</div>
          <div class="jn mono">${escapeHtml(job.jobNumber)} · ${fmtDT(job.createdAt)}</div>
        </div>
        <span class="badge ${st.cls}">${escapeHtml(st.label)}</span>
      </div>
      <div class="jc-actions">
        <div class="jc-steps">${STATUS_FLOW.map((s, i) =>
          `<span class="jc-dot ${i <= stIdx ? 'done' : ''} ${i === stIdx ? 'now' : ''}" title="${escapeAttr(s.label)}"></span>`
        ).join('')}</div>
        <button class="btn secondary small" onclick="openStatusPicker('${job.id}', event)">เปลี่ยนสถานะ</button>
        ${nextSt ? `<button class="btn small hazard" onclick="setJobStatusFromList('${job.id}','${nextSt.key}', event)">${escapeHtml(nextSt.label)} ${icon('forward',12)}</button>` : ''}
        ${canDeleteJobs() ? `<button class="jc-del" title="ลบรายการนี้" onclick="deleteJobFromList('${job.id}', event)">${icon('trash',15)}</button>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// Short d/m/yy date in Thai Buddhist Era (e.g. 9/7/69), used for the LINE group post.
function fmtDateBE(iso){
  const d = iso ? new Date(iso) : new Date();
  const beYear = d.getFullYear() + 543;
  return `${d.getDate()}/${d.getMonth()+1}/${String(beYear).slice(-2)}`;
}

// A customer counts as "ลูกค้าเดิม" (repeat) if they have any other job on file.
function isRepeatCustomer(customerId, excludeJobId){
  return state.jobs.some(j => j.customerId === customerId && j.id !== excludeJobId);
}

function onLineFieldInput(field, value){ view[field] = value; render(); }

function onJobQueueNoChange(jobId, value){
  const job = getJob(jobId);
  if(!job) return;
  job.queueNo = (value || '').trim();
  saveState(true);
  render();
}

/* ---------------- Job detail: quote parts (added after the mechanic inspects) ----------------
   A job normally starts with no parts at all — staff check the car in, print ใบรับรถ, hand it
   to the mechanic, and only then add the parts to be quoted. These helpers edit job.partsNeeded
   directly (a snapshot on the job, independent of the รุ่นรถ catalog it was seeded from). */
function getJobModel(job){
  const v = getVehicle(job.vehicleId);
  if(!v || !v.model) return null;
  return state.models.find(m => m.name === v.model) || null;
}

function jobPartsTotal(job){
  return (job.partsNeeded || []).reduce((sum, p) => {
    const price = parseFloat(p.price);
    if(!price) return sum;
    const qty = parseFloat(p.qty) || 1;
    return sum + price * qty;
  }, 0);
}

// Chip click in the "เลือกจากรุ่นรถ" picker: adds the part if not on the job yet,
// removes it if it is (matched on partName + variant, since job rows are snapshots).
function toggleJobPartFromModel(jobId, modelPartId){
  const job = getJob(jobId);
  if(!job) return;
  // Works for both sources — catalog model parts and the master-parts fallback,
  // which uses synthetic "master-<id>" keys (see jobPickableParts).
  const mp = jobPickableParts(job).items.find(p => p.id === modelPartId);
  if(!mp) return;
  const existingIdx = job.partsNeeded.findIndex(p => p.partName === mp.partName && (p.variant||'') === (mp.variant||''));
  if(existingIdx > -1){
    job.partsNeeded.splice(existingIdx, 1);
  } else {
    const firstPriced = (mp.brands || []).find(b => b.price);
    job.partsNeeded.push({
      id: uid(), partName: mp.partName, variant: mp.variant || '',
      qty: mp.qty || '', unit: mp.unit || 'ชิ้น',
      brand: firstPriced ? (firstPriced.brand || '') : '',
      price: firstPriced ? (firstPriced.price || '') : '',
      note: ''
    });
  }
  saveState(true);
  render();
}

function addCustomJobPart(jobId){
  const job = getJob(jobId);
  if(!job) return;
  uiPrompt('ชื่อรายการที่ต้องการเพิ่ม (เช่น ค่าแรง, อะไหล่นอกรายการ)', '', name => {
    const trimmed = name.trim();
    if(!trimmed) return;
    job.partsNeeded.push({ id: uid(), partName: trimmed, variant:'', qty:'1', unit:'ชิ้น', brand:'', price:'', note:'' });
    saveState(true);
    render();
  });
}

function onJobPartFieldChange(jobId, partRowId, field, value){
  const job = getJob(jobId);
  if(!job) return;
  const row = job.partsNeeded.find(p => p.id === partRowId);
  if(!row) return;
  row[field] = value;
  saveState(true);
  render();
}

function removeJobPart(jobId, partRowId){
  const job = getJob(jobId);
  if(!job) return;
  job.partsNeeded = job.partsNeeded.filter(p => p.id !== partRowId);
  saveState(true);
  render();
}

function clearJobParts(jobId){
  const job = getJob(jobId);
  if(!job || job.partsNeeded.length === 0) return;
  uiConfirm(`ล้างรายการอะไหล่ทั้งหมดของงานนี้? (${job.partsNeeded.length} รายการ)`, () => {
    job.partsNeeded = [];
    saveState(true);
    flashToast('ล้างรายการแล้ว');
    render();
  }, 'ล้างทั้งหมด');
}

// Pull in every pickable part at once (skipping any already added). Uses the same
// source as the chip picker, so it works for hand-typed models too.
function addAllModelPartsToJob(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const picker = jobPickableParts(job);
  if(!picker.items.length) return;
  let added = 0;
  picker.items.forEach(mp => {
    const exists = job.partsNeeded.some(p => p.partName === mp.partName && (p.variant||'') === (mp.variant||''));
    if(exists) return;
    const firstPriced = (mp.brands || []).find(b => b.price);
    job.partsNeeded.push({
      id: uid(), partName: mp.partName, variant: mp.variant || '',
      qty: mp.qty || '', unit: mp.unit || 'ชิ้น',
      brand: firstPriced ? (firstPriced.brand || '') : '',
      price: firstPriced ? (firstPriced.price || '') : '',
      note: ''
    });
    added++;
  });
  saveState(true);
  flashToast(added + ' รายการถูกเพิ่ม');
  render();
}

// Builds the exact plain-text format staff post to the shop's LINE group right
// after check-in: queue no. + date, customer (+ repeat tag), phone, plate,
// brand/model, color, optional prior-visit note (repeat customers only),
// symptoms, optional price note, closing line.
function buildLineSummaryText(job){
  const v = getVehicle(job.vehicleId) || {};
  const c = getCustomer(job.customerId) || {};
  const repeat = isRepeatCustomer(job.customerId, job.id);
  const q = (job.queueNo || view.line_queueNo || '').trim();
  const lines = [];
  lines.push(`คิวที่${q ? ' ('+q+')' : ''} ${fmtDateBE(job.createdAt)}`);
  lines.push(`คุณ${c.name || '-'}${repeat ? ' (ลูกค้าเดิม)' : ''}`);
  lines.push(c.phone || '-');
  lines.push(`${v.plate || '-'}${v.province || ''}`);
  lines.push(`${v.brand || ''} ${v.model || ''}`.trim() || '-');
  lines.push(v.color || '-');
  if(repeat && ((view.line_prevDate||'').trim() || (view.line_prevWork||'').trim())){
    if((view.line_prevDate||'').trim()) lines.push(`เข้าทำ ${view.line_prevDate.trim()}`);
    if((view.line_prevWork||'').trim()) lines.push(`- ${view.line_prevWork.trim()}`);
  }
  lines.push('อาการ');
  if(job.complaints.length === 0){
    lines.push('- ไม่มีข้อมูล');
  } else {
    job.complaints.forEach(cp => lines.push(`- ${cp.text}`));
  }
  if((view.line_priceNote||'').trim()) lines.push(`(${view.line_priceNote.trim()})`);
  lines.push('รอเช็ค');
  return lines.join('\n');
}

function copyLineSummary(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const text = buildLineSummaryText(job);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      flashToast('คัดลอกข้อความแล้ว');
    }).catch(()=>{
      flashToast('คัดลอกไม่สำเร็จ (เบราว์เซอร์นี้อาจต้องเปิดผ่าน HTTPS)');
    });
  }
}

/* Parts / quote editor on the job detail page. Staff use this after the mechanic has
   inspected the car: pick parts off the vehicle's รุ่นรถ catalog (or add free-text
   rows), set qty + price, then print ใบเสนอราคา for the customer to approve. */
/* The pickable parts for a job. If the vehicle matches a รุ่นรถ in the catalog we use
   that model's list (it carries qty + brand prices). If the model was typed by hand and
   isn't in the catalog, fall back to the master parts list so there is ALWAYS something
   to tick — previously those jobs got no picker at all and everything had to be typed. */
function jobPickableParts(job){
  const model = getJobModel(job);
  if(model && model.parts && model.parts.length){
    return { source:'model', label:`${model.brand||''} ${model.name}`.trim(), items: model.parts };
  }
  const items = (state.masterParts || []).map(mp => ({
    id: 'master-' + mp.id, partName: mp.name, category: mp.category, qty:'', unit:'ชิ้น', brands: [], variant:''
  }));
  return { source:'master', label:'รายการอะไหล่กลาง', items };
}

      <div class="job-total-row"><span>รวมราคาทั้งหมด</span><strong class="mono">${fmtMoney(total)} บาท</strong></div>`;
  }

  html += `<div class="row-flex" style="margin-top:12px;">
    <button class="btn secondary small" onclick="addCustomJobPart('${job.id}')">+ เพิ่มรายการเอง</button>
    ${picker.items.length ? `<button class="btn secondary small" onclick="addAllModelPartsToJob('${job.id}')">+ เพิ่มทั้งหมด${picker.source === 'model' ? 'จากรุ่นรถ' : ''}</button>` : ''}
    ${parts.length > 0 ? `<button class="btn danger small" onclick="clearJobParts('${job.id}')">ล้างทั้งหมด</button>` : ''}
    <button class="btn small" onclick="printJobQuote('${job.id}')">${icon('printer',13)} พิมพ์ใบเสนอราคา</button>
  </div>`;

  if(picker.items.length){
    html += `<div style="margin-top:16px;">
      <div class="muted" style="margin-bottom:8px;">
        เลือกจาก${picker.source === 'model' ? 'รุ่นรถ' : 'รายการกลาง'} — ${escapeHtml(picker.label)} (แตะเพื่อเพิ่ม/เอาออก)
        ${picker.source === 'master' ? '<br>รถคันนี้ไม่ได้ผูกกับรุ่นรถในระบบ จึงแสดงรายการอะไหล่กลางให้เลือกแทน (ราคาต้องกรอกเอง)' : ''}
      </div>`;
    groupByCategory(picker.items).forEach(group => {
      html += `<div class="chk-cat-label">${escapeHtml(group.category)}</div><div class="checklist-grid">`;
      group.items.forEach(mp => {
        const on = parts.some(p => p.partName === mp.partName && (p.variant||'') === (mp.variant||''));
        const label = mp.variant ? `${mp.partName} (${mp.variant})` : mp.partName;
        html += `<span class="chk-chip ${on?'checked':''}" onclick="toggleJobPartFromModel('${job.id}','${mp.id}')">${escapeHtml(label)}</span>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  } else {
    html += `<p class="muted" style="margin-top:12px;">ยังไม่มีรายการอะไหล่กลางในระบบ — ใช้ "+ เพิ่มรายการเอง" แทน</p>`;
  }

  html += `</div>`;
  return html;
}

/* Printable "ใบรับรถ" page for a saved job — styled like the รุ่นรถ print page
   (same pv-* classes/banner/table/signatures), hidden on screen, shown only when printing. */
function renderJobPrintPage(job){
  const st = statusOf(job.status);

  let html = `<div class="preview-page job-print-page">
    ${renderJobFormHeader(job, 'ใบรับรถ', `วันที่รับรถ ${fmtDT(job.createdAt)} · สถานะ: ${st.label}`)}
    <div class="pv-body">
      <div class="pv-section-title">อาการ / รายละเอียดที่แจ้ง</div>`;

  if(job.complaints.length === 0){
    html += `<p class="muted">ไม่มีข้อมูลอาการ</p>`;
  } else {
    html += `<div class="pv-tags">`;
    job.complaints.forEach(cp => { html += `<span class="pv-tag">${escapeHtml(cp.text)}</span>`; });
    html += `</div>`;
  }

  if(job.partsNeeded && job.partsNeeded.length > 0){
    html += `<div class="pv-section-title">รายการอะไหล่ที่คาดว่าจะใช้ (${job.partsNeeded.length})</div>
    <table class="pv-table">
      <colgroup><col style="width:10%"><col style="width:65%"><col style="width:25%"></colgroup>
      <thead><tr><th class="center">ลำดับ</th><th>รายการอะไหล่</th><th class="center">จำนวนที่ใช้</th></tr></thead>
      <tbody>`;
    job.partsNeeded.forEach((p, idx) => {
      const qtyText = p.qty ? escapeHtml(p.qty) + ' ' + escapeHtml(p.unit||'') : '-';
      const nameText = p.variant ? `${escapeHtml(p.partName)} <span class="muted">(${escapeHtml(p.variant)})</span>` : escapeHtml(p.partName);
      html += `<tr><td class="center">${idx+1}</td><td>${nameText}</td><td class="center">${qtyText}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  html += `<div class="pv-foot">* กรุณาตรวจสอบ และนำทรัพย์สินมีค่า หรือคุณค่าทางจิตใจออกจากตัวรถของท่าน หากมีการสูญเสีย สูญหายทางร้านจะไม่มีการรับผิดชอบใดๆทั้งสิ้น</div>

    <div class="pv-signatures">
      <div class="pv-sign-box"><span class="pv-sign-line"></span><div class="pv-sign-label">เจ้าหน้าที่รับรถ</div></div>
      <div class="pv-sign-box"><span class="pv-sign-line"></span><div class="pv-sign-label">ลูกค้า (รับทราบ)</div></div>
    </div>
  </div>
  </div>`;

  return html;
}

/* Printable "ใบเสนอราคา" for a saved job — the second half of the workflow: printed
   after the mechanic has inspected and the parts/prices have been filled in, for the
   customer to approve. Carries three signature lines (ผู้ตรวจเช็ค / ผู้เสนอราคา / ลูกค้าอนุมัติ). */
function renderJobQuotePage(job){
  const parts = job.partsNeeded || [];
  const total = jobPartsTotal(job);

  // Identical header to ใบรับรถ — see renderJobFormHeader.
  let html = `<div class="preview-page job-print-page">
    ${renderJobFormHeader(job, 'ใบเสนอราคา', `วันที่ ${fmtDT(nowIso())} · รับรถเมื่อ ${fmtDT(job.createdAt)}`)}
    <div class="pv-body">`;

  if(job.complaints && job.complaints.length > 0){
    html += `<div class="pv-section-title">อาการ / รายละเอียดที่แจ้ง</div><div class="pv-tags">`;
    job.complaints.forEach(cp => { html += `<span class="pv-tag">${escapeHtml(cp.text)}</span>`; });
    html += `</div>`;
  }

  html += `<div class="pv-section-title">รายการอะไหล่ / เสนอราคา (${parts.length})</div>`;

  if(parts.length === 0){
    html += `<p class="muted">ยังไม่มีรายการเสนอราคา</p>`;
  } else {
    html += `<table class="pv-table">
      <colgroup><col style="width:6%"><col style="width:34%"><col style="width:13%"><col style="width:14%"><col style="width:16%"><col style="width:17%"></colgroup>
      <thead><tr>
        <th class="center">ลำดับ</th><th>รายการอะไหล่</th><th class="center">จำนวน</th>
        <th>แบรนด์</th><th class="center">ราคา/หน่วย</th><th class="center">รวม (บาท)</th>
      </tr></thead><tbody>`;
    parts.forEach((p, idx) => {
      const qtyNum = parseFloat(p.qty) || 1;
      const priceNum = parseFloat(p.price) || 0;
      const qtyText = p.qty ? escapeHtml(p.qty) + ' ' + escapeHtml(p.unit||'') : '-';
      const nameText = p.variant ? `${escapeHtml(p.partName)} <span class="muted">(${escapeHtml(p.variant)})</span>` : escapeHtml(p.partName);
      html += `<tr>
        <td class="center">${idx+1}</td>
        <td>${nameText}</td>
        <td class="center">${qtyText}</td>
        <td>${escapeHtml(p.brand||'-')}</td>
        <td class="center">${priceNum ? fmtMoney(priceNum) : '-'}</td>
        <td class="center">${priceNum ? fmtMoney(priceNum * qtyNum) : '-'}</td>
      </tr>`;
    });
    html += `</tbody></table>
      <div class="pv-price-summary">
        <span class="pv-price-total-label">รวมราคาทั้งหมด</span>
        <span class="pv-price-total-value mono">${fmtMoney(total)}</span>
        <span class="pv-price-total-label">บาท</span>
      </div>`;
  }

  html += `<div class="pv-foot">* ราคานี้เป็นราคาประเมินเบื้องต้น อาจเปลี่ยนแปลงได้หากพบความเสียหายเพิ่มเติมระหว่างซ่อม ทางร้านจะแจ้งให้ทราบก่อนดำเนินการทุกครั้ง</div>

    <div class="pv-signatures">
      <div class="pv-sign-box"><span class="pv-sign-line"></span><div class="pv-sign-label">ผู้ตรวจเช็ค</div></div>
      <div class="pv-sign-box"><span class="pv-sign-line"></span><div class="pv-sign-label">ผู้เสนอราคา</div></div>
      <div class="pv-sign-box"><span class="pv-sign-line"></span><div class="pv-sign-label">ลูกค้าอนุมัติ</div></div>
    </div>
  </div>
  </div>`;

  return html;
}

/* ================= Catalog: renders (รุ่นรถ / สินค้า-อะไหล่กลาง / ตั้งค่า / print) ================= */
function renderModelsTab(){
  const selecting = !!view.selectMode;
  const selectedIds = view.selectedModelIds || [];
  const filtered = getFilteredModels();
  const brands = Array.from(new Set(state.models.map(m => m.brand))).sort();
  const hasActiveFilter = !!(view.modelSearch || (view.modelBrandFilter && view.modelBrandFilter !== 'all'));

  let html = `<div class="search-filter-bar no-print">
    <div class="search-input search-wrap">
      ${icon('search',18)}
      <input type="text" id="model-search-input" placeholder="ค้นหารุ่นรถ (ชื่อรุ่นหรือปี)..." value="${escapeAttr(view.modelSearch)}" oninput="onModelSearchInput(this.value)">
    </div>
    <select class="filter-select" onchange="onModelBrandFilterChange(this.value)">
      <option value="all" ${view.modelBrandFilter==='all'?'selected':''}>ทุกยี่ห้อ</option>
      ${brands.map(b => `<option value="${escapeAttr(b)}" ${view.modelBrandFilter===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}
    </select>
    ${hasActiveFilter ? `<button class="btn secondary small" onclick="clearModelSearch()">ล้างตัวกรอง</button>` : ''}
    <span class="select-hint">แสดง ${filtered.length} จาก ${state.models.length} รุ่น</span>
  </div>`;

  html += `<div class="models-toolbar no-print">`;
  if(!selecting){
    html += `<button class="btn secondary" onclick="toggleSelectMode()">${icon('printer',15)} เลือกพิมพ์หลายรุ่น</button>`;
  } else {
    html += `<span class="select-hint">เลือกแล้ว ${selectedIds.length} รุ่น</span>
      <button class="btn secondary small" onclick="selectAllModels()">เลือกทั้งหมด (ที่แสดง)</button>
      <button class="btn secondary small" onclick="clearModelSelection()">ล้างที่เลือก</button>
      <button class="btn small" onclick="openBulkPrint()" ${selectedIds.length===0?'disabled':''}>${icon('printer',13)} พิมพ์ที่เลือก (${selectedIds.length})</button>
      <button class="btn danger small" onclick="toggleSelectMode()">ยกเลิก</button>`;
  }
  html += `</div>`;

  html += `<div class="model-grid">`;
  if(filtered.length === 0){
    html += `<div class="empty-state" style="grid-column:1/-1;">ไม่พบรุ่นรถที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
  } else {
    filtered.forEach(m => {
      const checked = selectedIds.includes(m.id);
      const clickAction = selecting ? `toggleModelSelect('${m.id}')` : `openModel('${m.id}')`;
      html += `<div class="model-card ${selecting?'selectable':''} ${checked?'selected':''}" onclick="${clickAction}">`;
      if(selecting){
        html += `<span class="select-check ${checked?'checked':''}">${checked?icon('check',12):''}</span>`;
      } else {
        html += `<button class="del" title="ลบรุ่นนี้" onclick="deleteModel('${m.id}', event)">${icon('x',13)}</button>`;
      }
      html += `<div class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</div>
        <div class="year">${escapeHtml(m.yearRange||'')}</div>
        <div class="count">${m.parts.length} อะไหล่ · ${m.promotions.length} โปรโมชั่น</div>
      </div>`;
    });
  }
  if(!selecting){
    html += `<div class="add-model-card" onclick="addModelPrompt()">+ เพิ่มรุ่นรถใหม่</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------------- ตำราราคา (parts price book, all models, read-only reference) ---------------- */
function getPriceBookModels(){
  if(Array.isArray(view.pb_printFilterIds)){
    const idSet = view.pb_printFilterIds;
    return state.models.filter(m => idSet.includes(m.id));
  }
  const q = (view.pb_query || '').trim().toLowerCase();
  const brand = view.pb_brand || 'all';
  return state.models.filter(m => {
    if(brand !== 'all' && m.brand !== brand) return false;
    if(!q) return true;
    const inModel = (m.name||'').toLowerCase().includes(q) || (m.brand||'').toLowerCase().includes(q) || (m.yearRange||'').toLowerCase().includes(q);
    const inParts = (m.parts||[]).some(p => (p.partName||'').toLowerCase().includes(q));
    return inModel || inParts;
  });
}
function onPbSearchInput(value){
  view.pb_query = value;
  const el = document.getElementById('pb-search-input');
  const cursorPos = el ? el.selectionStart : null;
  render();
  const newEl = document.getElementById('pb-search-input');
  if(newEl && cursorPos !== null){
    newEl.focus();
    newEl.setSelectionRange(cursorPos, cursorPos);
  }
}
function onPbBrandFilterChange(value){ view.pb_brand = value; render(); }
function clearPbFilter(){ view.pb_query = ''; view.pb_brand = 'all'; render(); }
function pbJumpTo(anchorId){
  const el = document.getElementById(anchorId);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---- เลือกพิมพ์เฉพาะรุ่น ---- */
function togglePbSelectMode(){
  view.pb_selectMode = !view.pb_selectMode;
  view.pb_selectedIds = [];
  view.pb_printFilterIds = null;
  render();
}
function togglePbModelSelect(modelId){
  const ids = view.pb_selectedIds || (view.pb_selectedIds = []);
  const i = ids.indexOf(modelId);
  if(i === -1) ids.push(modelId); else ids.splice(i, 1);
  render();
}
function selectAllPbModels(){
  view.pb_selectedIds = getPriceBookModels().map(m => m.id);
  render();
}
function clearPbSelection(){
  view.pb_selectedIds = [];
  render();
}
function confirmPbPrintSelection(){
  if(!view.pb_selectedIds || view.pb_selectedIds.length === 0) return;
  view.pb_printFilterIds = view.pb_selectedIds.slice();
  view.pb_selectMode = false;
  render();
}
function clearPbPrintFilter(){
  view.pb_printFilterIds = null;
  render();
}

function renderPbPriceCell(part){
  const brands = part.brands || [];
  if(brands.length === 0) return `<span class="muted">— ยังไม่ตั้งราคา —</span>`;
  return brands.map(b => {
    const label = b.brand ? escapeHtml(b.brand) : 'ไม่ระบุแบรนด์';
    return `<div class="pb-price-line"><span class="pb-price-brand">${label}</span><span class="pb-price">฿${fmtMoney(b.price)}</span></div>`;
  }).join('');
}

function renderPriceBookTab(){
  const printFilterActive = Array.isArray(view.pb_printFilterIds);

  const selectedIds = view.pb_selectedIds || [];
  const q = view.pb_query || '';
  const brand = view.pb_brand || 'all';
  const brands = Array.from(new Set(state.models.map(m => m.brand))).filter(Boolean).sort();

      <button class="back-link" onclick="clearPbPrintFilter()">${icon('back',15)} กลับไปดูทั้งหมด</button>

      <button class="btn secondary small" onclick="window.print()">${icon('printer',13)} พิมพ์ตำรา (ทั้งหมด)</button>` : ''}
    </div>`;

    if(selecting){
      html += `<div class="models-toolbar no-print">
        <span class="select-hint">เลือกแล้ว ${selectedIds.length} รุ่น</span>
        <button class="btn secondary small" onclick="selectAllPbModels()">เลือกทั้งหมด (ที่แสดง)</button>
        <button class="btn secondary small" onclick="clearPbSelection()">ล้างที่เลือก</button>
        <button class="btn small" onclick="confirmPbPrintSelection()" ${selectedIds.length===0?'disabled':''}>${icon('printer',13)} พิมพ์ที่เลือก (${selectedIds.length})</button>
        <button class="btn danger small" onclick="togglePbSelectMode()">ยกเลิก</button>
      </div>`;
    }
  }

  if(selecting){
    html += `<div class="model-grid no-print">`;
    if(filtered.length === 0){
      html += `<div class="empty-state" style="grid-column:1/-1;">ไม่พบรุ่นรถที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
    } else {
      filtered.forEach(m => {
        const checked = selectedIds.includes(m.id);
        html += `<div class="model-card selectable ${checked?'selected':''}" onclick="togglePbModelSelect('${m.id}')">
          <span class="select-check ${checked?'checked':''}">${checked?icon('check',12):''}</span>
          <div class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</div>
          <div class="year">${escapeHtml(m.yearRange||'')}</div>
          <div class="count">${m.parts.length} อะไหล่</div>
        </div>`;
      });
    }
    html += `</div>`;
    return html;
  }

  if(filtered.length === 0){
    html += `<div class="empty-state">ไม่พบรุ่นรถหรืออะไหล่ที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
    return html;
  }

  const byBrand = {};
  const brandOrder = [];
  filtered.forEach(m => {
    const b = m.brand || 'ไม่ระบุยี่ห้อ';
    if(!byBrand[b]){ byBrand[b] = []; brandOrder.push(b); }

  });
  brandOrder.sort((a,b) => a.localeCompare(b, 'th'));

  html += `<div class="pb-toc no-print">${brandOrder.map(b => `<button class="pb-toc-chip" onclick="pbJumpTo('pb-brand-${escapeAttr(b)}')">${escapeHtml(b)} (${byBrand[b].length})</button>`).join('')}</div>`;

  html += `<div class="pb-page">`;
  const s = state.shop;
  html += `<div class="pb-cover">

  </div>`;

  brandOrder.forEach(b => {
    html += `<div class="pb-brand-heading" id="pb-brand-${escapeAttr(b)}">${escapeHtml(b)}</div>`;
    byBrand[b].forEach(m => {
      html += `<div class="pb-model-block">
        <div class="pb-model-head">
          <span class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</span>

      if(!m.parts || m.parts.length === 0){
        html += `<div class="empty-state" style="padding:12px 14px;">ยังไม่มีรายการอะไหล่</div>`;
      } else {
        html += `<table class="pb-table">
          <colgroup><col style="width:55%"><col style="width:45%"></colgroup>
          <thead><tr><th>รายการอะไหล่</th><th>ราคา</th></tr></thead><tbody>`;
        groupByCategory(m.parts).forEach(group => {
          html += `<tr class="pb-cat-row"><td colspan="2" class="pb-cat-header">${escapeHtml(group.category)}</td></tr>`;
          group.items.forEach(part => {
            html += `<tr>
              <td>${escapeHtml(part.partName)}${part.variant ? ' ('+escapeHtml(part.variant)+')' : ''}</td>
              <td>${renderPbPriceCell(part)}</td>
            </tr>`;
          });
        });
        html += `</tbody></table>`;
      }
      html += `</div>`;
    });
  });
  html += `</div>`;

  return html;
}

/* ---------------- QR for the waiting-room board ----------------
   The encoder is pulled from a CDN on demand rather than bundled — it's only ever
   needed on this one settings card, and the app is online by definition. */
function ensureQrLib(){
  if(window.QRCode) return Promise.resolve(true);
  if(window.__qrLoading) return window.__qrLoading;
  window.__qrLoading = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  return window.__qrLoading;
}

function drawBoardQr(){
  const box = document.getElementById('qr-box');
  if(!box) return;
  ensureQrLib().then(ok => {
    const el = document.getElementById('qr-box');
    if(!el) return;
    if(!ok){
      el.innerHTML = '<span class="muted">สร้าง QR ไม่สำเร็จ<br>(ต้องต่ออินเทอร์เน็ต)</span>';
      return;
    }
    el.innerHTML = '';
    new QRCode(el, {
      text: boardUrl(),
      width: 190, height: 190,
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

function copyBoardUrl(){
  const url = boardUrl();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(() => flashToast('คัดลอกลิงก์แล้ว'))
      .catch(() => flashToast('คัดลอกไม่สำเร็จ'));
  }
}

// Opens a clean, print-ready sign in a new window so printing the QR doesn't drag
// the whole settings page along with it.
function printBoardQr(){
  ensureQrLib().then(ok => {
    if(!ok){ flashToast('สร้าง QR ไม่สำเร็จ'); return; }
    const holder = document.createElement('div');
    new QRCode(holder, { text: boardUrl(), width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => {
      const img = holder.querySelector('img');
      const cvs = holder.querySelector('canvas');
      const src = img ? img.src : (cvs ? cvs.toDataURL() : '');
      if(!src){ flashToast('สร้าง QR ไม่สำเร็จ'); return; }
      const shopName = (state.shop && state.shop.name) || 'POWER GROUP';
      const w = window.open('', '_blank');
      if(!w){ flashToast('เบราว์เซอร์บล็อกหน้าต่างใหม่'); return; }
      w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
        <title>QR สถานะรถ</title>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap');
          @page{size:A4;margin:18mm;}
          body{font-family:'Noto Sans Thai',sans-serif;text-align:center;color:#222831;margin:0;}
          .stripe{height:10px;background:repeating-linear-gradient(45deg,#E8BB2D 0 14px,#222831 14px 28px);
                  -webkit-print-color-adjust:exact;print-color-adjust:exact;}
          h1{font-size:34px;margin:34px 0 6px;letter-spacing:.5px;}
          h2{font-size:21px;font-weight:600;margin:0 0 30px;color:#6b7684;}
          img{width:420px;height:420px;}
          .hint{font-size:20px;font-weight:600;margin-top:26px;}
          .sub{font-size:15px;color:#6b7684;margin-top:8px;line-height:1.8;}
        </style></head><body>
        <div class="stripe"></div>
        <h1>${escapeHtml(shopName)}</h1>
        <h2>สแกนเพื่อดูสถานะรถของท่าน</h2>
        <img src="${src}" alt="QR">
        <div class="hint">สแกนแล้วดูได้ทันที ไม่ต้องสมัครหรือล็อกอิน</div>
        <div class="sub">ค้นหารถของท่านจาก <b>หมายเลขคิว</b> ที่ได้รับตอนฝากรถ<br>หน้าจอจะอัปเดตสถานะให้อัตโนมัติ</div>
        </body></html>`);
      w.document.close();
      setTimeout(() => { w.focus(); w.print(); }, 700);
    }, 250);
  });
}

function loadUsersList(){
  if(!isAdmin() || !db) return;
  view.usersLoaded = false;
  render();
  db.collection('users').get()
    .then(snap => {
      const rows = [];
      snap.forEach(doc => rows.push(Object.assign({}, doc.data(), { id: doc.id })));
      rows.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'th'));
      view.usersList = rows;
      view.usersLoaded = true;
      render();
    })
    .catch(err => {
      view.usersLoaded = true;
      flashToast('โหลดรายชื่อไม่สำเร็จ: ' + (err.message||err.code));
      render();
    });
}

function addUserAccess(){
  uiPrompt('วาง User UID ที่ก๊อปมาจาก Firebase Console\n(Authentication → คอลัมน์ User UID)', '', uidValue => {
    const targetUid = (uidValue||'').trim();
    if(!targetUid) return;
    uiPrompt('ชื่อที่จะแสดงในระบบ (เช่น ช่างเอ)', '', name => {
      const displayName = (name||'').trim();
      if(!displayName) return;
      uiPrompt('อีเมลที่ใช้ล็อกอิน (ไว้ดูอ้างอิงเฉยๆ)', '', email => {
        uiChoice('ให้สิทธิ์ระดับไหน?', [
          { value:'staff', label:'พนักงาน — รับรถ เปลี่ยนสถานะ ใส่ราคา' },
          { value:'admin', label:'ผู้ดูแลระบบ — ทำได้ทุกอย่าง' }
        ], role => {
          db.collection('users').doc(targetUid)
            .set({ name: displayName, email: (email||'').trim(), role })
            .then(() => { flashToast('เพิ่มสิทธิ์ให้ ' + displayName + ' แล้ว'); loadUsersList(); })
            .catch(err => flashToast('บันทึกไม่สำเร็จ: ' + (err.message||err.code)));
        });
      });
    });
  });
}

function onUserFieldChange(targetUid, field, value){
  if(!isAdmin() || !db) return;
  if(targetUid === currentUser.uid && field === 'role'){
    flashToast('เปลี่ยนสิทธิ์ของตัวเองไม่ได้');
    render();
    return;
  }
  const patch = {};
  patch[field] = (value||'').trim();
  db.collection('users').doc(targetUid).update(patch)
    .then(() => {
      const u = (view.usersList||[]).find(x => x.id === targetUid);
      if(u) u[field] = patch[field];
      flashToast('บันทึกแล้ว');
    })
    .catch(err => flashToast('บันทึกไม่สำเร็จ: ' + (err.message||err.code)));
}

function deleteUserAccess(targetUid){
  const u = (view.usersList||[]).find(x => x.id === targetUid);
  if(!u) return;
  uiConfirm(`ยกเลิกสิทธิ์เข้าระบบของ "${u.name||targetUid}"?\n\nบัญชีจะยังอยู่ใน Firebase แต่จะเข้าแอปไม่ได้อีก\n(ถ้าต้องการลบถาวร ให้ลบที่ Firebase Console ด้วย)`, () => {
    db.collection('users').doc(targetUid).delete()
      .then(() => { flashToast('ยกเลิกสิทธิ์แล้ว'); loadUsersList(); })
      .catch(err => flashToast('ลบไม่สำเร็จ: ' + (err.message||err.code)));
  }, 'ยกเลิกสิทธิ์');
}

function renderModelWorkspace(modelId){
  const model = getModel(modelId);
  if(!model){ view.modelId = null; return renderModelsTab(); }

  const idx = state.models.findIndex(m => m.id === modelId);
  const prevModel = idx > 0 ? state.models[idx - 1] : null;
  const nextModel = idx > -1 && idx < state.models.length - 1 ? state.models[idx + 1] : null;

  let html = `<div class="workspace-head no-print">
    <button class="back-link" onclick="backToModels()">${icon('back',15)} กลับ</button>
    <h2>${escapeHtml(model.brand||'')} ${escapeHtml(model.name)}</h2>
    <span class="yr">${escapeHtml(model.yearRange||'')}</span>
    <div class="model-nav-btns">
      <button class="btn secondary small" onclick="goToAdjacentModel('${model.id}', -1)" ${!prevModel?'disabled':''} title="${prevModel ? escapeAttr((prevModel.brand||'')+' '+prevModel.name) : ''}">${icon('back',13)} รุ่นก่อนหน้า</button>
      <button class="btn secondary small" onclick="goToAdjacentModel('${model.id}', 1)" ${!nextModel?'disabled':''} title="${nextModel ? escapeAttr((nextModel.brand||'')+' '+nextModel.name) : ''}">รุ่นถัดไป ${icon('forward',13)}</button>
    </div>
  </div>`;

  html += `<div class="tabs no-print">
    <button class="tab-btn ${view.modelTab==='parts'?'active':''}" onclick="setModelTab('parts')">อะไหล่ในรุ่นนี้</button>
    <button class="tab-btn ${view.modelTab==='promotions'?'active':''}" onclick="setModelTab('promotions')">โปรโมชั่น</button>
    <button class="tab-btn ${view.modelTab==='preview'?'active':''}" onclick="setModelTab('preview')">พรีวิว / พิมพ์</button>
  </div>`;

  if(view.modelTab === 'parts') html += renderPartsTab(model);
  else if(view.modelTab === 'promotions') html += renderPromotionsTab(model);
  else if(view.modelTab === 'preview') html += renderPreviewTab(model);

  return html;
}

// Builds the "แบรนด์" <select> for one part/price row: the shared partBrandOptions
// list (defaults รีบิ้ว/OEM/POWERED + anything added), plus the row's current value
// if it's somehow not in that list yet, plus a "+ เพิ่มแบรนด์ใหม่..." action item.
function renderBrandNameSelect(modelId, partId, b){
  const names = (state.partBrandOptions || []).map(o => o.name);
  const current = (b.brand || '').trim();
  if(current && !names.includes(current)) names.push(current);
  return `<select class="brand-name-select" onchange="onBrandNameSelectChange('${modelId}','${partId}','${b.id}', this.value)">
    <option value="" ${!current?'selected':''}>— เลือกแบรนด์ —</option>
    ${names.map(n => `<option value="${escapeAttr(n)}" ${current===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
    <option value="${ADD_BRAND_OPTION_VALUE}">+ เพิ่มแบรนด์ใหม่...</option>
  </select>`;
}
