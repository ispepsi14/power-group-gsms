     which is what keeps the bottom tab bar clear of the iPhone home indicator. -->

     functions wired up with inline onclick handlers, and compat exposes a global
     `firebase` object that works with ordinary <script> tags. The modular SDK
     would require type="module", which puts every function out of global scope
     and would break every onclick in the file. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  // Access is controlled by Firestore Security Rules + user accounts, not by hiding this.

     ===================== V2 — multi-device cloud version =====================
     v2.0.0 — moved off single-device localStorage onto Firebase (Auth + Firestore)
              so 4 iPhones + 1 iPad + 2 PCs share one live dataset.
              * saveState() no longer writes the whole blob. It now DIFFS state
                against a shadow of the last server snapshot and writes only the
                documents that changed. This is what stops two people editing two
                different jobs from silently wiping each other — the single most
                dangerous bug in the old design once more than one device exists.
                Every one of the ~100 existing saveState() call sites still works
                unchanged, which is why it was done this way rather than rewriting
                each one into an individual write.
              * Login screen (email + password). No self-signup: an account that
                exists in Firebase Auth still cannot get in until an admin grants it
                a users/{uid} document. Signed-in user + live sync dot shown in the
                app bar.
              * Roles. staff = รับรถ / เปลี่ยนสถานะ / ใส่ราคา-ทำใบเสนอราคา.
                admin = the above plus delete jobs, catalog (รุ่นรถ/สินค้า/ตำราราคา),
                shop settings and user management. Enforced BOTH in the UI and in
                Firestore Security Rules — the UI gating alone is only cosmetic.
              * New ผู้ใช้งาน page (admin only) to assign name + role per UID, with
                a capability table. BOOTSTRAP_ADMIN_UID is treated as admin even
                with no users/ document, which solves the chicken-and-egg of
                creating the very first account, and doubles as a lockout safety net.
              * Catalog seeding is no longer automatic on load — otherwise all 7
                devices would each seed their own duplicate copy of the 25 standard
                models/parts. Only field backfills run automatically; creating the
                standard catalog is now an explicit admin import.
              * Import rewritten to push a V1 backup file up to the cloud (admin only).
              * Offline persistence on, so short wifi drops queue writes instead of
                losing them.
              * Snapshot-driven redraws are deferred while an input is focused, so a
                teammate's edit landing mid-typing can't steal the caret.
     v2.0.1 — connection dot now reads the browser's online/offline events instead of
              Firestore's snapshot.metadata.fromCache. With offline persistence on, the
              first snapshot legitimately comes from cache, so the dot was reporting
              "offline" immediately after a perfectly normal login.
     v2.1.0 — proper iPad support. The old single 820px breakpoint gave every iPad the
              desktop layout, because an iPad is 744-1024px in portrait and up to
              1366px in landscape — as wide as a laptop. Split into tiers:
                * TOUCH (iPhone + iPad): matched by `(max-width:1100px)` OR
                  `(pointer:coarse) and (max-width:1400px)`. The pointer test is what
                  separates a landscape iPad Pro from the shop's desktop PCs, since
                  width alone cannot. Bottom tab bar, finger-sized controls, and 16px
                  form inputs so iOS stops auto-zooming on focus.
                * iPad refinement: same touch layout but uses the extra width —
                  2-column forms, 3-up model grid, real tables instead of the phone's
                  stacked cards, wider bottom-bar labels.
                * PHONE (<=700px): single column + stacked quote-table cards.
              Also added the iOS "Add to Home Screen" meta tags (runs fullscreen with
              no browser chrome) and viewport-fit=cover, without which
              env(safe-area-inset-*) always returns 0 and the bottom tab bar collides
              with the iPhone home indicator.
     v2.2.0 — shop-workflow pass, sized for 20-30 cars/day.
              * Statuses expanded 5 -> 8 with a fixed colour per stage: รับรถ(แดง),
                ตรวจเช็ค(ส้ม), เสนอราคา(เหลือง), ลูกค้ากลับก่อน(แดงอ่อน), กำลังซ่อม(ฟ้าอ่อน),
                รอตั้งศูนย์(ฟ้าเข้ม), พร้อมส่งมอบ(เขียวอ่อน), ส่งมอบแล้ว(เขียวเข้ม). The same
                palette drives the badge, the card's left edge and the filter pills.
                Jobs on an unrecognised status fall back to รับรถ rather than blank.
              * PHOTOS REWORKED — this was the real scaling risk. A phone photo is
                2-4MB and Firestore caps a document at 1MB, so storing them inline
                would have started failing within days. Each photo is now shrunk to
                ~1000px and stored in its OWN jobPhotos document, fetched only when
                that job is opened, while a ~240px thumbnail rides on the job so the
                list renders instantly. Photos can be added/deleted after check-in,
                and deleting a job cleans up its photos instead of orphaning them.
              * Jobs listener capped at the newest 600 (RECENT_JOBS_LIMIT). Safe with
                the diff-based save because `shadow` is built from the same snapshot,
                so unseen older jobs are never mistaken for deletions.
              * Job list is 2-up on desktop and iPad with one photo per card.
              * Plate field: autocapitalize/autocorrect off — with them on iOS flipped
                back to the letter keyboard after EVERY character, which is why typing
                1กณ6895 meant tapping "123" before each digit. จังหวัด now sits beside
                the plate instead of further down the form.
              * ยี่ห้อ/รุ่น locked to uppercase for real (not just CSS), with the caret
                preserved, so hand-typed entries match catalog formatting.
              * ใบรับรถ and ใบเสนอราคา now share renderJobFormHeader() so they cannot
                drift apart, and both show ยี่ห้อ / รุ่น / สี / ปี / เลขไมล์ as separate
                fields. Quote section retitled "รายการอะไหล่ / เสนอราคา".
              * Parts picker always available: if the vehicle's model isn't in the
                catalog it now falls back to the master parts list instead of showing
                no picker at all.
     v2.3.0 — workshop visual identity, applied across the app AND the printed forms.
              Kept the light, legible base and added garage cues rather than going
              full industrial-dark — this is used on phones in daylight all day.
              * License plates render as actual plates (bordered box, monospace) on
                job cards, the job detail header, the check-in field and both printed
                forms. Staff identify cars by plate, so it's now the loudest element.
              * Monospace tabular figures for plates, job numbers, mileage and money,
                so digits line up down a column.
              * Diagonal hazard stripe under the app bar, at the top of each printed
                form, and on the login card. Safety-yellow is reserved for "the next
                action" — the advance-status button on each job card.
              * Section headings restyled as workshop signage (letter-spaced, steel
                rule beneath) with wrench/car/gauge icons on the key cards.
              * Added print-color-adjust so the stripe and status colours survive
                printing — browsers drop background graphics by default. Stripe thins
                to 4px on paper to keep ink use down.
     v2.4.0 — public customer status board for the waiting room, opened by QR at
              ?board with no login (a login screen would mean nobody ever looks at it).
              PRIVACY IS THE WHOLE DESIGN CONSTRAINT HERE: no-login means anyone with
              the link can read whatever that page can read, and Firestore rules are
              all-or-nothing per document — they cannot hide individual fields. So the
              board does NOT read `jobs` (those hold names, phone numbers, reported
              faults and prices). Instead every job save also publishes a stripped
              copy to board/{jobId} carrying only queue number, make/model, colour,
              a masked plate (1กณ6895 -> 1กณ••95) and status. Deleting a job deletes
              its board entry too.
              * board/ is the only collection with `allow read: if true`; writes still
                require a signed-in user.
              * Board UI is built for glanceability: queue number is the largest
                element, status is a solid colour block, sorted by queue, delivered
                cars drop off after 12h, live-updating with no refresh, clock in the
                header for a wall screen.
              * Settings gains a QR card — on-screen QR, copy link, preview, and a
                print-ready A4 sign with instructions for the waiting-room table. The
                QR encoder loads from CDN on demand rather than being bundled.
     v2.4.1 — FIX: the board came up empty even with 23 cars on the job list. Board
              entries were only written when a job was SAVED, so every job that already
              existed before v2.4.0 shipped had none — and nobody is going to open and
              re-save 23 jobs by hand. Added reconcileBoard(), which compares the board
              against the synced jobs and publishes anything missing or stale. Runs once
              automatically shortly after login, plus a manual "อัปเดตกระดานตอนนี้"
              button in Settings. It deliberately never deletes: the jobs listener only
              carries the newest slice, so older jobs would look missing and get wiped —
              real deletions still flow through flushState. -->



<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

  :root{
    --bg:#ffffff;
    --surface:#f4f4f5;
    --surface-2:#eceeef;
    --border:#DDDDDD;
    --text:#222831;
    --text-2:#6b7684;
    --dark:#222831;
    --navy:#30475E;
    --red:#F05454;
    --red-bg:#fdeaea;
    --black:#222831;
    --danger:#F05454;
    --danger-bg:#fdeaea;
    --radius:10px;

    /* Workshop accents. --hazard is the safety-yellow used on the striped edge and
       on the "next action" buttons; --steel is the muted metal tone for plate
       borders and technical rules. */
    --hazard:#E8BB2D;
    --hazard-dark:#3D3000;
    --steel:#4A525C;
    /* Technical figures — plates, job numbers, prices, mileage — sit in a monospace
       face so digits line up in columns and a plate reads like a plate. */
    --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai', -apple-system, sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  }
  #app{min-height:100vh;}

  .ic{flex-shrink:0;}
  .btn .ic, .topnav-btn .ic, .tab-btn .ic, h3 .ic{margin-right:6px;}

  /* Diagonal hazard stripe — the one piece of workshop signage in the chrome.
     Used on the app bar's bottom edge and at the top of every printed form. */
  .hazard-edge{
    height:5px;
    background:repeating-linear-gradient(45deg,
      var(--hazard) 0 9px, var(--dark) 9px 18px);
  }

  /* License plate. Rendered like an actual plate so it's the fastest thing to find
     on a card — this is how staff identify a car, not by job number. */
  .plate-box{
    display:inline-flex; align-items:center; justify-content:center;
    border:2.5px solid var(--dark); border-radius:5px; padding:2px 9px; background:#fff;
    font-family:var(--font-mono); font-weight:700; letter-spacing:.5px;
    font-size:16px; color:var(--dark); line-height:1.35; white-space:nowrap;
  }
  .plate-box.lg{font-size:20px; padding:3px 12px; border-width:3px;}
  .plate-box.sm{font-size:13.5px; padding:1px 7px; border-width:2px;}
  /* Tabular figures for anything that should line up in a column */
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  /* The plate entry field mirrors the plate it produces */
  .plate-input{
    font-family:var(--font-mono); font-size:19px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase; text-align:center; border-width:2.5px; border-color:var(--dark);
  }

  .app-bar{
    background:var(--dark); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    border-bottom:none; position:sticky; top:0; z-index:20;
  }
  .app-bar .left-group{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .app-bar .brand-block{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .app-bar .brand{font-weight:700; font-size:19px; letter-spacing:0.5px;}
  .app-bar .brand::first-letter{color:var(--red);}
  .app-bar .brand-mark{color:var(--hazard); display:inline-flex; align-self:center;}
  .app-bar .sub{color:#9aa3ad; font-size:12.5px;}
  .app-bar .ver{
    color:#9aa3ad; font-size:11px; font-weight:700; background:rgba(255,255,255,0.10);
    border-radius:999px; padding:2px 8px; white-space:nowrap;
  }
  .topnav{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .topnav-btn{
    border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#dfe3e7;
    padding:8px 16px; border-radius:999px; font-size:13.5px; cursor:pointer; font-family:inherit;
    font-weight:600; transition:background .15s,color .15s,border-color .15s;
    display:inline-flex; align-items:center;
  }
  .topnav-btn:hover:not(.active){background:rgba(255,255,255,0.14); color:#fff;}
  .topnav-btn.active{background:var(--red); color:#fff; border-color:var(--red);}
  .topnav-divider{width:1px; align-self:stretch; background:rgba(255,255,255,0.18); margin:0 2px;}
  .backup-btn{background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.18); font-weight:600;}
  .backup-btn:hover{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===== Login / auth screens ===== */
  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--dark);
  }
  .auth-box{background:#fff; border-radius:16px; padding:28px 24px; width:100%; max-width:390px;}
  .auth-brand{
    font-weight:800; font-size:23px; letter-spacing:.5px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .auth-brand .ic{color:var(--hazard); margin:0;}
  .auth-sub{color:var(--text-2); font-size:13px; text-align:center; margin:5px 0 22px;}
  .auth-box .field{margin-bottom:13px;}
  .auth-box input{font-size:16px; padding:13px 14px;}
  .auth-err{
    background:var(--red-bg); color:var(--red); border-radius:8px; padding:11px 13px;
    font-size:13.5px; margin-bottom:13px;
  }
  .auth-note{color:var(--text-2); font-size:12px; text-align:center; margin-top:16px; line-height:1.6;}
  .auth-status{color:#9aa3ad; text-align:center; font-size:14px;}

  /* Signed-in user chip in the app bar */
  .user-chip{
    display:flex; align-items:center; gap:8px; color:#dfe3e7; font-size:12.5px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
    border-radius:999px; padding:6px 8px 6px 12px;
  }
  .user-chip .u-name{font-weight:700; white-space:nowrap;}
  .user-chip .u-role{
    font-size:10.5px; background:rgba(255,255,255,0.14); border-radius:999px;
    padding:2px 8px; white-space:nowrap;
  }
  .user-chip .u-out{
    background:none; border:none; color:#9aa3ad; cursor:pointer; padding:4px 6px;
    display:inline-flex; align-items:center; line-height:0; border-radius:50%;
  }
  .user-chip .u-out:hover{color:#fff; background:rgba(255,255,255,0.14);}

  /* Live sync indicator */
  .sync-dot{
    width:8px; height:8px; border-radius:50%; background:#1f9d55; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(31,157,85,.22);
  }
  .sync-dot.offline{background:#e8a33d; box-shadow:0 0 0 3px rgba(232,163,61,.22);}

  /* ===== Public customer board (?board) =====
     Read at arm's length on a phone, or across the room on a wall screen — so the
     queue number is the largest thing on every row and status is a solid colour
     block rather than a subtle tint. */
  .board-wrap{max-width:900px; margin:0 auto; padding:0 0 40px;}
  .board-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:18px 18px 14px; flex-wrap:wrap;
  }
  .board-title{font-size:24px; font-weight:800; letter-spacing:.5px;}
  .board-sub{color:var(--text-2); font-size:14px; margin-top:2px;}
  .board-clock{font-size:26px; font-weight:800; color:var(--text-2);}
  .board-grid{display:flex; flex-direction:column; gap:9px; padding:0 14px;}
  .board-card{
    display:flex; align-items:center; gap:14px; background:#fff;
    border:1px solid var(--border); border-left:7px solid var(--border);
    border-radius:10px; padding:13px 15px;
  }
  .board-card.st-received   {border-left-color:#d92d20;}
  .board-card.st-inspecting {border-left-color:#f27a1a;}
  .board-card.st-quoted     {border-left-color:#f5c400;}
  .board-card.st-customerout{border-left-color:#ffb4ac;}
  .board-card.st-repairing  {border-left-color:#7cc7f2;}
  .board-card.st-aligning   {border-left-color:#1668a8;}
  .board-card.st-ready      {border-left-color:#8fd694;}
  .board-card.st-delivered  {border-left-color:#1c7a34; opacity:.55;}
  .bc-queue{
    font-size:34px; font-weight:800; line-height:1; min-width:66px; text-align:center;
    color:var(--dark); flex-shrink:0;
  }
  .bc-mid{flex:1; min-width:0;}
  .bc-car{font-size:17px; font-weight:700;}
  .bc-meta{color:var(--text-2); font-size:13.5px; margin-top:3px;}
  .bc-status{
    flex-shrink:0; font-size:14px; font-weight:700; padding:8px 15px; border-radius:999px;
    white-space:nowrap;
  }
  .bc-status.st-received   {background:#d92d20; color:#fff;}
  .bc-status.st-inspecting {background:#f27a1a; color:#fff;}
  .bc-status.st-quoted     {background:#f5c400; color:#3d3000;}
  .bc-status.st-customerout{background:#ffb4ac; color:#7a1c12;}
  .bc-status.st-repairing  {background:#7cc7f2; color:#0b3a52;}
  .bc-status.st-aligning   {background:#1668a8; color:#fff;}
  .bc-status.st-ready      {background:#8fd694; color:#12401a;}
  .bc-status.st-delivered  {background:#1c7a34; color:#fff;}
  .board-legend{
    display:flex; flex-wrap:wrap; gap:10px 16px; padding:20px 18px 0;
    color:var(--text-2); font-size:12.5px;
  }
  .bl-item{display:flex; align-items:center; gap:6px;}
  .board-empty{
    margin:14px; padding:44px 18px; text-align:center; color:var(--text-2);
    border:1px dashed var(--border); border-radius:10px; font-size:15px;
  }
  .board-foot{
    padding:22px 18px 0; color:var(--text-2); font-size:12.5px; line-height:1.8; text-align:center;
  }
  @media (max-width:600px){
    .board-title{font-size:20px;}
    .board-clock{font-size:21px;}
    .bc-queue{font-size:28px; min-width:52px;}
    .bc-car{font-size:15.5px;}
    .bc-status{font-size:12.5px; padding:6px 11px;}
    .board-card{gap:10px; padding:11px 12px;}
  }

  /* Bottom tab bar — mobile only (see the max-width:820px block) */
  .bottom-nav{display:none;}

  /* In-app confirm/prompt dialogs (native confirm()/prompt() are blocked on mobile) */
  .ui-modal-overlay{
    position:fixed; inset:0; z-index:120; background:rgba(15,20,25,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .ui-modal{
    background:#fff; border-radius:14px; padding:20px; width:100%; max-width:420px;
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
  }
  .ui-modal-msg{font-size:15.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:16px;}
  .ui-modal-input{width:100%; margin-bottom:16px; font-size:16px;}
  .ui-modal-btns{display:flex; gap:10px;}
  .ui-modal-btns .btn{flex:1 1 0; justify-content:center; padding:12px 16px;}
  .btn.danger-solid{background:var(--red); border-color:var(--red); color:#fff;}

  .shell{max-width:1040px; margin:0 auto; padding:18px 14px 70px;}

  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  /* Section headings read like workshop signage: slightly tighter, letter-spaced,
     with a short steel rule under them. */
  .card h3{
    margin:0 0 12px; font-size:15px; font-weight:700; letter-spacing:.4px;
    display:flex; align-items:center; padding-bottom:8px;
    border-bottom:2px solid var(--surface-2);
  }
  .muted{color:var(--text-2); font-size:13px;}

  .btn{
    border:1px solid var(--dark); background:var(--dark); color:#fff; padding:10px 16px;
    border-radius:8px; font-size:14.5px; cursor:pointer; font-family:inherit; font-weight:600;
    display:inline-flex; align-items:center;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:#fff; color:var(--text); border-color:var(--border);}
  .btn.danger{background:#fff; color:var(--red); border-color:var(--red-bg);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.block{width:100%; justify-content:center;}
  .btn.big{padding:15px 18px; font-size:16.5px; border-radius:10px;}
  .btn.small{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  /* Safety-yellow = "the next thing to do". Used for advance-status actions only. */
  .btn.hazard{background:var(--hazard); border-color:var(--hazard); color:var(--hazard-dark);}
  .btn.hazard:hover{opacity:.9;}

  input[type=text],input[type=number],input[type=tel],input[type=password],textarea,select{
    font-family:inherit; border:1px solid var(--border); border-radius:8px; padding:11px 12px;
    font-size:15px; color:var(--text); background:#fff; width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--navy); outline-offset:1px;}
  label{font-size:12.5px; color:var(--text-2); display:block; margin-bottom:5px; font-weight:600;}
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .row-flex{display:flex; gap:10px; flex-wrap:wrap; align-items:end;}
  @media (max-width:520px){ .row2,.row3{grid-template-columns:1fr 1fr;} }

  /* Search inputs with an SVG icon inside */
  .search-wrap{position:relative;}
  .search-wrap .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-2); pointer-events:none; margin:0;}
  .search-wrap input{padding-left:38px; width:100%;}

  /* Search + filters (job list) */
  .search-bar{margin-bottom:12px;}
  .search-bar input{font-size:16px; padding:13px 14px 13px 40px;}
  .status-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .status-pill{
    border:1px solid var(--border); background:#fff; color:var(--text-2); padding:7px 13px;
    border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .status-pill .n{background:var(--surface-2); border-radius:999px; padding:1px 7px; font-size:11.5px;}
  .status-pill.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .status-pill.active .n{background:rgba(255,255,255,0.2); color:#fff;}
  /* Colour swatch inside each filter pill, matching the status palette */
  .status-pill .sw{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .sw.st-received   {background:#d92d20;}
  .sw.st-inspecting {background:#f27a1a;}
  .sw.st-quoted     {background:#f5c400;}
  .sw.st-customerout{background:#ffb4ac;}
  .sw.st-repairing  {background:#7cc7f2;}
  .sw.st-aligning   {background:#1668a8;}
  .sw.st-ready      {background:#8fd694;}
  .sw.st-delivered  {background:#1c7a34;}

  /* Two-up on desktop so a 20-30 car day can be taken in at a glance.
     Collapses to one column on phones (see the responsive tiers). */
  .job-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start;}

  /* Job cards — the coloured left edge mirrors the status badge so the whole list
     can be scanned at a glance without reading every badge. */
  .job-card{
    border:1px solid var(--border); border-left:5px solid var(--border); border-radius:var(--radius);
    background:#fff; overflow:hidden;
  }
  /* One photo per card: the fastest way to tell which car is which on the lot */
  .jc-thumb{
    width:62px; height:62px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border);
  }
  .jc-thumb-empty{
    display:flex; align-items:center; justify-content:center; color:var(--text-2); opacity:.5;
  }
  .job-card:hover{box-shadow:0 2px 8px rgba(34,40,49,.08);}
  .job-card.st-received   {border-left-color:#d92d20;}
  .job-card.st-inspecting {border-left-color:#f27a1a;}
  .job-card.st-quoted     {border-left-color:#f5c400;}
  .job-card.st-customerout{border-left-color:#ffb4ac;}
  .job-card.st-repairing  {border-left-color:#7cc7f2;}
  .job-card.st-aligning   {border-left-color:#1668a8;}
  .job-card.st-ready      {border-left-color:#8fd694;}
  .job-card.st-delivered  {border-left-color:#1c7a34;}
  .job-card.st-delivered .jc-main{opacity:.62;}
  .jc-main{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 14px; cursor:pointer;
  }
  .job-card .jc-left{min-width:0;}
  .job-card .jc-left .plate{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .jc-queue{
    background:var(--dark); color:#fff; font-size:11.5px; font-weight:700;
    padding:2px 9px; border-radius:999px;
  }
  .job-card .jc-left .meta{color:var(--text-2); font-size:12.5px; margin-top:3px;}
  .job-card .jc-left .jn{color:var(--text-2); font-size:11.5px; margin-top:3px;}
  .jc-actions{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 14px; border-top:1px solid var(--border); background:var(--surface);
  }
  .jc-steps{display:flex; gap:4px; margin-right:2px;}
  .jc-dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
  .jc-dot.done{background:var(--navy);}
  .jc-dot.now{box-shadow:0 0 0 3px rgba(48,71,94,.22);}
  .jc-del{
    background:none; border:none; color:var(--text-2); cursor:pointer; padding:8px;
    border-radius:8px; display:inline-flex; align-items:center; line-height:0; margin-left:auto;
  }
  .jc-del:hover{color:var(--red); background:var(--red-bg);}

  /* uiChoice picker rows */
  .ui-choice-list{display:flex; flex-direction:column; gap:7px; margin-bottom:16px;}
  .ui-choice{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    border:1px solid var(--border); background:#fff; border-radius:9px; padding:13px 14px;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--text); cursor:pointer; text-align:left;
  }
  .ui-choice:hover{border-color:var(--navy); background:var(--surface);}
  .ui-choice.current{border-color:var(--dark); background:var(--surface-2);}
  .ui-choice-now{font-size:11.5px; font-weight:700; color:var(--text-2); white-space:nowrap;}
  .badge{padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;}
  /* Status palette — one source of truth, used by the badge, the job-card left edge
     and the status filter pills so a colour always means the same stage. */
  .badge.st-received   {background:#d92d20; color:#fff;}
  .badge.st-inspecting {background:#f27a1a; color:#fff;}
  .badge.st-quoted     {background:#f5c400; color:#3d3000;}
  .badge.st-customerout{background:#ffb4ac; color:#7a1c12;}
  .badge.st-repairing  {background:#7cc7f2; color:#0b3a52;}
  .badge.st-aligning   {background:#1668a8; color:#fff;}
  .badge.st-ready      {background:#8fd694; color:#12401a;}
  .badge.st-delivered  {background:#1c7a34; color:#fff;}

  .empty-state{color:var(--text-2); font-size:14px; padding:30px 10px; text-align:center; border:1px dashed var(--border); border-radius:8px;}

  /* Theme picker (Settings) */
  .theme-grid{display:flex; gap:12px; flex-wrap:wrap;}
  .theme-card{cursor:pointer; border:2px solid var(--border); border-radius:10px; padding:10px; width:120px; text-align:center; transition:border-color .15s;}
  .theme-card:hover{border-color:var(--text-2);}
  .theme-card.active{border-color:var(--navy);}
  .theme-swatches{display:flex; height:28px; border-radius:6px; overflow:hidden; margin-bottom:8px;}
  .theme-swatches span{flex:1; display:block;}
  .theme-name{font-size:12.5px; font-weight:600;}

  /* Check-in */
  .plate-suggest-wrap{position:relative;}
  .match-card{
    border:1px solid var(--navy); background:#eef2f5; border-radius:8px; padding:12px 14px; margin-top:8px;
  }
  .match-card .mc-title{font-weight:700; font-size:14.5px; color:var(--navy); display:flex; align-items:center;}
  .match-card .mc-row{font-size:13px; color:var(--text-2); margin-top:4px;}
  .checklist-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .chk-cat-label{font-weight:700; font-size:12.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:0.4px; margin:4px 0 8px;}
  .chk-chip{
    border:1px solid var(--border); border-radius:999px; padding:9px 14px; font-size:13.5px;
    cursor:pointer; user-select:none; background:#fff;
  }
  .chk-chip.checked{background:var(--dark); color:#fff; border-color:var(--dark);}
  .custom-chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--red); color:var(--red);
    border-radius:999px; padding:7px 12px; font-size:13px; margin:4px 6px 0 0;
  }
  .custom-chip button{background:none; border:none; color:var(--red); cursor:pointer; font-size:13px; padding:0; display:inline-flex; align-items:center;}
  .photo-input-btn{
    border:1.5px dashed var(--border); border-radius:8px; padding:20px; text-align:center; color:var(--text-2);
    cursor:pointer; font-size:14px; background:var(--surface); display:flex; align-items:center; justify-content:center;
  }
  .photo-input-btn:hover{border-color:var(--navy); color:var(--navy);}
  .photo-thumb.photo-lg{width:104px; height:104px;}
  .photo-thumb.photo-lg img{width:100%; height:100%; object-fit:cover;}
  .photo-btn-row{display:flex; gap:10px; flex-wrap:wrap;}
  .photo-btn-row .photo-input-btn{flex:1 1 150px; padding:16px 12px;}
  .photo-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .photo-thumb{position:relative; width:78px; height:78px; border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

  /* Job detail */
  .detail-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .back-link{background:none; border:none; color:var(--text-2); cursor:pointer; font-size:14px; font-family:inherit; padding:6px 0; display:inline-flex; align-items:center;}
  .back-link:hover{color:var(--dark);}
  .detail-head h2{margin:0; font-size:18px;}
  .detail-print-btns{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .job-total-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; font-size:15px;}
  .job-total-row strong{font-size:18px; font-variant-numeric:tabular-nums;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; font-size:14px;}
  @media (max-width:480px){ .info-grid{grid-template-columns:1fr;} }
  .info-grid .k{color:var(--text-2); font-size:12px;}
  .info-grid .v{font-weight:600;}
  .complaint-tag{
    display:inline-block; background:var(--surface-2); border-radius:999px; padding:5px 12px;
    font-size:12.5px; margin:0 6px 6px 0;
  }
  .stepper{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px;}
  .step-btn{
    border:1px solid var(--border); background:#fff; color:var(--text-2); padding:9px 13px;
    border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .step-btn.current{background:var(--navy); color:#fff; border-color:var(--navy);}
  .timeline{border-left:2px solid var(--border); margin-left:6px; padding-left:16px;}
  .tl-item{position:relative; padding-bottom:14px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:''; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%;
    background:var(--navy); border:2px solid #fff; box-shadow:0 0 0 1px var(--navy);
  }
  .tl-item .st{font-weight:700; font-size:13.5px;}
  .tl-item .ts{color:var(--text-2); font-size:12px;}
  .photo-gallery{display:flex; flex-wrap:wrap; gap:8px;}
  .photo-gallery a{display:block; width:90px; height:90px; border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .photo-gallery img{width:100%; height:100%; object-fit:cover; display:block;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--dark); color:#fff; padding:10px 20px; border-radius:20px; font-size:13.5px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1;}

  /* Blank printable check-in form (handwriting) */
  .bf-toolbar{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .bf-page{border:1px solid var(--border); background:#fff; max-width:760px; margin:0 auto; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .bf-banner{background:#fff; color:var(--text); padding:18px 22px; border-bottom:3px solid var(--red);}
  .bf-title{font-weight:700; font-size:21px; letter-spacing:.5px; color:var(--text);}
  .bf-sub{color:var(--text-2); font-size:12.5px; margin-top:4px;}
  .bf-body{padding:18px 22px 24px;}
  .bf-row{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px; align-items:baseline;}
  .bf-field{display:flex; align-items:baseline; gap:8px; font-size:13px; flex:1 1 130px;}
  .bf-field.wide{flex:2 1 220px;}
  .bf-field label{color:var(--text-2); white-space:nowrap; font-weight:600;}
  .bf-line{flex:1; border-bottom:1px solid var(--text-2); min-width:60px; height:16px;}
  .bf-check-opt{font-size:13px; white-space:nowrap;}
  .bf-section-title{font-weight:700; font-size:14px; margin:18px 0 10px; padding-top:10px; border-top:1px dashed var(--border);}
  .bf-complaint-grid{display:flex; flex-wrap:wrap; gap:10px 22px;}
  .bf-note-line{display:block; border-bottom:1px solid var(--text-2); height:26px; margin-bottom:2px;}
  .bf-foot{font-size:11px; color:var(--text-2); font-style:italic; margin-top:20px;}
  .bf-signatures{display:flex; justify-content:space-around; gap:20px; margin-top:38px;}
  .bf-sign-box{flex:1; text-align:center; max-width:220px;}
  .bf-sign-line{display:block; border-bottom:1px solid var(--text-2); height:36px; margin-bottom:6px;}
  .bf-sign-label{font-size:12px; color:var(--text-2);}

  /* ---- Catalog: tabs (model workspace sub-tabs) ---- */
  .tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .tab-btn{
    border:1px solid var(--border); background:#fff; color:var(--text-2); padding:8px 16px;
    border-radius:999px; font-size:14px; cursor:pointer; font-family:inherit; font-weight:500;
    display:inline-flex; align-items:center;
  }
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .tab-btn:hover:not(.active){background:var(--surface);}

  /* ---- Catalog: model grid (รุ่นรถ) ---- */
  .model-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .model-card{
    border:1px solid var(--border); border-left:4px solid var(--navy); border-radius:var(--radius); padding:14px; background:#fff;
    cursor:pointer; position:relative; transition:box-shadow 0.15s, border-color 0.15s;
  }
  .model-card:hover{border-color:var(--navy); box-shadow:0 3px 10px rgba(34,40,49,0.1);}
  .model-card .name{font-weight:700; font-size:15px; margin-bottom:2px;}
  .model-card .year{color:var(--text-2); font-size:13px;}
  .model-card .count{color:var(--navy); font-size:12px; margin-top:8px; font-weight:600;}
  .model-card .del{
    position:absolute; top:8px; right:8px; border:none; background:none; color:var(--text-2);
    cursor:pointer; font-size:13px; display:flex; align-items:center;
  }
  .model-card .del:hover{color:var(--danger);}
  .add-model-card{
    border:1.5px dashed var(--border); border-radius:var(--radius); display:flex; align-items:center;
    justify-content:center; color:var(--text-2); font-size:14px; cursor:pointer; min-height:88px;
    background:var(--surface);
  }
  .add-model-card:hover{border-color:var(--navy); color:var(--navy);}

  /* Search & filter (models tab) */
  .search-filter-bar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .search-input{flex:1 1 260px; min-width:200px;}
  .filter-select{min-width:150px;}

  /* Bulk-select for printing multiple models */
  .models-toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .select-hint{font-size:13px; color:var(--text-2); margin-right:4px;}
  .model-card.selectable{cursor:pointer;}
  .model-card.selected{border-color:var(--red); box-shadow:0 0 0 2px rgba(240,84,84,0.22);}
  .select-check{
    position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:5px;
    border:2px solid var(--border); background:#fff; color:#fff; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .select-check.checked{background:var(--red); border-color:var(--red);}
  .bulk-print-page{margin-bottom:32px;}

  /* ตำราราคา (price book) */
  .pb-toc{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .pb-toc-chip{border:1px solid var(--border); background:#fff; color:var(--text); border-radius:20px; padding:5px 12px; font-size:12.5px; cursor:pointer;}
  .pb-toc-chip:hover{background:var(--surface-2);}
  .pb-page{max-width:900px;}
  .pb-cover{padding:10px 4px 18px; border-bottom:2px solid var(--dark); margin-bottom:18px;}
  .pb-cover-title{font-weight:800; font-size:22px; letter-spacing:.3px;}
  .pb-cover-sub{color:var(--text-2); font-size:13px; margin-top:4px;}
  .pb-brand-heading{font-weight:800; font-size:15px; letter-spacing:.3px; margin:20px 0 10px; padding-bottom:5px; border-bottom:2px solid var(--navy);}
  .pb-brand-heading:first-of-type{margin-top:0;}
  .pb-model-block{margin-bottom:16px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .pb-model-head{background:#fff; padding:8px 14px; border-left:4px solid var(--navy); display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1px solid var(--border);}
  .pb-model-head .name{font-weight:700; font-size:14px;}
  .pb-model-head .year{font-size:12px; color:var(--text-2);}
  table.pb-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.pb-table th{background:var(--surface-2); text-align:left; padding:6px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-2); border-bottom:1px solid var(--border);}
  table.pb-table td{padding:6px 10px; border-top:1px solid var(--border); vertical-align:top;}
  table.pb-table .pb-cat-header{background:var(--surface-2); color:var(--text); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; padding:5px 10px; border-left:4px solid var(--dark);}
  .pb-price-line{display:flex; justify-content:space-between; gap:10px;}
  .pb-price-brand{color:var(--text-2);}
  .pb-price{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}

  /* workspace header (model workspace) */
  .workspace-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .workspace-head h2{margin:0; font-size:18px;}
  .workspace-head .yr{color:var(--text-2); font-size:14px;}
  .qr-row{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;}
  .qr-box{
    width:206px; height:206px; flex-shrink:0; border:1px solid var(--border); border-radius:10px;
    background:#fff; display:flex; align-items:center; justify-content:center; padding:8px;
    text-align:center;
  }
  .qr-box img, .qr-box canvas{display:block; max-width:100%; height:auto;}
  .qr-side{flex:1 1 260px; min-width:0;}

  .settings-nav{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .settings-nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px 10px;
    cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:600; color:var(--text);
  }
  .settings-nav-btn:hover{border-color:var(--navy); background:var(--surface);}
  .settings-nav-btn small{font-weight:400; font-size:11.5px; color:var(--text-2);}
  @media (max-width:520px){ .settings-nav{grid-template-columns:1fr;} .settings-nav-btn{flex-direction:row; justify-content:flex-start; gap:10px; padding:14px;} .settings-nav-btn small{margin-left:auto;} }
  .model-nav-btns{display:flex; gap:6px; margin-left:auto;}
  .model-nav-btns button:disabled{opacity:0.4; cursor:not-allowed;}

  /* Parts table (model workspace) */
  table.parts-table{width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed;}
  table.parts-table th, table.parts-table td{border:1px solid var(--border); padding:9px 10px; text-align:left; vertical-align:middle; word-break:break-word;}
  table.parts-table th{background:var(--navy); color:#fff; font-weight:600; font-size:12.5px; letter-spacing:0.2px; text-transform:uppercase;}
  table.parts-table td.center, table.parts-table th.center{text-align:center;}
  table.parts-table .part-name-cell{font-weight:600;}
  .part-name-input{width:100%; font-weight:600; font-family:inherit; font-size:14px; color:var(--text); border:1px solid transparent; background:transparent; padding:4px 5px; border-radius:4px; box-sizing:border-box;}
  .part-name-input:hover{border-color:var(--border);}
  .part-name-input:focus{border-color:var(--navy); background:#fff; outline:none;}
  table.parts-table tbody tr:hover td{background:var(--surface);}
  table.parts-table .parts-cat-header{background:var(--surface-2); color:var(--text); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.4px; padding:7px 10px; border-left:4px solid var(--navy);}
  table.parts-table .parts-cat-row:hover td{background:var(--surface);}
  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
  .table-wrap table{border:none;}
  .table-wrap table th:first-child, .table-wrap table td:first-child{border-left:none;}
  .table-wrap table th:last-child, .table-wrap table td:last-child{border-right:none;}
  .table-wrap table tr:first-child th{border-top:none;}
  .table-wrap table tr:last-child td{border-bottom:none;}
  .qty-inline{display:flex; flex-direction:column; gap:5px; align-items:stretch;}
  .qty-input{width:100%; text-align:center; padding:6px 4px; box-sizing:border-box;}
  .unit-select{width:100%; text-align:center; padding:6px 4px; box-sizing:border-box; border:1px solid var(--border); border-radius:4px; background:#fff; font-family:inherit; font-size:13px; color:var(--text);}
  .unit-input{width:66px; text-align:center; padding:6px 4px;}
  .brand-price-input{width:100%;}
  .brand-name-input{width:100%;}
  .brand-name-select{width:100%; padding:6px 4px; box-sizing:border-box; border:1px solid var(--border); border-radius:4px; background:#fff; font-family:inherit; font-size:13px; color:var(--text);}
  .force-upper{text-transform:uppercase;}
  .icon-btn{background:none;border:none;color:var(--text-2);cursor:pointer;font-size:13px;padding:2px 4px; display:inline-flex; align-items:center;}
  .icon-btn:hover{color:var(--danger);}
  .add-brand-btn{font-size:12.5px; color:var(--text-2); background:none; border:1px dashed var(--border); border-radius:5px; padding:3px 8px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .add-brand-btn:hover{border-color:var(--black); color:var(--black);}
  .part-variant-actions{display:flex; flex-direction:column; gap:4px; margin-top:6px; align-items:stretch;}
  .part-variant-actions .add-brand-btn{width:100%;}

  .checklist{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; padding:10px;}
  .checklist label{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); cursor:pointer;}

  .promo-card{border:1px solid var(--border); border-left:4px solid var(--red); border-radius:var(--radius); padding:14px; margin-bottom:10px; background:var(--surface);}
  .promo-card .ptitle{font-weight:700; font-size:15px; display:flex; align-items:center;}
  .promo-card .pitems{color:var(--text-2); font-size:13px; margin:4px 0 8px;}
  .promo-card .pprice{font-weight:700; font-size:16px; color:var(--red);}
  .promo-card-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px;}
  .promo-name-input{font-weight:700; font-size:15px; border:1px solid transparent; background:none; padding:2px 4px; flex:1; min-width:0;}
  .promo-name-input:hover, .promo-name-input:focus{border-color:var(--border); background:#fff;}
  .promo-status{padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
  .promo-status.active{background:var(--navy); color:#fff;}
  .promo-status.upcoming{background:var(--surface-2); color:var(--text-2);}
  .promo-status.expired{background:var(--red-bg); color:var(--red);}
  .promo-dates{color:var(--text-2); font-size:12px; margin-top:2px;}

  /* Preview / print page (single + bulk model print) */
  .preview-toolbar{display:flex; justify-content:flex-end; margin-bottom:14px; gap:8px;}
  .preview-page{
    border:1px solid var(--border); background:#fff; padding:0; max-width:760px; margin:0 auto;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .pv-banner{background:#fff; color:var(--text); padding:18px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; border-bottom:3px solid var(--dark);}
  .pv-banner .pv-title{font-weight:700; font-size:22px; letter-spacing:0.5px; color:var(--text);}
  .pv-banner .pv-sub{color:var(--text-2); font-size:13px; margin-top:4px;}
  .pv-banner-main{min-width:0;}
  .pv-queue-box{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:6px 10px;}
  .pv-queue-box .pv-queue-label{color:var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px;}
  .pv-queue-square{width:1.4cm; height:1.4cm; border:1.5px solid var(--text); border-radius:4px; margin-bottom:1px; background:#fff;}
  .pv-queue-dt{display:flex; align-items:baseline; gap:4px; font-size:10px; color:var(--text);}
  .pv-queue-dt .pv-queue-label{font-size:9.5px;}
  .pv-queue-line{display:inline-block; border-bottom:1px solid var(--text); min-width:38px; height:11px;}
  .pv-band{background:var(--surface); padding:14px 22px; border-bottom:1px solid var(--border);}

  .pv-intake-row{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:9px; align-items:baseline;}
  .pv-intake-row:last-child{margin-bottom:0;}
  .pv-field{display:flex; align-items:baseline; gap:6px; font-size:12.5px; flex:1 1 110px;}
  .pv-field.wide{flex:2 1 220px;}

  .pv-line{flex:1; border-bottom:1px solid var(--text-2); min-width:50px; height:13px;}
  .pv-check-opt{font-size:12.5px; white-space:nowrap;}
  .pv-note{padding:0 22px 10px; border-bottom:1px dashed var(--border);}
  .pv-note-line{display:block; border-bottom:1px solid var(--text-2); height:20px; margin-bottom:2px;}

  table.pv-table th, table.pv-table td{border:1px solid var(--border); padding:7px 9px; word-break:break-word;}
  table.pv-table th{background:var(--surface-2); font-weight:600; font-size:12.5px;}
  table.pv-table th.center, table.pv-table td.center{text-align:center;}
  table.pv-table .pv-cat-header{background:var(--surface-2); color:var(--text); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; padding:6px 9px; border-left:4px solid var(--dark);}

  .pv-price-total-label{font-weight:700; font-size:14.5px; white-space:nowrap;}
  .pv-price-total-value{flex:1; text-align:right; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums;}
  .pv-queue-filled{display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;}
  .pv-promo-box{border:1px solid var(--border); border-left:4px solid var(--red); border-radius:6px; padding:12px 14px; margin-top:10px;}
  .pv-promo-box .t{font-weight:700; font-size:14px; display:flex; align-items:center;}
  .pv-promo-box .d{color:var(--text-2); font-size:12.5px; margin:3px 0 6px;}
  .pv-promo-box .p{font-weight:700; font-size:15px; color:var(--red);}
  .pv-foot{font-size:11.5px; color:var(--text-2); font-style:italic; margin-top:14px;}
  .pv-section-title{font-weight:700; font-size:14px; margin:14px 0 8px;}
  .pv-value{font-weight:600;}
  .pv-tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .pv-tag{display:inline-block; background:var(--surface-2); border-radius:999px; padding:4px 10px; font-size:12.5px;}

  /* =====================================================================
     RESPONSIVE TIERS

     Tier 1 — TOUCH  (iPhone + iPad, both orientations)
       Bottom tab bar, no top nav strip, finger-sized controls.
       Matched by width OR by `pointer:coarse`, because an iPad Pro in landscape
       is 1194-1366px wide — as wide as a laptop — so width alone can't tell them
       apart. `pointer:coarse` means "the primary input is a finger", which is
       true on every iPad and false on the shop's two desktop PCs.

     Tier 2 — PHONE  (<=700px)
       Everything collapses to one column and the quote table becomes stacked
       cards. iPads skip this tier: they have the room for real columns/tables.

     Tier 3 — SMALL PHONE (<=420px)
     ===================================================================== */

  /* ---------- Tier 1: touch (iPhone + iPad) ---------- */
  @media (max-width:1100px), (pointer:coarse) and (max-width:1400px){
    body{font-size:15.5px;}
    .shell{padding:16px 13px calc(84px + env(safe-area-inset-bottom));}

    /* App bar keeps only brand + user chip; primary navigation moves to the bottom
       tab bar, which is thumb-reachable and never gets clipped off-screen. */
    .app-bar{padding:9px 14px; gap:8px; flex-wrap:nowrap; align-items:center;}
    .app-bar .left-group{gap:10px; flex:1 1 auto; min-width:0; flex-wrap:nowrap;}
    .app-bar .brand-block{flex:0 0 auto;}
    .app-bar .brand{font-size:17px;}
    .main-nav{display:none;}
    .backup-nav{flex:0 0 auto; gap:6px;}
    .backup-nav .topnav-btn{padding:9px 12px; font-size:12.5px;}
    .backup-nav .btn-text{display:none;}
    .backup-nav .ic{margin-right:0;}

    .bottom-nav{
      display:grid; grid-template-columns:repeat(4,1fr);
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:var(--dark); border-top:1px solid rgba(255,255,255,0.12);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .bn-btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      background:none; border:none; color:#9aa3ad; font-family:inherit; font-size:10.5px;
      font-weight:600; padding:9px 2px 8px; cursor:pointer; min-height:56px;
      border-top:2.5px solid transparent;
    }
    .bn-btn .ic{margin-right:0;}
    .bn-btn.active{color:#fff; border-top-color:var(--red);}
    .bn-btn span{line-height:1.1;}

    /* Finger-sized hit areas everywhere */
    .card{padding:14px; margin-bottom:12px;}
    .btn{padding:12px 16px;}
    .btn.small{padding:9px 13px; font-size:13px;}
    .chk-chip{padding:10px 14px; font-size:14px;}
    .status-pill{padding:9px 15px; font-size:13.5px;}
    .photo-thumb{width:76px; height:76px;}
    input[type=text],input[type=number],input[type=tel],input[type=password],textarea,select{
      font-size:16px; padding:12px 13px;   /* 16px stops iOS auto-zooming on focus */
    }
    .jc-main{padding:14px;}
    .jc-actions{padding:10px 13px;}
    .job-grid{grid-template-columns:1fr;}
    .workspace-head h2, .detail-head h2{font-size:17px;}
    .ui-choice{padding:15px 16px;}
    .ui-modal-btns .btn{padding:14px 16px;}
  }

  /* ---------- Tier 1b: iPad only — touch layout, but use the extra width ---------- */
  @media (min-width:701px) and (max-width:1100px),
         (min-width:701px) and (pointer:coarse) and (max-width:1400px){
    .shell{max-width:920px; padding-left:18px; padding-right:18px;}
    .bn-btn{font-size:12px; min-height:64px; gap:4px; padding:11px 2px 10px;}
    .model-grid{grid-template-columns:repeat(3,1fr); gap:12px;}
    .settings-nav{grid-template-columns:repeat(4,1fr);}
    .row2{grid-template-columns:1fr 1fr; gap:12px;}
    .row3{grid-template-columns:1fr 1fr 1fr; gap:12px;}
    .card{padding:17px;}
    .job-grid{grid-template-columns:1fr 1fr;}
    .job-card .jc-left .plate{font-size:17.5px;}
    /* Two-up printable forms are unreadable on a tablet; keep one column. */
    .pv-intake-row{gap:18px;}
  }

  /* ---------- Tier 2: phone ---------- */
  @media (max-width:700px){
    .app-bar .sub{display:none;}
    .app-bar .brand{font-size:16px;}
    .shell{padding:14px 11px calc(80px + env(safe-area-inset-bottom));}
    .card{padding:13px; margin-bottom:11px;}
    .row2,.row3{grid-template-columns:1fr; gap:0;}
    .model-grid{grid-template-columns:1fr 1fr; gap:10px;}
    .settings-nav{grid-template-columns:1fr;}
    .detail-print-btns{margin-left:0; width:100%;}
    .detail-print-btns .btn{flex:1 1 0; justify-content:center;}
    .model-nav-btns{margin-left:0; width:100%;}
    .model-nav-btns .btn{flex:1 1 0; justify-content:center;}
    .jc-actions{gap:6px; padding:8px 11px;}
    .jc-actions .btn.small{padding:8px 11px; font-size:12.5px;}
    .jc-main{padding:12px;}

    /* Wide editing tables become stacked cards — one block per row, each cell labelled.
       Applied only to the job quote editor; catalog tables stay scrollable instead. */
    table.job-parts-table, table.job-parts-table tbody, table.job-parts-table tr, table.job-parts-table td{display:block; width:100%;}
    table.job-parts-table thead, table.job-parts-table colgroup{display:none;}
    table.job-parts-table tr{
      border:1px solid var(--border); border-radius:8px; margin-bottom:10px;
      padding:8px 10px; position:relative; background:#fff;
    }
    table.job-parts-table td{border:none; padding:6px 0; text-align:left !important;}
    table.job-parts-table td[data-label]::before{
      content:attr(data-label); display:block; font-size:11.5px; color:var(--text-2);
      font-weight:600; margin-bottom:3px;
    }
    table.job-parts-table td:first-child{
      position:absolute; top:8px; right:10px; width:auto; padding:0;
      font-size:12px; color:var(--text-2); font-weight:700;
    }
    table.job-parts-table td:last-child{
      position:absolute; top:4px; right:34px; width:auto; padding:0;
    }
    table.job-parts-table .qty-inline{flex-direction:row; gap:8px;}
    .job-total-row{font-size:14.5px;}
    .job-total-row strong{font-size:17px;}
  }

  /* ---------- Tier 3: small phone ---------- */
  @media (max-width:420px){
    .model-grid{grid-template-columns:1fr;}
    .app-bar .brand{font-size:15px;}
    .btn.big{padding:14px 16px; font-size:15.5px;}
    .user-chip .u-role{display:none;}
  }

  /* Printable job intake page — hidden on screen, shown only when printing */
  .job-print-page{display:none;}

  @media print{
    @page{ size: A4; margin: 12mm 10mm; }
    .no-print{display:none !important;}
    body{background:#fff;}

    /* Browsers strip background graphics when printing unless told otherwise, which
       would drop the hazard stripe and every status colour off the paper. Limited to
       the few elements that actually need ink — the rest of the form stays white. */
    .hazard-edge, .badge, .pv-tag, .pv-cat-header{
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .hazard-edge{height:4px;}
    .shell{padding:0; max-width:none; margin:0;}
    .bf-page{border:none; box-shadow:none; max-width:none; width:100%; margin:0;}
    .bf-banner{padding:12px 16px;}
    .bf-body{padding:14px 16px 16px;}

    .preview-page{border:none; box-shadow:none; max-width:none; width:100%; margin:0;}
    .job-print-page{display:block;}

    /* Force exactly one printed page per selected model in bulk print */
    .bulk-print-page{
      margin-bottom:0;
      page-break-after:always; break-after:page;
      page-break-inside:avoid; break-inside:avoid;
    }
    .bulk-print-page:last-child{
      page-break-after:auto; break-after:auto;
    }

    /* ตำราราคา — exactly one A4 page per รุ่นรถ */
    .pb-page{max-width:none;}
    .pb-cover{border-bottom-width:2px; margin-bottom:0; padding-bottom:10px; page-break-after:always; break-after:page;}
    .pb-brand-heading{margin:0 0 10px; break-after:avoid; page-break-after:avoid;}
    .pb-model-block{
      margin-bottom:0; border:none; border-radius:0;
      page-break-after:always; break-after:page;
      page-break-inside:avoid; break-inside:avoid;
      min-height:245mm; display:flex; flex-direction:column;
    }
    .pb-page > .pb-model-block:last-child{ page-break-after:auto; break-after:auto; }
    .pb-model-head{border:1px solid var(--border); border-left-width:4px;}
    table.pb-table{border:1px solid var(--border); border-top:none;}
    table.pb-table tr{page-break-inside:avoid; break-inside:avoid;}

    /* Tighten spacing/type so a full parts list fits comfortably on one A4 page */
    .pv-banner{padding:10px 16px;}
    .pv-banner .pv-title{font-size:18px;}
    .pv-banner .pv-sub{font-size:11px;}
    .pv-queue-box{padding:4px 8px;}
    .pv-queue-square{width:1.4cm; height:1.4cm;}
    .pv-queue-box .pv-queue-label{font-size:9px;}
    .pv-queue-dt{font-size:9.5px;}
    .pv-queue-line{min-width:34px; height:10px;}
    .pv-band{padding:7px 16px;}
    .pv-band .pv-model{font-size:16px;}
    .pv-band .pv-year{font-size:11px;}
    .pv-intake{padding:8px 16px;}
    .pv-intake-row{margin-bottom:6px; gap:12px;}
    .pv-field{font-size:11px;}
    .pv-line{height:11px;}
    .pv-check-opt{font-size:11px;}
    .pv-note{padding:0 16px 8px;}
    .pv-note-line{height:16px;}
    .pv-body{padding:10px 16px 12px;}
    .pv-signatures{margin-top:22px;}
    .pv-sign-line{height:26px;}
    .pv-sign-label{font-size:10px;}
    table.pv-table{font-size:10.5px;}
    table.pv-table th, table.pv-table td{padding:4px 6px;}
    table.pv-table tr{page-break-inside:avoid; break-inside:avoid;}
    table.pv-table .pv-cat-header{font-size:10px; padding:4px 6px;}
    .pv-price-summary{padding:8px 10px; margin-top:8px; page-break-inside:avoid; break-inside:avoid;}
    .pv-price-total-label{font-size:12px;}
    .pv-promo-box{padding:7px 10px; margin-top:6px;}
    .pv-promo-box .t{font-size:12px;}
    .pv-promo-box .d{font-size:11px;}
    .pv-promo-box .p{font-size:13px;}
    .pv-foot{font-size:9px; margin-top:8px;}
  }
</style>

<script>
const STORAGE_KEY = 'gsms-power-group-v1';

const STATUS_FLOW = [
  { key:'received',   label:'รับรถ',           cls:'st-received' },
  { key:'inspecting', label:'ตรวจเช็ค',        cls:'st-inspecting' },

  { key:'delivered',  label:'ส่งมอบแล้ว',      cls:'st-delivered' },
];

// Old saved jobs used a 5-step flow. Anything not in STATUS_FLOW falls back to 'received'
// (see ensureJobFields) — these two keys are the only ones that ever existed and both
// still exist by the same name, so nothing actually needs remapping. Kept for clarity.
const LEGACY_STATUS_MAP = {};

const DEFAULT_COMPLAINTS = [
  "รถกินซ้าย","รถกินขวา","พวงมาลัยสั่น","เบรกสั่น","ช่วงล่างดัง","รถเอียง","เปลี่ยนโช๊ค","เช็กช่วงล่าง"
];

const BRAND_OPTIONS = ["TOYOTA","HONDA","ISUZU","MAZDA","NISSAN","MITSUBISHI","FORD","MG","SUZUKI","CHEVROLET"];

// Common units of measure for parts (จำนวนที่ใช้), shown as a dropdown in the
// อะไหล่ในรุ่นนี้ table instead of a free-text box that clips on narrow screens.
const UNIT_OPTIONS = ["ชิ้น","เส้น","อัน","คู่","ลิตร","ชุด","ใบ"];

// Same รุ่นรถ (vehicle model) master list used in the POWER GROUP Parts Catalog app,
// shared here by both the check-in "รุ่นรถ" dropdown and the merged Catalog รุ่นรถ tab.
const VEHICLE_MODELS = [
  { brand:"HONDA", name:"ACCORD GEN7", yearRange:"2002-2007" },
  { brand:"HONDA", name:"ACCORD GEN8", yearRange:"2008-2011" },
  { brand:"HONDA", name:"ACCORD GEN9", yearRange:"2012-2016" },
  { brand:"HONDA", name:"ACCORD GEN10", yearRange:"2017-2023" },
  { brand:"HONDA", name:"CIVIC ES", yearRange:"2000-2005" },
  { brand:"HONDA", name:"CIVIC FD", yearRange:"2006-2011" },

  { brand:"TOYOTA", name:"VIGO 2WD ตัวเตี้ย", yearRange:"2004-2015" },
  { brand:"TOYOTA", name:"VIGO 4WD ตัวสูง", yearRange:"2004-2015" },

  { brand:"TOYOTA", name:"CAMRY ACV40", yearRange:"2007-2011" },
  { brand:"TOYOTA", name:"CAMRY ACV50", yearRange:"2012-2018" },
  { brand:"TOYOTA", name:"CAMRY ACV70(XV70)", yearRange:"2019-2024" },
  { brand:"TOYOTA", name:"VIOS NCP42", yearRange:"2002-2007" },
  { brand:"TOYOTA", name:"VIOS NCP93", yearRange:"2007-2013" },
  { brand:"TOYOTA", name:"VIOS NCP150", yearRange:"2014-2022" },
];
const CUSTOM_MODEL_KEY = "__custom__";

function getModelBrand(name){
  return (name || '').trim().split(/\s+/)[0].toUpperCase() || '-';
}

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

// Master parts list (สินค้า/อะไหล่กลาง) — same defaults as the Catalog app, ported in.
// The 5 part sub-groups used to organize every parts table/form throughout the app.
const PART_CATEGORIES = ["ทั่วไป","โช๊คอัพ","ผ้าเบรค","เพลาขับ","ของเหลว"];
const FALLBACK_CATEGORY = "อื่นๆ";

// Default แบรนด์ options for the "แบรนด์" dropdown on each part/price row. Users can
// add their own on top of these via the dropdown's "+ เพิ่มแบรนด์ใหม่..." option,
// which appends to state.partBrandOptions (persisted, so it's available everywhere).
const DEFAULT_PART_BRANDS = ["รีบิ้ว","OEM","POWERED"];
const ADD_BRAND_OPTION_VALUE = "__add_new_brand__";

const DEFAULT_MASTER_PARTS = [
  { name:"แร็คพวงมาลัย", category:"ทั่วไป" },
  { name:"ลูกหมากคันชัก", category:"ทั่วไป" },
  { name:"ลูกหมากกันโคลง", category:"ทั่วไป" },
  { name:"ยางกันโคลง", category:"ทั่วไป" },
  { name:"ลูกหมากปีกนก ล่าง", category:"ทั่วไป" },
  { name:"ลูกหมากปีกนก บน", category:"ทั่วไป" },
  { name:"ปีกนก ล่าง", category:"ทั่วไป" },
  { name:"ปีกนก บน", category:"ทั่วไป" },
  { name:"โช้คอัพ หน้า", category:"โช๊คอัพ" },
  { name:"เบ้าโช้คอัพ หน้า", category:"โช๊คอัพ" },
  { name:"อุปกรณ์โช้ค หน้า", category:"โช๊คอัพ" },
  { name:"โช้คอัพ หลัง", category:"โช๊คอัพ" },
  { name:"เบ้าโช้คอัพ หลัง", category:"โช๊คอัพ" },
  { name:"อุปกรณ์โช้ค หลัง", category:"โช๊คอัพ" },
  { name:"ผ้าเบรค หน้า", category:"ผ้าเบรค" },
  { name:"ผ้าเบรค หลัง", category:"ผ้าเบรค" },
  { name:"เพลาขับ", category:"เพลาขับ" },
  { name:"ยางหุ้มเพลาขับ", category:"เพลาขับ" },
  { name:"หัวเพลาขับ นอก", category:"เพลาขับ" },
  { name:"จารบีเพลาขับ", category:"เพลาขับ" },
  { name:"น้ำมันเครื่อง", category:"ของเหลว" },
  { name:"กรองน้ำมันเครื่อง", category:"ของเหลว" },
  { name:"น้ำมันเกียร์", category:"ของเหลว" },
  { name:"น้ำยาหม้อน้ำ", category:"ของเหลว" },
  { name:"น้ำมันเบรค", category:"ของเหลว" }
].map(p => ({ id: uid(), name: p.name, category: p.category }));

// Groups a flat list of {category, ...} items into an array of
// [{ category, items }] ordered by PART_CATEGORIES, with unrecognized categories
// bucketed at the end under FALLBACK_CATEGORY so nothing is ever silently hidden.
function groupByCategory(items){
  const order = PART_CATEGORIES.concat([FALLBACK_CATEGORY]);
  const buckets = {};
  order.forEach(c => { buckets[c] = []; });
  items.forEach(item => {
    const cat = PART_CATEGORIES.includes(item.category) ? item.category : FALLBACK_CATEGORY;
    buckets[cat].push(item);
  });
  return order.filter(c => buckets[c].length > 0).map(c => ({ category: c, items: buckets[c] }));
}

// Inline SVG icon set (replaces emoji throughout the UI). Minimal stroke-style icons.
function icon(name, size){

// Make sure every model in VEHICLE_MODELS exists in state.models, and keep them ordered
// the same way as the master list (unknown/custom models are appended at the end).
function ensureRequiredModels(){
  let added = false;
  VEHICLE_MODELS.forEach(rm => {
    if(!state.models.some(m => m.name === rm.name)){
      const parts = state.masterParts.map(mp => ({ id: uid(), partName: mp.name, category: mp.category, qty:'', unit:'ชิ้น', brands: [], variant:'' }));
      state.models.push({ id: uid(), brand: rm.brand, name: rm.name, yearRange: rm.yearRange, parts, promotions: [] });
      added = true;
    }
  });
  const order = VEHICLE_MODELS.map(rm => rm.name);
  const known = [];
  const extra = [];
  state.models.forEach(m => (order.includes(m.name) ? known : extra).push(m));
  known.sort((a,b) => order.indexOf(a.name) - order.indexOf(b.name));
  state.models = known.concat(extra);
  saveState(false);
}

// Migration: older saved catalogs stored the brand baked into model.name (e.g.
// "HONDA ACCORD GEN7"), which caused it to show twice once a separate brand field
// was added elsewhere (e.g. "HONDA HONDA ACCORD GEN7"). Split brand out of name for
// any model missing a .brand field, but only strip the leading word from name when
// it's a recognized brand (BRAND_OPTIONS) — unknown/custom entries are left as-is.
function ensureModelBrandSplit(){
  let changed = false;
  state.models.forEach(m => {
    if(m.brand === undefined){
      const firstWord = (m.name || '').trim().split(/\s+/)[0].toUpperCase();
      if(BRAND_OPTIONS.includes(firstWord)){
        m.brand = firstWord;
        m.name = m.name.trim().slice(firstWord.length).trim();
      } else {
        m.brand = firstWord || '-';
      }
      changed = true;
    }
  });
  if(changed) saveState(false);
}

// Migration: vehicles checked in via the model list before the brand/name split
// have vehicle.model duplicating vehicle.brand (e.g. brand "HONDA", model
// "HONDA CIVIC FB"). Strip the leading brand word off vehicle.model so brand only
// shows once wherever brand+model are displayed together.
function ensureVehicleModelBrandFix(){
  let changed = false;
  state.vehicles.forEach(v => {
    if(v.brand && v.model){
      const escapedBrand = v.brand.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('^' + escapedBrand + '\\s+', 'i');
      if(re.test(v.model)){
        v.model = v.model.replace(re, '').trim();
        changed = true;
      }
    }
  });
  if(changed) saveState(false);
}

// Migration: (1) backfill category on any master/model part missing one, matching by
// name against DEFAULT_MASTER_PARTS where possible, else "ทั่วไป". (2) Add the
// master-parts catalog's newer items (e.g. ผ้าเบรค/เพลาขับ/ของเหลว items added along
// with the category system) to state.masterParts if missing. (3) Backfill those same
// missing items onto EVERY existing model's parts list too, so every model ends up
// with the full standard set — existing brand/price data on parts that already
// existed is left untouched.
function ensurePartCategories(){
  let changed = false;
  const categoryByName = {};
  DEFAULT_MASTER_PARTS.forEach(mp => { categoryByName[mp.name] = mp.category; });

  state.masterParts.forEach(p => {
    if(p.category === undefined){ p.category = categoryByName[p.name] || 'ทั่วไป'; changed = true; }
  });
  const deletedNames = state.deletedMasterPartNames || [];
  DEFAULT_MASTER_PARTS.forEach(mp => {
    if(deletedNames.includes(mp.name)) return;
    if(!state.masterParts.some(p => p.name === mp.name)){
      state.masterParts.push({ id: uid(), name: mp.name, category: mp.category });
      changed = true;
    }
  });

  state.models.forEach(m => {
    m.parts.forEach(p => {
      if(p.category === undefined || p.category === ''){
        // Prefer a same-named sibling row in this model that already has a category
        // (covers ซ้าย/ขวา splits and + ตัวแปร duplicates made before they carried
        // category over), else fall back to the master-parts name match, else ทั่วไป.
        const sibling = m.parts.find(sp => sp !== p && sp.partName === p.partName && sp.category);
        p.category = (sibling && sibling.category) || categoryByName[p.partName] || 'ทั่วไป';
        changed = true;
      }
    });
    DEFAULT_MASTER_PARTS.forEach(mp => {
      if(deletedNames.includes(mp.name)) return;
      if(!m.parts.some(p => p.partName === mp.name)){
        m.parts.push({ id: uid(), partName: mp.name, category: mp.category, qty:'', unit:'ชิ้น', brands: [], variant:'' });
        changed = true;
      }
    });
  });

  if(changed) saveState(false);
}

/* ============================================================================
   CLOUD SYNC LAYER  (Firebase Auth + Firestore)

   Design note — why it's built this way:
   The rest of this file mutates one big `state` object and then calls
   saveState(). With ~100 call sites, rewriting each one into an individual
   Firestore write would be a huge, bug-prone change. Instead saveState() now
   DIFFS `state` against a shadow copy of what the server last confirmed, and
   writes only the documents that actually changed. Every existing call site
   keeps working unchanged, but two people editing two different jobs no longer
   overwrite each other — which is exactly the bug the old whole-blob save had.

   Data layout in Firestore:
     jobs/{id}, vehicles/{id}, customers/{id}, models/{id},
     masterParts/{id}, partBrandOptions/{id}, complaintTypes/{id}, editLog/{id}
     config/main   -> { shop, settings, deletedMasterPartNames }
     users/{uid}   -> { name, email, role: 'admin' | 'staff' }
     jobPhotos/{id}-> { jobId, dataUrl }   (one doc per photo; keeps job docs small)
   ============================================================================ */

const SYNC_COLLECTIONS = [
  'jobs','vehicles','customers','models',
  'masterParts','partBrandOptions','complaintTypes','editLog'
];

// How many of the newest jobs stay live-synced on each device. ~2 months of work at
// 30 cars/day. Older jobs remain safely in Firestore and in exported backups.
const RECENT_JOBS_LIMIT = 600;

/* ---------------------------------------------------------------------------
   PUBLIC CUSTOMER BOARD

   The waiting-room QR opens this app with ?board, which skips login entirely.
   That means anything it can read is readable by anyone who has the link, so it
   must NOT read `jobs` — those documents carry customer names, phone numbers,
   reported faults and prices, and Firestore security rules cannot hide individual
   fields (it's all-or-nothing per document).

   Instead the app publishes a stripped copy of each job to `board/{jobId}` holding
   only what a customer needs to spot their own car: queue number, make/model,
   colour, a partially masked plate, and the status. Everything else stays private.
   --------------------------------------------------------------------------- */

// 1กณ6895 -> 1กณ••95 : enough for the owner to recognise, not much use to a stranger.
function maskPlate(plate){
  const s = (plate || '').trim();
  if(s.length <= 4) return s;
  const head = s.slice(0, 3);
  const tail = s.slice(-2);
  return head + '••' + tail;
}

/* The board is only written when a job is saved, so jobs that already existed before
   the board feature shipped would never appear. This publishes any job whose board
   entry is missing or out of date — it runs once automatically after login, and can
   also be triggered by hand from Settings. Deletions are NOT handled here on purpose:
   the jobs listener only carries the most recent slice, so anything older would look
   "missing" and get wrongly removed. Real deletions go through flushState. */
let boardReconciled = false;

function reconcileBoard(showToast){
  if(!db || !dataReady || !currentUser) return;
  db.collection('board').get()
    .then(snap => {
      const existing = {};
      snap.forEach(d => existing[d.id] = d.data() || {});
      let batch = db.batch();
      let ops = 0;
      const commits = [];
      (state.jobs || []).forEach(job => {
        const payload = boardPayloadFor(job);
        const prev = existing[job.id];
        // updatedAt always differs, so compare only the fields customers actually see
        if(prev
          && prev.status === payload.status
          && prev.queueNo === payload.queueNo
          && prev.plateMasked === payload.plateMasked
          && prev.brand === payload.brand
          && prev.model === payload.model
          && prev.color === payload.color) return;
        batch.set(db.collection('board').doc(job.id), cleanForFirestore(payload));
        ops++;
        if(ops >= 400){ commits.push(batch.commit()); batch = db.batch(); ops = 0; }
      });
      if(ops > 0) commits.push(batch.commit());
      if(commits.length === 0){
        if(showToast) flashToast('กระดานเป็นข้อมูลล่าสุดอยู่แล้ว');
        return;
      }
      return Promise.all(commits).then(() => {
        if(showToast) flashToast('อัปเดตกระดานเรียบร้อย');
      });
    })
    .catch(err => {
      console.error('reconcileBoard', err);
      if(showToast) flashToast('อัปเดตกระดานไม่สำเร็จ: ' + (err.message || err.code));
    });
}

function boardPayloadFor(job){
  const v = getVehicle(job.vehicleId) || {};
  const st = statusOf(job.status);
  return {
    queueNo: job.queueNo || '',
    plateMasked: maskPlate(v.plate),
    brand: v.brand || '',
    model: v.model || '',
    color: v.color || '',
    status: job.status || 'received',
    statusLabel: st.label,
    statusCls: st.cls,
    createdAt: job.createdAt || nowIso(),
    updatedAt: nowIso()
  };
}

/* Connection indicator. Deliberately driven by the browser's own online/offline

let isOnline = navigator.onLine !== false;

// Firestore rejects `undefined`. Strip it (and any functions) before writing.
function cleanForFirestore(value){
  if(value === undefined || typeof value === 'function') return null;
  if(value === null || typeof value !== 'object') return value;
  if(Array.isArray(value)) return value.map(cleanForFirestore);
  const out = {};
  Object.keys(value).forEach(k => {
    const v = cleanForFirestore(value[k]);
    if(v !== undefined) out[k] = v;
  });
  return out;
}

/* ---------------- Auth ---------------- */
function initFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  // Keep working through short network drops; queued writes flush on reconnect.
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  auth.onAuthStateChanged(handleAuthChange);
}

function handleAuthChange(user){
  detachListeners();
  if(!user){
    currentUser = null;
    dataReady = false;
    renderLogin();
    return;
  }
  renderAuthStatus('กำลังเข้าสู่ระบบ...');
  db.collection('users').doc(user.uid).get()
    .then(doc => {
      const profile = doc.exists ? doc.data() : null;
      if(!profile && user.uid !== BOOTSTRAP_ADMIN_UID){
        // Account exists in Auth but the admin hasn't granted it access yet.
        auth.signOut();
        renderLogin('บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าใช้งาน กรุณาติดต่อผู้ดูแลระบบ');
        return;
      }
      currentUser = {
        uid: user.uid,
        email: user.email || '',
        name: (profile && profile.name) || (user.email || '').split('@')[0],
        role: (profile && profile.role) || (user.uid === BOOTSTRAP_ADMIN_UID ? 'admin' : 'staff')
      };
      // First ever login by the bootstrap admin: write their own users/ entry so the
      // account shows up in the user list like everyone else.
      if(!profile && user.uid === BOOTSTRAP_ADMIN_UID){
        db.collection('users').doc(user.uid).set({
          name: currentUser.name, email: currentUser.email, role: 'admin'
        }).catch(() => {});
      }
      startSync();
    })
    .catch(err => {
      renderLogin('อ่านข้อมูลผู้ใช้ไม่สำเร็จ: ' + (err.message || err));
      auth.signOut();
    });
}

function doLogin(){
  const email = (document.getElementById('login-email') || {}).value || '';
  const pass  = (document.getElementById('login-pass')  || {}).value || '';
  if(!email.trim() || !pass){ renderLogin('กรุณากรอกอีเมลและรหัสผ่าน'); return; }
  renderAuthStatus('กำลังตรวจสอบ...');
  auth.signInWithEmailAndPassword(email.trim(), pass).catch(err => {
    const map = {

      'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
      'auth/too-many-requests': 'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่',
      'auth/network-request-failed': 'เชื่อมต่ออินเทอร์เน็ตไม่ได้'
