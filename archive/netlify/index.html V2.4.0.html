          <div class="part-variant-actions">
            ${!part.variant ? `<button class="add-brand-btn" title="แยกเป็นซ้าย/ขวา (เพิ่มแถวขวาให้อัตโนมัติ)" onclick="splitPartLR('${model.id}','${part.id}')">แยกซ้าย/ขวา</button>` : ''}

// Comma-separated money formatting, e.g. 400 -> "400", 12000 -> "12,000".

/* ================= Public customer board (no login) ================= */
let boardRows = [];
let boardReady = false;

function isBoardMode(){
  return /(^|[?&])board(=|&|$)/.test(location.search) || location.hash === '#board';
}

function boardUrl(){
  return location.origin + location.pathname + '?board';
}

function startBoard(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  renderBoard();   // paint the shell immediately so the screen isn't blank
  db.collection('board').onSnapshot(snap => {
    const rows = [];
    snap.forEach(d => rows.push(Object.assign({}, d.data(), { id: d.id })));
    boardRows = rows;
    boardReady = true;
    renderBoard();
  }, err => {
    console.error('board', err);
    boardReady = true;
    renderBoard(err.code === 'permission-denied'
      ? 'ยังไม่ได้เปิดสิทธิ์ให้ดูกระดานนี้ กรุณาแจ้งพนักงาน'
      : 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่');
  });
  // The board hangs on a wall/table all day — keep the clock honest.
  setInterval(() => { if(boardReady) renderBoard(); }, 60000);
}

// Only cars still in the shop, newest queue first. Delivered cars drop off after a
// while so the board doesn't turn into a history log for the waiting room.
function boardVisibleRows(){
  const cutoff = Date.now() - 1000 * 60 * 60 * 12;
  return boardRows
    .filter(r => {
      if(r.status !== 'delivered') return true;
      const t = Date.parse(r.updatedAt || r.createdAt || '');
      return isFinite(t) && t > cutoff;
    })
    .sort((a, b) => {
      const qa = parseInt(a.queueNo, 10);
      const qb = parseInt(b.queueNo, 10);
      if(isFinite(qa) && isFinite(qb) && qa !== qb) return qa - qb;
      if(isFinite(qa) !== isFinite(qb)) return isFinite(qa) ? -1 : 1;
      return String(a.createdAt||'').localeCompare(String(b.createdAt||''));
    });
}

function renderBoard(errorMsg){
  const app = document.getElementById('app');
  const rows = boardVisibleRows();
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');

  let html = `<div class="board-wrap">
    <div class="hazard-edge"></div>
    <div class="board-head">
      <div>
        <div class="board-title">${escapeHtml(state && state.shop ? state.shop.name : 'POWER GROUP')}</div>
        <div class="board-sub">สถานะรถที่กำลังดำเนินการ</div>
      </div>
      <div class="board-clock mono">${pad(now.getHours())}:${pad(now.getMinutes())}</div>
    </div>`;

  if(errorMsg){
    html += `<div class="board-empty">${escapeHtml(errorMsg)}</div>`;
  } else if(!boardReady){
    html += `<div class="board-empty">กำลังโหลด...</div>`;
  } else if(rows.length === 0){
    html += `<div class="board-empty">ยังไม่มีรถที่กำลังดำเนินการ</div>`;
  } else {
    html += `<div class="board-grid">`;
    rows.forEach(r => {
      const carLine = [r.brand, r.model].filter(Boolean).join(' ') || 'ไม่ระบุรุ่น';
      html += `<div class="board-card ${escapeAttr(r.statusCls||'')}">
        <div class="bc-queue mono">${escapeHtml(r.queueNo || '—')}</div>
        <div class="bc-mid">
          <div class="bc-car">${escapeHtml(carLine)}</div>
          <div class="bc-meta">${escapeHtml(r.color || '')}${r.color && r.plateMasked ? ' · ' : ''}<span class="mono">${escapeHtml(r.plateMasked || '')}</span></div>
        </div>
        <div class="bc-status ${escapeAttr(r.statusCls||'')}">${escapeHtml(r.statusLabel || '')}</div>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="board-legend">`;
    STATUS_FLOW.forEach(s => {
      html += `<span class="bl-item"><span class="sw ${s.cls}"></span>${escapeHtml(s.label)}</span>`;
    });
    html += `</div>`;
  }

  html += `<div class="board-foot">
      หน้านี้อัปเดตอัตโนมัติ ไม่ต้องรีเฟรช · ค้นหารถของท่านจากหมายเลขคิวที่ได้รับตอนฝากรถ<br>
      หากไม่พบรถของท่าน กรุณาสอบถามพนักงาน
    </div>
  </div>`;

  app.innerHTML = html;
}

/* ================= Boot ================= */
function boot(){
  if(typeof firebase === 'undefined'){
    document.getElementById('app').innerHTML =
      `<div class="auth-screen"><div class="auth-box">
        <div class="auth-brand">POWER GROUP</div>
        <div class="auth-err" style="margin-top:18px;">
          โหลดระบบเชื่อมต่อไม่สำเร็จ<br><br>
          กรุณาตรวจสอบว่าเครื่องนี้ต่ออินเทอร์เน็ตอยู่ แล้วรีเฟรชหน้าใหม่อีกครั้ง
        </div>
      </div></div>`;
    return;
  }
  // ?board = the waiting-room screen. No login, and it never touches `jobs`.
  if(isBoardMode()){ startBoard(); return; }
  initFirebase();
}

boot();
</script>
</body>
</html>
