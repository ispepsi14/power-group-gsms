<!-- viewport-fit=cover is required for env(safe-area-inset-*) to report anything but 0,
     which is what keeps the bottom tab bar clear of the iPhone home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- "Add to Home Screen" on iPhone/iPad: run fullscreen like a real app, no browser chrome -->

<!-- ===================== Firebase (cloud sync + login) =====================

     functions wired up with inline onclick handlers, and compat exposes a global
     `firebase` object that works with ordinary <script> tags. The modular SDK
     would require type="module", which puts every function out of global scope
     and would break every onclick in the file. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

  // Access is controlled by Firestore Security Rules + user accounts, not by hiding this.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDaZS0zuG4AcC5d0-BE2AJIRtmjh8bfrzE",
    authDomain: "power-group-gsms.firebaseapp.com",
    projectId: "power-group-gsms",
    storageBucket: "power-group-gsms.firebasestorage.app",
    messagingSenderId: "794612913632",
    appId: "1:794612913632:web:8412ee1e11ec3a46e90785"

  // document exists, so the very first login can create everyone else.
  const BOOTSTRAP_ADMIN_UID = "79YAV3SBT7ZAFfCz9rLMYyTRlPw1";

</script>

     ===================== V2 — multi-device cloud version =====================
     v2.0.0 — moved off single-device localStorage onto Firebase (Auth + Firestore)
              so 4 iPhones + 1 iPad + 2 PCs share one live dataset.
              * saveState() no longer writes the whole blob. It now DIFFS state
                against a shadow of the last server snapshot and writes only the
                documents that changed. This is what stops two people editing two
                different jobs from silently wiping each other — the single most
                dangerous bug in the old design once more than one device exists.
                Every one of the ~100 existing saveState() call sites still works
                unchanged, which is why it was done this way rather than rewriting
                each one into an individual write.
              * Login screen (email + password). No self-signup: an account that
                exists in Firebase Auth still cannot get in until an admin grants it
                a users/{uid} document. Signed-in user + live sync dot shown in the
                app bar.
              * Roles. staff = รับรถ / เปลี่ยนสถานะ / ใส่ราคา-ทำใบเสนอราคา.
                admin = the above plus delete jobs, catalog (รุ่นรถ/สินค้า/ตำราราคา),
                shop settings and user management. Enforced BOTH in the UI and in
                Firestore Security Rules — the UI gating alone is only cosmetic.
              * New ผู้ใช้งาน page (admin only) to assign name + role per UID, with
                a capability table. BOOTSTRAP_ADMIN_UID is treated as admin even
                with no users/ document, which solves the chicken-and-egg of
                creating the very first account, and doubles as a lockout safety net.
              * Catalog seeding is no longer automatic on load — otherwise all 7
                devices would each seed their own duplicate copy of the 25 standard
                models/parts. Only field backfills run automatically; creating the
                standard catalog is now an explicit admin import.
              * Import rewritten to push a V1 backup file up to the cloud (admin only).
              * Offline persistence on, so short wifi drops queue writes instead of
                losing them.
              * Snapshot-driven redraws are deferred while an input is focused, so a
                teammate's edit landing mid-typing can't steal the caret.
     v2.0.1 — connection dot now reads the browser's online/offline events instead of
              Firestore's snapshot.metadata.fromCache. With offline persistence on, the
              first snapshot legitimately comes from cache, so the dot was reporting
              "offline" immediately after a perfectly normal login.
     v2.1.0 — proper iPad support. The old single 820px breakpoint gave every iPad the
              desktop layout, because an iPad is 744-1024px in portrait and up to
              1366px in landscape — as wide as a laptop. Split into tiers:
                * TOUCH (iPhone + iPad): matched by `(max-width:1100px)` OR
                  `(pointer:coarse) and (max-width:1400px)`. The pointer test is what
                  separates a landscape iPad Pro from the shop's desktop PCs, since
                  width alone cannot. Bottom tab bar, finger-sized controls, and 16px
                  form inputs so iOS stops auto-zooming on focus.
                * iPad refinement: same touch layout but uses the extra width —
                  2-column forms, 3-up model grid, real tables instead of the phone's
                  stacked cards, wider bottom-bar labels.
                * PHONE (<=700px): single column + stacked quote-table cards.
              Also added the iOS "Add to Home Screen" meta tags (runs fullscreen with
              no browser chrome) and viewport-fit=cover, without which
              env(safe-area-inset-*) always returns 0 and the bottom tab bar collides
              with the iPhone home indicator.
     v2.2.0 — shop-workflow pass, sized for 20-30 cars/day.
              * Statuses expanded 5 -> 8 with a fixed colour per stage: รับรถ(แดง),
                ตรวจเช็ค(ส้ม), เสนอราคา(เหลือง), ลูกค้ากลับก่อน(แดงอ่อน), กำลังซ่อม(ฟ้าอ่อน),
                รอตั้งศูนย์(ฟ้าเข้ม), พร้อมส่งมอบ(เขียวอ่อน), ส่งมอบแล้ว(เขียวเข้ม). The same
                palette drives the badge, the card's left edge and the filter pills.
                Jobs on an unrecognised status fall back to รับรถ rather than blank.
              * PHOTOS REWORKED — this was the real scaling risk. A phone photo is
                2-4MB and Firestore caps a document at 1MB, so storing them inline
                would have started failing within days. Each photo is now shrunk to
                ~1000px and stored in its OWN jobPhotos document, fetched only when
                that job is opened, while a ~240px thumbnail rides on the job so the
                list renders instantly. Photos can be added/deleted after check-in,
                and deleting a job cleans up its photos instead of orphaning them.
              * Jobs listener capped at the newest 600 (RECENT_JOBS_LIMIT). Safe with
                the diff-based save because `shadow` is built from the same snapshot,
                so unseen older jobs are never mistaken for deletions.
              * Job list is 2-up on desktop and iPad with one photo per card.
              * Plate field: autocapitalize/autocorrect off — with them on iOS flipped
                back to the letter keyboard after EVERY character, which is why typing
                1กณ6895 meant tapping "123" before each digit. จังหวัด now sits beside
                the plate instead of further down the form.
              * ยี่ห้อ/รุ่น locked to uppercase for real (not just CSS), with the caret
                preserved, so hand-typed entries match catalog formatting.
              * ใบรับรถ and ใบเสนอราคา now share renderJobFormHeader() so they cannot
                drift apart, and both show ยี่ห้อ / รุ่น / สี / ปี / เลขไมล์ as separate
                fields. Quote section retitled "รายการอะไหล่ / เสนอราคา".
              * Parts picker always available: if the vehicle's model isn't in the
                catalog it now falls back to the master parts list instead of showing
                no picker at all.
     v2.3.0 — workshop visual identity, applied across the app AND the printed forms.
              Kept the light, legible base and added garage cues rather than going
              full industrial-dark — this is used on phones in daylight all day.
              * License plates render as actual plates (bordered box, monospace) on
                job cards, the job detail header, the check-in field and both printed
                forms. Staff identify cars by plate, so it's now the loudest element.
              * Monospace tabular figures for plates, job numbers, mileage and money,
                so digits line up down a column.
              * Diagonal hazard stripe under the app bar, at the top of each printed
                form, and on the login card. Safety-yellow is reserved for "the next
                action" — the advance-status button on each job card.
              * Section headings restyled as workshop signage (letter-spaced, steel
                rule beneath) with wrench/car/gauge icons on the key cards.
              * Added print-color-adjust so the stripe and status colours survive
                printing — browsers drop background graphics by default. Stripe thins
                to 4px on paper to keep ink use down.
     v2.4.0 — public customer status board for the waiting room, opened by QR at
              ?board with no login (a login screen would mean nobody ever looks at it).
              PRIVACY IS THE WHOLE DESIGN CONSTRAINT HERE: no-login means anyone with
              the link can read whatever that page can read, and Firestore rules are
              all-or-nothing per document — they cannot hide individual fields. So the
              board does NOT read `jobs` (those hold names, phone numbers, reported
              faults and prices). Instead every job save also publishes a stripped
              copy to board/{jobId} carrying only queue number, make/model, colour,
              a masked plate (1กณ6895 -> 1กณ••95) and status. Deleting a job deletes
              its board entry too.
              * board/ is the only collection with `allow read: if true`; writes still
                require a signed-in user.
              * Board UI is built for glanceability: queue number is the largest
                element, status is a solid colour block, sorted by queue, delivered
                cars drop off after 12h, live-updating with no refresh, clock in the
                header for a wall screen.
              * Settings gains a QR card — on-screen QR, copy link, preview, and a
                print-ready A4 sign with instructions for the waiting-room table. The
                QR encoder loads from CDN on demand rather than being bundled.
     v2.4.1 — FIX: the board came up empty even with 23 cars on the job list. Board
              entries were only written when a job was SAVED, so every job that already
              existed before v2.4.0 shipped had none — and nobody is going to open and
              re-save 23 jobs by hand. Added reconcileBoard(), which compares the board
              against the synced jobs and publishes anything missing or stale. Runs once
              automatically shortly after login, plus a manual "อัปเดตกระดานตอนนี้"
              button in Settings. It deliberately never deletes: the jobs listener only
              carries the newest slice, so older jobs would look missing and get wiped —
              real deletions still flow through flushState.
     v2.5.0 — plates redrawn to actually look like Thai plates: number on top in
              monospace, province on a smaller second line, black bezel with a hairline
              inset. One plateHtml() helper now feeds job cards, job detail, both
              printed forms and the customer board, so they can't drift apart.
              Customer board reworked for recognition-at-a-glance: the queue number is
              a stamped dark ticket block (it's what the customer was handed at
              drop-off, so it anchors the row), and each row now carries the car's
              photo thumbnail.
              PRIVACY NOTE: board photos are public to anyone holding the link, which
              partly undoes the plate masking if a picture happens to show the plate.
              Only the small 240px thumbnail is published, never the full-size images.
     v2.5.1 — board now publishes the FULL plate instead of a masked one, at the shop's
              request — customers were meant to find their car at a glance and half a
              plate made that harder. maskPlate() removed rather than left dead.
              The board still carries no name, phone, reported fault or price.
              reconcileBoard compares on the new `plate` field, so board entries written
              by earlier versions are detected as stale and rewritten automatically;
              renderBoard falls back to the old plateMasked value until that happens so
              nothing renders blank in between.
     v2.6.0 — job list is now scoped to ONE DAY and opens on today. At 20-30 cars a day
              an unfiltered list stops being usable within a week. Day navigator with
              prev/next arrows, วันนี้ / ทุกวัน chips and a date picker; status-pill
              counts follow the selected day (otherwise the numbers contradict the
              list) and stages with nothing in them are hidden. Dates are bucketed in
              LOCAL time — slicing the ISO string would bucket by UTC and push anything
              checked in after 07:00 Thai time onto the wrong day.
              * Status progress redrawn: eight identical dots read as noise, so it's
                now a segmented track where each completed stage carries its own status
                colour and the current segment is taller with a ring.
              * Check-in reworked for speed on phone/tablet. The 25-chip parts list is
                collapsed behind an optional toggle — the shop's actual flow is check
                in, print, hand to the mechanic, THEN quote, so it was dead weight in
                the middle of the form. Submit is now a sticky bar showing the plate
                and queue, sitting clear of the bottom tab bar, so it's always in reach
                instead of several screens down. Mileage enlarged and set in tabular
                figures.
     v2.6.1 — the day picker showed 08/01/2026 (US MM/DD). A native <input type="date">
              renders in the BROWSER's locale and that cannot be overridden from the
              page — not by lang="th", not by CSS. So its text is hidden altogether and
              it's now an icon-only calendar button: the input is stretched invisibly
              over the icon to open the native picker (more reliable than showPicker(),
              which older Safari lacks). The human-readable date stays as the Thai
              label already in the bar (วันนี้ / เมื่อวาน / จ. 4 ส.ค. 69).
     v2.7.0 — added the shop's own parts-catalogue model list (123 entries across 16
              brands) as CATALOG_VEHICLE_MODELS, transcribed VERBATIM. Rows that cover
              two models at once ("CITY '05, JAZZ (GD) '03-07", "TRITON 4WD, PAJERO",
              "VIGO 2WD, INNOVA '04-14") are kept as single entries on purpose — one
              part fits both, and splitting them would break the lookup the shop uses.
              Years stay inside the name, so yearRange is left blank rather than
              inventing a range that could contradict it.
              * Added ALONGSIDE the original 25 seeded models rather than replacing
                them, because those already carry parts and prices in Firestore.
                Overlapping entries can now be renamed or deleted by hand.
              * Import is a deliberate admin action ("เพิ่มรุ่นจากแคตตาล็อก (n)" on the
                รุ่นรถ page) showing how many are missing — never automatic, or seven
                devices would each seed their own copy.
              * Models now carry a stable seedKey (brand|original name). The importer
                matches on that, not the current name, so a RENAMED model isn't seen as
                missing and duplicated on the next import.
              * ยี่ห้อ / ชื่อรุ่น / ปี are now editable per model (แก้ชื่อรุ่น in the model
                workspace); parts and prices are untouched by a rename.
              * ensureUppercaseNames() normalises brand/model/plate on load, so data
                from imports or older builds obeys the all-uppercase house rule too.
     v2.8.0 — work bays: H1-H11 plus the ตั้งศูนย์ alignment rack (12 total).
              * A car can only be in one bay, so assigning an occupied bay bumps the
                previous car out automatically — otherwise two jobs would claim the
                same lift and the floor view would quietly lie. The picker shows what's
                parked in each bay before you choose, and jobs already ส่งมอบแล้ว don't
                hold a bay.
              * Job list gains a collapsible floor overview showing all 12 bays with
                occupancy count, the car's plate and its status colour; tapping an
                occupied bay opens that job. Each job card shows its bay as a chip and
                has a one-tap bay button beside เปลี่ยนสถานะ. Job detail shows the bay
                in the info grid with a เปลี่ยน button.
              * The customer board shows the bay too, so a customer can see not just
                that their car is being worked on but where it physically is.
              NOTE: the shop's folder was renamed C.CATALOG -> C partway through, so
              the working path is now .../POWER GROUP/C/C.GSMS/.
     v2.9.0 — the flow stops being a straight line. After เสนอราคา the customer answers,
              and two of the three answers end the job early:
                รับรถ › ตรวจเช็ค › เสนอราคา ─┬─ อนุมัติ › กำลังซ่อม › รอตั้งศูนย์ › พร้อมส่ง › ส่งแล้ว
                                             ├─ นัดวันมาทำ › เอารถลง
                                             └─ ไม่อนุมัติ › เอารถลง
              ลูกค้ากลับก่อน removed; anything still on it is mapped to เสนอราคา, which is
              where that state actually sat.
              * On a job sitting at เสนอราคา the single "next step" button is replaced by
                the three decision buttons, each colour-coded and each moving the status.
              * The progress track is built from whichever branch the job is on — a
                rejected car no longer renders as "3 of 8 done, 5 to go".
              * LINE summary now updates itself for the second post: once parts are
                quoted it appends the itemised list and total, and the closing line
                follows the real status instead of always saying รอเช็ค.
              * Printed quote gains 6 blank numbered rows for parts found mid-repair,
                so extras can be written on without reprinting.
              * Job list gains a queue strip — กำลังทำคิว / คิวถัดไป / รออีก n คัน — and a
                column-count switcher clamped per device (phone 1-2, iPad 1-3,
                desktop 2-4).
              * Job cards restructured: photo on top with the plate directly beneath at
                the SAME fixed width, so cards align in a column regardless of plate or
                model length.
              * Edit-history table re-proportioned — fixed widths for date/action/job/
                plate, details gets the remaining space, action shown as a tag.
              * FIX: printing did nothing from the iPhone home-screen app. iOS gives
                standalone-mode windows no print pipeline and window.print() fails
                silently — there is no JS workaround. The app now detects standalone
                mode and offers to hand the page to Safari, where AirPrint works,
                instead of leaving a dead button.
     v3.0.0 — รุ่นรถ list replaced wholesale with the shop's corrected 101-entry list,
              brand and model already split properly by them.
              * FIXED the ยี่ห้อ ACCORD / รุ่น GEN8 bug at its source. The check-in
                dropdown keyed models by NAME and, when the lookup missed, derived the
                brand from the first word of the model name. It now keys by model ID and
                reads brand/model straight off the catalogue record — never inferred.
              * ensureVehicleBrandRepair() fixes vehicles already saved that way: if a
                vehicle's "brand" isn't a real brand but exactly one catalogue brand has
                models starting with that word, it's folded back (ACCORD + GEN8 ->
                HONDA + ACCORD GEN8). Ambiguous cases are left for manual editing rather
                than guessed at.
              * "ลบทั้งหมดแล้วโหลดรายการใหม่" on the รุ่นรถ page wipes the catalogue and
                rebuilds it. Deliberately destructive — it drops prices attached to the
                old models — so it warns and suggests taking a backup first. Jobs,
                vehicles and customers are untouched.
              * Parts removed from check-in entirely. Jobs now start with an empty parts
                list and everything is chosen on the job detail page after inspection,
                matching how the shop actually works. Check-in is that much shorter.
              * The check-in model dropdown is now built from the live catalogue rather
                than the hardcoded seed list, so renames and additions appear at once.
     v3.1.0 — * Customer board now shows the workshop floor (all 12 bays with the car in
                each) — derived from the board rows already published, so no extra data
                is exposed.
              * Customer board is TODAY ONLY. It was accumulating every day into one
                list, which is unreadable in a waiting room. Bucketed by local date, same
                rule as the job list.
              * Board opened as a preview from Settings now has a back button. It only
                appears when there's history to go back to, so the real waiting-room
                screen (launched fresh from the QR) stays clean.
              * The three decision buttons moved out of the status row onto their own
                labelled row ("ลูกค้าตอบว่า"), and appear only while the job is at
                เสนอราคา — never on any other status.
              * Job list is one column on phones (was up to two); the column switcher
                hides there since there's nothing to choose.
              * Edit history reflows on phones: the 5-column table becomes one block per
                entry, with the action as a tag in the corner and details on their own
                line under a divider.
     v3.1.1 — FIX: the bay grid never appeared on the customer board. Two mistakes in
              v3.1.0 — it was nested inside the "there are cars today" branch, so an
              empty day showed nothing at all, and it read occupancy from the
              today-filtered rows. Bays are now drawn unconditionally and read from ALL
              board rows: a car checked in yesterday that's still on a lift genuinely
              occupies that bay, and marking it free would be a lie. Cars already handed
              back (ส่งแล้ว / เอารถลง) release their bay.
     v3.1.2 — FIX (real cause this time): the plate keyboard flipped back to letters on
              every character. v2.2.0 blamed autocapitalize, but the actual cause is
              that onPlateInput called render() per keystroke — render() rebuilds the
              whole DOM, the input element is destroyed and recreated, and a recreated
              input makes iOS discard the keyboard state. Restoring the caret, which the
              old code did, cannot restore the keyboard. The page is now only rebuilt
              when the plate starts or stops matching a known vehicle; ordinary
              keystrokes update the value and the sticky summary in place.
     v3.2.0 — รุ่นรถ at check-in is now a searchable picker instead of a <select>. With
              100+ models a native dropdown is a tiny scroll wheel on a phone. Search
              matches brand and model together, so "civic", "honda fb" and "accord g8"
              all find the right row. Filtering runs inside the modal's own DOM and
              never calls render(), so typing can't rebuild the page and reset the iOS
              keyboard — the same trap that caused the plate-field bug.
              Logo mark changed from the wrench to a bolt.
     v3.2.1 — FIX: adding a user could silently overwrite an existing one. addUserAccess
              wrote with set() and never checked whether that UID already had access, so
              pasting a UID that was already in the list — most easily your own, since
              it's the row you're looking at — replaced that record's name and role with
              the new ones. Existing UIDs are now refused with an explanation, and
              changes have to be made in the table instead.
              Added repairBootstrapAdmin(): if the bootstrap account's record has been
              damaged this way it's restored to admin on login. The app and the security
              rules already treated that UID as admin regardless of its document, so
              access was never actually lost — but the stored record was wrong and the
              user list showed it as staff.
     v3.2.2 — the email on a user record was only ever a hand-typed label, so it could
              drift from the address the account really signs in with (and the overwrite
              bug left some holding the wrong one). The signed-in user's address is now
              corrected automatically from the real account on login. Other users'
              addresses can't be read by the client SDK — Firebase only exposes the
              current user — so those became editable in the table instead.
     v3.2.3 — browser tab title trimmed to just "POWER GROUP".
     v3.2.4 — removed the "ระบบจัดการอู่บริการ + แคตตาล็อกอะไหล่" strapline from the app
              bar; the brand and version stand alone.
     v3.2.6 — board footer now shows the app version, so it is possible to tell at a
              glance whether the waiting-room screen is running the latest deploy or a
              cached copy — the board has no app bar, so there was no version anywhere
              on it.
     v3.2.5 — customer board clock now shows seconds and ticks live. Only the clock
              element is rewritten each second — redrawing the whole board once a second
              would be wasteful on a screen that runs all day. The 60s full redraw stays
              so the "today only" filter rolls over at midnight; car data still arrives
              through onSnapshot rather than any timer. -->




<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

  :root{
    --bg:#ffffff;
    --surface:#f4f4f5;
    --surface-2:#eceeef;
    --border:#DDDDDD;
    --text:#222831;
    --text-2:#6b7684;
    --dark:#222831;
    --navy:#30475E;
    --red:#F05454;
    --red-bg:#fdeaea;
    --black:#222831;
    --danger:#F05454;
    --danger-bg:#fdeaea;
    --radius:10px;

    /* Workshop accents. --hazard is the safety-yellow used on the striped edge and
       on the "next action" buttons; --steel is the muted metal tone for plate
       borders and technical rules. */
    --hazard:#E8BB2D;
    --hazard-dark:#3D3000;
    --steel:#4A525C;
    /* Technical figures — plates, job numbers, prices, mileage — sit in a monospace
       face so digits line up in columns and a plate reads like a plate. */
    --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai', -apple-system, sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  }
  #app{min-height:100vh;}

  .ic{flex-shrink:0;}
  .btn .ic, .topnav-btn .ic, .tab-btn .ic, h3 .ic{margin-right:6px;}

  /* Diagonal hazard stripe — the one piece of workshop signage in the chrome.
     Used on the app bar's bottom edge and at the top of every printed form. */
  .hazard-edge{
    height:5px;
    background:repeating-linear-gradient(45deg,
      var(--hazard) 0 9px, var(--dark) 9px 18px);
  }

  /* License plate, drawn to look like a real Thai plate: number on top, province on a
     smaller second line, black bezel with a hairline inset. This is how staff and
     customers actually identify a car, so it earns the visual weight. */
  .plate-tag{
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; border:2px solid #16191d; border-radius:7px;
    box-shadow:inset 0 0 0 1px #fff, inset 0 0 0 2.5px #cfd3d8;
    padding:4px 12px 3px; line-height:1.08; white-space:nowrap; min-width:104px;
  }
  .plate-tag .pt-no{
    font-family:var(--font-mono); font-weight:800; font-size:18px; letter-spacing:1.5px;
    color:#16191d;
  }
  .plate-tag .pt-prov{
    font-size:9.5px; font-weight:600; color:#4a525c; margin-top:2px; letter-spacing:.4px;
  }
  .plate-tag.lg{padding:6px 16px 4px; min-width:132px;}
  .plate-tag.lg .pt-no{font-size:24px; letter-spacing:2px;}
  .plate-tag.lg .pt-prov{font-size:11px;}
  .plate-tag.sm{padding:3px 9px 2px; min-width:88px; border-width:1.5px;}
  .plate-tag.sm .pt-no{font-size:14px; letter-spacing:1px;}
  .plate-tag.sm .pt-prov{font-size:8.5px;}
  /* Tabular figures for anything that should line up in a column */
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  /* The plate entry field mirrors the plate it produces */
  .plate-input{
    font-family:var(--font-mono); font-size:19px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase; text-align:center; border-width:2.5px; border-color:var(--dark);
  }

  .app-bar{
    background:var(--dark); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    border-bottom:none; position:sticky; top:0; z-index:20;
  }
  .app-bar .left-group{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .app-bar .brand-block{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .app-bar .brand{font-weight:700; font-size:19px; letter-spacing:0.5px;}
  .app-bar .brand::first-letter{color:var(--red);}
  .app-bar .brand-mark{color:var(--hazard); display:inline-flex; align-self:center;}
  .app-bar .sub{color:#9aa3ad; font-size:12.5px;}
  .app-bar .ver{
    color:#9aa3ad; font-size:11px; font-weight:700; background:rgba(255,255,255,0.10);
    border-radius:999px; padding:2px 8px; white-space:nowrap;
  }
  .topnav{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .topnav-btn{
    border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#dfe3e7;
    padding:8px 16px; border-radius:999px; font-size:13.5px; cursor:pointer; font-family:inherit;
    font-weight:600; transition:background .15s,color .15s,border-color .15s;
    display:inline-flex; align-items:center;
  }
  .topnav-btn:hover:not(.active){background:rgba(255,255,255,0.14); color:#fff;}
  .topnav-btn.active{background:var(--red); color:#fff; border-color:var(--red);}
  .topnav-divider{width:1px; align-self:stretch; background:rgba(255,255,255,0.18); margin:0 2px;}
  .backup-btn{background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.18); font-weight:600;}
  .backup-btn:hover{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===== Login / auth screens ===== */
  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--dark);
  }
  .auth-box{background:#fff; border-radius:16px; padding:28px 24px; width:100%; max-width:390px;}
  .auth-brand{
    font-weight:800; font-size:23px; letter-spacing:.5px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .auth-brand .ic{color:var(--hazard); margin:0;}
  .auth-sub{color:var(--text-2); font-size:13px; text-align:center; margin:5px 0 22px;}
  .auth-box .field{margin-bottom:13px;}
  .auth-box input{font-size:16px; padding:13px 14px;}
  .auth-err{
    background:var(--red-bg); color:var(--red); border-radius:8px; padding:11px 13px;
    font-size:13.5px; margin-bottom:13px;
  }
  .auth-note{color:var(--text-2); font-size:12px; text-align:center; margin-top:16px; line-height:1.6;}
  .auth-status{color:#9aa3ad; text-align:center; font-size:14px;}

  /* Signed-in user chip in the app bar */
  .user-chip{
    display:flex; align-items:center; gap:8px; color:#dfe3e7; font-size:12.5px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
    border-radius:999px; padding:6px 8px 6px 12px;
  }
  .user-chip .u-name{font-weight:700; white-space:nowrap;}
  .user-chip .u-role{
    font-size:10.5px; background:rgba(255,255,255,0.14); border-radius:999px;
    padding:2px 8px; white-space:nowrap;
  }
  .user-chip{cursor:pointer; font-family:inherit;}
  .user-chip .u-caret{display:inline-flex; color:#9aa3ad; transition:transform .15s;}
  .user-chip .u-caret.open{transform:rotate(180deg);}
  .user-wrap{position:relative; display:inline-block;}
  .user-menu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:40; min-width:230px;
    background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
  }
  .um-head{padding:11px 14px; border-bottom:1px solid var(--border); background:var(--surface);}
  .um-name{font-weight:700; font-size:14px; color:var(--text);}
  .um-mail{font-size:11.5px; color:var(--text-2); margin-top:1px; word-break:break-all;}
  .um-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:#fff; border:none; border-bottom:1px solid var(--border);
    padding:12px 14px; font-family:inherit; font-size:14px; color:var(--text); cursor:pointer;
  }
  .um-item:last-child{border-bottom:none;}
  .um-item:hover{background:var(--surface);}
  .um-item.danger{color:var(--red);}
  .um-count{
    margin-left:auto; background:var(--red); color:#fff; font-size:11px; font-weight:700;
    min-width:19px; height:19px; border-radius:10px; padding:0 6px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .um-count.ok{background:#1c7a34;}

  /* Landing page (?home) */
  .home-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--dark);}
  .home-box{background:#fff; border-radius:16px; width:100%; max-width:430px; overflow:hidden;}
  .home-pad{padding:26px 24px;}
  .home-brand{font-size:23px; font-weight:800; letter-spacing:.5px;}
  .home-brand span{color:var(--red);}
  .home-sub{color:var(--text-2); font-size:13px; margin:4px 0 20px;}
  a.home-btn{
    display:block; text-decoration:none; text-align:center; padding:16px; border-radius:10px;
    font-size:16.5px; font-weight:700; border:1px solid var(--border);
    color:var(--text); background:#fff; margin-bottom:10px;
  }
  a.home-btn.primary{background:var(--dark); color:#fff; border-color:var(--dark);}
  .home-note{
    margin-top:18px; padding-top:15px; border-top:1px solid var(--border);
    color:var(--text-2); font-size:12.5px; line-height:1.8;
  }

  /* Live sync indicator */
  .sync-dot{
    width:8px; height:8px; border-radius:50%; background:#1f9d55; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(31,157,85,.22);
  }
  .sync-dot.offline{background:#e8a33d; box-shadow:0 0 0 3px rgba(232,163,61,.22);}

  /* ===== Public customer board (?board) =====
     Read at arm's length on a phone, or across the room on a wall screen — so the
     queue number is the largest thing on every row and status is a solid colour
     block rather than a subtle tint. */
  .board-wrap{max-width:900px; margin:0 auto; padding:0 0 40px;}
  .board-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:18px 18px 14px; flex-wrap:wrap;
  }
  .board-title{font-size:24px; font-weight:800; letter-spacing:.5px;}
  .board-sub{color:var(--text-2); font-size:14px; margin-top:2px;}
  .board-clock{font-size:26px; font-weight:800; color:var(--text-2);}
  .board-back{padding:0 18px 12px;}
  /* Workshop floor on the customer board */
  .board-bays{margin:0 14px 16px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px;}
  .bb-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .bb-title{font-weight:800; font-size:15px; letter-spacing:.4px;}
  .bb-count{font-size:13px; font-weight:700; background:var(--dark); color:#fff; border-radius:999px; padding:2px 10px;}
  .board-bays .bay-grid{margin-top:0;}

  /* Day separator on the customer board */
  .board-day{
    display:flex; align-items:baseline; gap:10px;
    margin:18px 14px 8px; padding-bottom:6px; border-bottom:2px solid var(--surface-2);
  }
  .bd-label{font-size:16px; font-weight:800; letter-spacing:.3px;}
  .bd-count{font-size:12.5px; color:var(--text-2);}

  .board-grid{display:flex; flex-direction:column; gap:9px; padding:0 14px;}
  .board-card{
    display:flex; align-items:center; gap:14px; background:#fff; flex-wrap:wrap;
    border:1px solid var(--border); border-left:7px solid var(--border);
    border-radius:10px; padding:13px 15px;
  }
  .board-card.st-received   {border-left-color:#d92d20;}
  .board-card.st-inspecting {border-left-color:#f27a1a;}
  .board-card.st-quoted     {border-left-color:#f5c400;}
  .board-card.st-approved   {border-left-color:#7b4fd4;}
  .board-card.st-scheduled  {border-left-color:#ffb4ac;}
  .board-card.st-rejected   {border-left-color:#8a939e;}
  .board-card.st-repairing  {border-left-color:#7cc7f2;}
  .board-card.st-aligning   {border-left-color:#1668a8;}
  .board-card.st-ready      {border-left-color:#8fd694;}
  .board-card.st-delivered  {border-left-color:#1c7a34; opacity:.55;}
  .board-card.st-carout     {border-left-color:#3d444d; opacity:.55;}
  /* Queue is what the customer was actually given at drop-off, so it's the anchor:
     a stamped ticket block rather than a loose number. */
  .bc-queue{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:76px; padding:8px 6px; background:var(--dark); border-radius:9px; color:#fff;
  }
  .bc-q-label{font-size:10.5px; font-weight:700; letter-spacing:2px; color:var(--hazard);}
  .bc-q-no{font-size:32px; font-weight:800; line-height:1.05;}
  .bc-photo{
    width:74px; height:74px; border-radius:9px; object-fit:cover; flex-shrink:0;
    border:1px solid var(--border); background:var(--surface-2);
  }
  .bc-photo-empty{display:flex; align-items:center; justify-content:center; color:var(--text-2); opacity:.45;}
  .bc-mid{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:5px;}
  .bc-car{font-size:17.5px; font-weight:700; line-height:1.25;}
  .bc-color{color:var(--text-2); font-size:13.5px; margin-top:-2px;}
  .bc-status{
    flex-shrink:0; font-size:14px; font-weight:700; padding:8px 15px; border-radius:999px;
    white-space:nowrap;
  }
  .bc-status.st-received   {background:#d92d20; color:#fff;}
  .bc-status.st-inspecting {background:#f27a1a; color:#fff;}
  .bc-status.st-quoted     {background:#f5c400; color:#3d3000;}
  .bc-status.st-approved   {background:#7b4fd4; color:#fff;}
  .bc-status.st-scheduled  {background:#ffb4ac; color:#7a1c12;}
  .bc-status.st-rejected   {background:#8a939e; color:#fff;}
  .bc-status.st-repairing  {background:#7cc7f2; color:#0b3a52;}
  .bc-status.st-aligning   {background:#1668a8; color:#fff;}
  .bc-status.st-ready      {background:#8fd694; color:#12401a;}
  .bc-status.st-delivered  {background:#1c7a34; color:#fff;}
  .bc-status.st-carout     {background:#3d444d; color:#fff;}
  .board-legend{
    display:flex; flex-wrap:wrap; gap:10px 16px; padding:20px 18px 0;
    color:var(--text-2); font-size:12.5px;
  }
  .bl-item{display:flex; align-items:center; gap:6px;}
  .board-empty{
    margin:14px; padding:44px 18px; text-align:center; color:var(--text-2);
    border:1px dashed var(--border); border-radius:10px; font-size:15px;
  }
  .board-foot{
    padding:22px 18px 0; color:var(--text-2); font-size:12.5px; line-height:1.8; text-align:center;
  }
  @media (max-width:600px){
    .board-title{font-size:20px;}
    .board-clock{font-size:21px;}
    .bc-queue{min-width:58px; padding:6px 4px;}
    .bc-q-no{font-size:25px;}
    .bc-q-label{font-size:9px; letter-spacing:1.5px;}
    .bc-photo{width:58px; height:58px;}
    .bc-car{font-size:15.5px;}
    .bc-color{font-size:12.5px;}
    .bc-status{font-size:12px; padding:6px 10px;}
    .board-card{gap:9px; padding:11px 11px;}
    .plate-tag.sm{min-width:78px; padding:2px 7px 1px;}
    .plate-tag.sm .pt-no{font-size:12.5px;}
  }

  /* Bottom tab bar — mobile only (see the max-width:820px block) */
  .bottom-nav{display:none;}

  /* In-app confirm/prompt dialogs (native confirm()/prompt() are blocked on mobile) */
  .ui-modal-overlay{
    position:fixed; inset:0; z-index:120; background:rgba(15,20,25,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .ui-modal{
    background:#fff; border-radius:14px; padding:20px; width:100%; max-width:420px;
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
  }
  .ui-modal-msg{font-size:15.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:16px;}
  .ui-modal-input{width:100%; margin-bottom:16px; font-size:16px;}
  .ui-modal-btns{display:flex; gap:10px;}
  .ui-modal-btns .btn{flex:1 1 0; justify-content:center; padding:12px 16px;}
  .btn.danger-solid{background:var(--red); border-color:var(--red); color:#fff;}

  .shell{max-width:1040px; margin:0 auto; padding:18px 14px 70px;}

  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  /* Section headings read like workshop signage: slightly tighter, letter-spaced,
     with a short steel rule under them. */
  .card h3{
    margin:0 0 12px; font-size:15px; font-weight:700; letter-spacing:.4px;
    display:flex; align-items:center; padding-bottom:8px;
    border-bottom:2px solid var(--surface-2);
  }
  .muted{color:var(--text-2); font-size:13px;}

  .btn{
    border:1px solid var(--dark); background:var(--dark); color:#fff; padding:10px 16px;
    border-radius:8px; font-size:14.5px; cursor:pointer; font-family:inherit; font-weight:600;
    display:inline-flex; align-items:center;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:#fff; color:var(--text); border-color:var(--border);}
  .btn.danger{background:#fff; color:var(--red); border-color:var(--red-bg);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.block{width:100%; justify-content:center;}
  .btn.big{padding:15px 18px; font-size:16.5px; border-radius:10px;}
  .btn.small{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  /* Safety-yellow = "the next thing to do". Used for advance-status actions only. */
  .btn.hazard{background:var(--hazard); border-color:var(--hazard); color:var(--hazard-dark);}
  .btn.hazard:hover{opacity:.9;}

  input[type=text],input[type=number],input[type=tel],input[type=password],textarea,select{
    font-family:inherit; border:1px solid var(--border); border-radius:8px; padding:11px 12px;
    font-size:15px; color:var(--text); background:#fff; width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--navy); outline-offset:1px;}
  label{font-size:12.5px; color:var(--text-2); display:block; margin-bottom:5px; font-weight:600;}
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .row-flex{display:flex; gap:10px; flex-wrap:wrap; align-items:end;}
  @media (max-width:520px){ .row2,.row3{grid-template-columns:1fr 1fr;} }

  /* Search inputs with an SVG icon inside */
  .search-wrap{position:relative;}
  .search-wrap .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-2); pointer-events:none; margin:0;}
  .search-wrap input{padding-left:38px; width:100%;}

  /* Search + filters (job list) */
  .search-bar{margin-bottom:12px;}
  .search-bar input{font-size:16px; padding:13px 14px 13px 40px;}
  .status-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .status-pill{
    border:1px solid var(--border); background:#fff; color:var(--text-2); padding:7px 13px;
    border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .status-pill .n{background:var(--surface-2); border-radius:999px; padding:1px 7px; font-size:11.5px;}
  .status-pill.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .status-pill.active .n{background:rgba(255,255,255,0.2); color:#fff;}
  /* Colour swatch inside each filter pill, matching the status palette */
  .status-pill .sw{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .sw.st-received   {background:#d92d20;}
  .sw.st-inspecting {background:#f27a1a;}
  .sw.st-quoted     {background:#f5c400;}
  .sw.st-approved   {background:#7b4fd4;}
  .sw.st-scheduled  {background:#ffb4ac;}
  .sw.st-rejected   {background:#8a939e;}
  .sw.st-repairing  {background:#7cc7f2;}
  .sw.st-aligning   {background:#1668a8;}
  .sw.st-ready      {background:#8fd694;}
  .sw.st-delivered  {background:#1c7a34;}
  .sw.st-carout     {background:#3d444d;}

  /* Two-up on desktop so a 20-30 car day can be taken in at a glance.
     Collapses to one column on phones (see the responsive tiers). */
  /* Column count is set inline per render (see setJobCols / jobColsMax) */
  .job-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start;}

  /* Page header — round back button, title with a line of context, actions on the right.
     Replaces the cramped "‹ กลับ  รับรถ" run-on. */
  .page-head{
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .ph-back{
    width:44px; height:44px; flex-shrink:0; border-radius:12px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .ph-back:hover{background:var(--surface); border-color:var(--navy);}
  .ph-back:active{transform:scale(.94);}
  .ph-back .ic{margin:0;}
  .ph-text{flex:1; min-width:0;}
  .ph-title{font-size:22px; font-weight:800; letter-spacing:.3px; line-height:1.2;}
  .ph-sub{font-size:12.5px; color:var(--text-2); margin-top:2px;}
  .page-head .btn{flex-shrink:0;}
  @media (max-width:700px){
    .ph-title{font-size:19px;}
    .ph-back{width:40px; height:40px;}
  }

  .draft-note{
    display:flex; align-items:center; gap:8px;
    background:#fffdf2; border:1px solid var(--hazard); border-radius:9px;
    padding:10px 13px; margin-bottom:12px; font-size:12.5px; color:var(--hazard-dark);
  }

  /* Floating add button (job list) */
  .fab{
    position:fixed; right:22px; bottom:22px; z-index:25;
    width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
    background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(240,84,84,.45);
  }
  .fab:hover{filter:brightness(1.06);}
  .fab:active{transform:scale(.94);}
  .fab .ic{margin:0;}

  /* Queue progress strip */
  .queue-bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--dark); color:#fff; border-radius:var(--radius);
    padding:11px 15px; margin-bottom:12px;
  }
  .qb-item{display:flex; align-items:baseline; gap:7px;}
  .qb-label{font-size:12.5px; color:#9aa3ad; white-space:nowrap;}
  .qb-no{font-size:24px; font-weight:800; line-height:1;}
  .qb-sep{width:1px; align-self:stretch; background:rgba(255,255,255,.18);}
  .qb-right{margin-left:auto; gap:10px;}
  .qb-link{
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:20px;
    padding:5px 11px; font-family:inherit; font-size:12px; font-weight:600;
  }
  .qb-link:hover{background:rgba(255,255,255,.22);}

  /* Column-count switcher */
  .cols-bar{display:flex; align-items:center; gap:6px; margin-bottom:10px; justify-content:flex-end;}
  .cols-label{font-size:12.5px; color:var(--text-2);}
  .cols-btn{
    width:30px; height:30px; border:1px solid var(--border); background:#fff; color:var(--text-2);
    border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700;
  }
  .cols-btn.active{background:var(--dark); color:#fff; border-color:var(--dark);}

  /* Edit-history table */
  table.log-table td{vertical-align:top;}
  .log-act{
    display:inline-block; font-size:11.5px; font-weight:700; border-radius:5px;
    padding:2px 8px; background:var(--surface-2); color:var(--text-2); white-space:nowrap;
  }
  .log-act.del{background:var(--red-bg); color:var(--red);}

  /* Job cards — the coloured left edge mirrors the status badge so the whole list
     can be scanned at a glance without reading every badge. */
  .job-card{
    border:1px solid var(--border); border-left:5px solid var(--border); border-radius:var(--radius);
    background:#fff; overflow:hidden;
  }
  /* Identity block: photo on top, plate directly beneath at the SAME fixed width, so
     every card lines up in a column no matter how long the plate or model name is. */
  .jc-idblock{
    width:118px; flex-shrink:0; display:flex; flex-direction:column; gap:5px; align-items:stretch;
  }
  .jc-thumb{
    width:118px; height:86px; border-radius:8px; object-fit:cover;
    background:var(--surface-2); border:1px solid var(--border); display:block;
  }
  .jc-thumb-empty{
    display:flex; align-items:center; justify-content:center; color:var(--text-2); opacity:.45;
  }
  /* Plate sized to fill the id block exactly */
  .plate-tag.fit{width:118px; min-width:0; padding:3px 4px 2px; box-sizing:border-box;}
  .plate-tag.fit .pt-no{font-size:15px; letter-spacing:.8px;}
  .plate-tag.fit .pt-prov{font-size:8.5px;}
  .jc-tags{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .job-card .jc-left .meta.strong{color:var(--text); font-weight:700; font-size:14px;}

  /* The three answers to a quote get their own row, separated from the routine
     status/bay controls, and only ever appear while the job sits at เสนอราคา. */
  .jc-decide{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; border-top:1px dashed var(--border); background:#fffdf2;
  }
  .jd-label{font-size:12.5px; font-weight:700; color:var(--text-2); white-space:nowrap;}
  .jd-btns{display:flex; gap:7px; flex-wrap:wrap; flex:1;}
  .jd-btns .btn{flex:1 1 auto; justify-content:center;}

  /* The three answers to a quote */
  .btn.small.decide{border:none; font-weight:700;}
  .btn.decide.st-approved {background:#7b4fd4; color:#fff;}
  .btn.decide.st-scheduled{background:#ffb4ac; color:#7a1c12;}
  .btn.decide.st-rejected {background:#8a939e; color:#fff;}
  .job-card:hover{box-shadow:0 2px 8px rgba(34,40,49,.08);}
  .job-card.st-received   {border-left-color:#d92d20;}
  .job-card.st-inspecting {border-left-color:#f27a1a;}
  .job-card.st-quoted     {border-left-color:#f5c400;}
  .job-card.st-approved   {border-left-color:#7b4fd4;}
  .job-card.st-scheduled  {border-left-color:#ffb4ac;}
  .job-card.st-rejected   {border-left-color:#8a939e;}
  .job-card.st-repairing  {border-left-color:#7cc7f2;}
  .job-card.st-aligning   {border-left-color:#1668a8;}
  .job-card.st-ready      {border-left-color:#8fd694;}
  .job-card.st-delivered  {border-left-color:#1c7a34;}
  .job-card.st-carout     {border-left-color:#3d444d;}
  .job-card.st-delivered .jc-main,
  .job-card.st-carout .jc-main{opacity:.62;}
  .jc-main{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 14px; cursor:pointer;
  }
  .job-card .jc-left{min-width:0;}
  .job-card .jc-left .plate{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .jc-queue{
    background:var(--dark); color:#fff; font-size:11.5px; font-weight:700;
    padding:2px 9px; border-radius:999px;
  }
  .job-card .jc-left .meta{color:var(--text-2); font-size:12.5px; margin-top:3px;}
  .job-card .jc-left .jn{color:var(--text-2); font-size:11.5px; margin-top:3px;}
  .jc-actions{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 14px; border-top:1px solid var(--border); background:var(--surface);
  }
  /* Progress track. Eight plain dots read as noise, so each completed stage now shows
     its own status colour and the current one is taller with a ring — you can see both
     "how far along" and "which stage" without reading the badge. */
  .jc-steps{display:flex; gap:3px; margin-right:4px; align-items:center;}
  .jc-seg{width:13px; height:6px; border-radius:2px; background:var(--surface-2); flex-shrink:0;}
  .jc-seg.done.st-received   {background:#d92d20;}
  .jc-seg.done.st-inspecting {background:#f27a1a;}
  .jc-seg.done.st-quoted     {background:#f5c400;}
  .jc-seg.done.st-approved   {background:#7b4fd4;}
  .jc-seg.done.st-scheduled  {background:#ffb4ac;}
  .jc-seg.done.st-rejected   {background:#8a939e;}
  .jc-seg.done.st-repairing  {background:#7cc7f2;}
  .jc-seg.done.st-aligning   {background:#1668a8;}
  .jc-seg.done.st-ready      {background:#8fd694;}
  .jc-seg.done.st-delivered  {background:#1c7a34;}
  .jc-seg.done.st-carout     {background:#3d444d;}
  .jc-seg.now{height:11px; border-radius:3px; box-shadow:0 0 0 2px rgba(34,40,49,.18);}

  /* ===== Work bays ===== */
  .bay-chip{
    background:var(--navy); color:#fff; font-size:11.5px; font-weight:700;
    padding:2px 9px; border-radius:6px; white-space:nowrap;
  }
  .bay-chip.align{background:var(--hazard); color:var(--hazard-dark);}

  .bay-card{padding:14px;}
  .bay-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:8px; margin-top:12px;
  }
  .bay-cell{
    border:1px solid var(--border); border-radius:9px; padding:9px 8px;
    background:var(--surface); text-align:center; min-height:74px;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
  }
  .bay-cell.busy{background:#fff; cursor:pointer; border-left:4px solid var(--border);}
  .bay-cell.busy:hover{box-shadow:0 2px 8px rgba(34,40,49,.10);}
  .bay-cell.busy.st-received   {border-left-color:#d92d20;}
  .bay-cell.busy.st-inspecting {border-left-color:#f27a1a;}
  .bay-cell.busy.st-quoted     {border-left-color:#f5c400;}
  .bay-cell.busy.st-approved   {border-left-color:#7b4fd4;}
  .bay-cell.busy.st-scheduled  {border-left-color:#ffb4ac;}
  .bay-cell.busy.st-rejected   {border-left-color:#8a939e;}
  .bay-cell.busy.st-repairing  {border-left-color:#7cc7f2;}
  .bay-cell.busy.st-aligning   {border-left-color:#1668a8;}
  .bay-cell.busy.st-ready      {border-left-color:#8fd694;}
  .bay-cell.busy.st-delivered  {border-left-color:#1c7a34;}
  .bay-cell.busy.st-carout     {border-left-color:#3d444d;}
  .bay-cell.align .bay-name{color:var(--hazard-dark); background:var(--hazard); border-radius:5px; padding:1px 6px; display:inline-block;}
  .bay-name{font-weight:800; font-size:14px; letter-spacing:.5px;}
  .bay-free{font-size:12px; color:var(--text-2); opacity:.7;}
  .bay-plate{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis;}
  .bay-st{font-size:10.5px; color:var(--text-2);}

  /* Bay label on the customer board */
  .bc-endcol{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
  .bc-bay{
    font-size:12px; font-weight:700; color:var(--text-2);
    background:var(--surface-2); border-radius:6px; padding:3px 9px; white-space:nowrap;
  }
  /* Live countdown on the customer board */
  .bc-eta{
    flex:0 0 196px; align-self:stretch; display:flex; flex-direction:column; justify-content:center;
    border-left:1px dashed var(--border); padding-left:14px; margin-left:2px;
  }
  .be-row{display:flex; align-items:center; gap:5px;}
  .be-ico{display:inline-flex; color:var(--text-2);}
  /* tabular-nums stops the text jumping sideways as the seconds roll over */
  .be-text{font-size:14.5px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .be-sub{font-size:11.5px; color:var(--text-2); margin-top:2px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .be-bar{height:5px; border-radius:3px; background:var(--surface-2); margin-top:7px; overflow:hidden;}
  .be-bar > span{display:block; height:100%; border-radius:3px; transition:width 1s linear;}
  .bc-eta.pending .be-text{color:var(--text-2);}
  .bc-eta.pending .be-bar{display:none;}
  .bc-eta.running .be-text{color:#1c7a34;}
  .bc-eta.running .be-ico{color:#1c7a34;}
  .bc-eta.running .be-bar > span{background:#2fa04d;}
  .bc-eta.late .be-text{color:var(--red);}
  .bc-eta.late .be-ico{color:var(--red);}
  .bc-eta.late .be-bar > span{background:var(--red);}
  .bc-eta.done .be-text{color:#1c7a34;}
  .bc-eta.done .be-ico{color:#1c7a34;}
  .bc-eta.done .be-bar > span{background:#8fd694;}
  @media (max-width:760px){
    .bc-eta{
      flex:1 1 100%; border-left:none; padding-left:0; margin-left:0;
      border-top:1px dashed var(--border); margin-top:9px; padding-top:8px;
    }
    .be-row, .be-sub{justify-content:flex-start;}
  }

  /* Day navigator (job list) */
  .day-bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 10px; margin-bottom:12px;
  }
  .day-arrow{
    width:38px; height:38px; flex-shrink:0; border:1px solid var(--border); background:#fff;
    border-radius:9px; cursor:pointer; color:var(--text); display:inline-flex;
    align-items:center; justify-content:center;
  }
  .day-arrow:hover:not(:disabled){background:var(--surface); border-color:var(--navy);}
  .day-arrow:disabled{opacity:.35; cursor:not-allowed;}
  .day-now{min-width:120px; text-align:center;}
  .day-label{font-size:16px; font-weight:700; line-height:1.2;}
  .day-count{font-size:12px; color:var(--text-2); margin-top:1px;}
  .day-quick{display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .day-chip{
    border:1px solid var(--border); background:#fff; color:var(--text-2);
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .day-chip.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  /* Calendar button. The native date input's DD/MM vs MM/DD display follows the
     BROWSER's locale and cannot be set from the page, so its text is hidden entirely —
     the input is stretched invisibly over the icon purely to open the native picker
     (more reliable across browsers than calling showPicker()). The readable date is
     the Thai label in .day-label. */
  .day-pick{
    position:relative; overflow:hidden;
    width:38px; height:38px; flex-shrink:0; border:1px solid var(--border); background:#fff;
    border-radius:9px; cursor:pointer; color:var(--text); display:inline-flex;
    align-items:center; justify-content:center;
  }
  .day-pick:hover{background:var(--surface); border-color:var(--navy);}
  .day-pick input{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; cursor:pointer; padding:0; border:none; background:none;
  }
  .day-pick input::-webkit-calendar-picker-indicator{
    position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; cursor:pointer;
  }

  /* Collapsible card section (optional parts at check-in) */
  .collapse-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:700; letter-spacing:.4px; color:var(--text);
  }
  .collapse-head .ch-right{display:flex; align-items:center; gap:8px;}
  .collapse-head .ch-count{
    background:var(--dark); color:#fff; font-size:11.5px; font-weight:700;
    border-radius:999px; padding:2px 9px;
  }
  .collapse-head .ch-caret{display:inline-flex; color:var(--text-2); transition:transform .15s;}
  .collapse-head .ch-caret.open{transform:rotate(180deg);}

  /* Sticky check-in action bar */
  .ci-submit-bar{
    position:sticky; bottom:0; z-index:15;
    display:flex; align-items:center; gap:12px;
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 12px; margin-top:14px;
    box-shadow:0 -2px 14px rgba(34,40,49,.10);
  }
  .ci-sum{
    flex:1; min-width:0; font-weight:700; font-size:14px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ci-submit-bar .btn{flex-shrink:0;}
  .jc-del{
    background:none; border:none; color:var(--text-2); cursor:pointer; padding:8px;
    border-radius:8px; display:inline-flex; align-items:center; line-height:0; margin-left:auto;
  }
  .jc-del:hover{color:var(--red); background:var(--red-bg);}

  /* uiChoice picker rows */
  .ui-modal-title{font-size:18px; font-weight:800; letter-spacing:.3px; margin-bottom:16px;}
  .ui-choice-list{display:flex; flex-direction:column; gap:9px; margin-bottom:6px;}
  .ui-choice{
    display:flex; align-items:center; gap:12px; width:100%;
    border:1.5px solid var(--border); background:#fff; border-radius:12px; padding:14px 15px;
    font-family:inherit; color:var(--text); cursor:pointer; text-align:left;
    transition:border-color .12s, background .12s, transform .08s;
  }
  .ui-choice:hover{border-color:var(--navy); background:var(--surface);}
  .ui-choice:active{transform:scale(.985);}
  .ui-choice.current{border-color:var(--dark); background:var(--surface-2);}
  .ui-choice .uc-ico{
    flex-shrink:0; width:40px; height:40px; border-radius:10px; display:flex;
    align-items:center; justify-content:center; background:var(--surface-2); color:var(--dark);
  }
  .ui-choice .uc-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .ui-choice .uc-label{font-size:15.5px; font-weight:700; line-height:1.35;}
  .ui-choice .uc-sub{font-size:12.5px; color:var(--text-2); line-height:1.5;}
  .ui-choice .uc-go{color:var(--border); display:flex; flex-shrink:0;}
  .ui-choice:hover .uc-go{color:var(--navy);}
  /* Destructive option reads red without shouting */
  .ui-choice.danger{border-color:#f3c9c9;}
  .ui-choice.danger .uc-ico{background:var(--red-bg); color:var(--red);}
  .ui-choice.danger .uc-label{color:var(--red);}
  .ui-choice.danger:hover{border-color:var(--red); background:var(--red-bg);}
  .ui-choice.danger:hover .uc-go{color:var(--red);}
  .ui-choice-now{font-size:11.5px; font-weight:700; color:var(--text-2); white-space:nowrap;}
  /* Cancel is a quiet text button — it shouldn't compete with the real choices */
  .ui-cancel{
    display:block; width:100%; background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:14.5px; font-weight:600; color:var(--text-2);
    padding:14px 0 4px;
  }
  .ui-cancel:hover{color:var(--text);}

  /* Searchable picker */
  .ui-pick-list{max-height:46vh; overflow-y:auto; margin-bottom:14px; border:1px solid var(--border); border-radius:9px;}
  .ui-pick-row{
    display:block; width:100%; text-align:left; background:#fff; border:none;
    border-bottom:1px solid var(--border); padding:11px 13px; cursor:pointer; font-family:inherit;
  }
  .ui-pick-row:last-child{border-bottom:none;}
  .ui-pick-row:hover{background:var(--surface);}
  .ui-pick-row.current{background:var(--surface-2);}
  .ui-pick-row .up-sub{display:block; font-size:11px; font-weight:700; color:var(--text-2); letter-spacing:.4px;}
  .ui-pick-row .up-main{display:block; font-size:15px; font-weight:600; margin-top:1px;}
  .ui-pick-empty{padding:16px; text-align:center; color:var(--text-2); font-size:13.5px;}

  /* The button that opens it */
  .model-pick-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    border:1px solid var(--border); background:#fff; border-radius:8px; padding:12px 13px;
    font-family:inherit; font-size:15px; color:var(--text-2); cursor:pointer; text-align:left;
  }
  .model-pick-btn.picked{color:var(--text); font-weight:700; border-color:var(--navy);}
  .model-pick-btn .mp-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .model-pick-btn .mp-icon{color:var(--text-2); display:inline-flex; flex-shrink:0;}
  .badge{padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;}
  /* Status palette — one source of truth, used by the badge, the job-card left edge
     and the status filter pills so a colour always means the same stage. */
  .badge.st-received   {background:#d92d20; color:#fff;}
  .badge.st-inspecting {background:#f27a1a; color:#fff;}
  .badge.st-quoted     {background:#f5c400; color:#3d3000;}
  .badge.st-approved   {background:#7b4fd4; color:#fff;}
  .badge.st-scheduled  {background:#ffb4ac; color:#7a1c12;}
  .badge.st-rejected   {background:#8a939e; color:#fff;}
  .badge.st-repairing  {background:#7cc7f2; color:#0b3a52;}
  .badge.st-aligning   {background:#1668a8; color:#fff;}
  .badge.st-ready      {background:#8fd694; color:#12401a;}
  .badge.st-delivered  {background:#1c7a34; color:#fff;}
  .badge.st-carout     {background:#3d444d; color:#fff;}

  .empty-state{color:var(--text-2); font-size:14px; padding:30px 10px; text-align:center; border:1px dashed var(--border); border-radius:8px;}

  /* ---------- Estimated repair time: วัน : ชั่วโมง : นาที ---------- */
  .dhm{display:flex; align-items:flex-end; gap:8px; flex-wrap:wrap;}
  .dhm-box{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    border:1.5px solid var(--border); border-radius:11px; padding:6px 4px 7px; min-width:74px;
    background:#fff;
  }
  .dhm-btn{
    width:100%; border:none; background:transparent; cursor:pointer; color:var(--text-2);
    font-family:inherit; font-size:17px; font-weight:800; line-height:1; padding:4px 0;
    border-radius:6px;
  }
  .dhm-btn:hover:not(:disabled){background:var(--surface-2); color:var(--text);}
  .dhm-btn:disabled{opacity:.25; cursor:default;}
  .dhm-n{
    font-size:26px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums;
    min-width:44px; text-align:center;
  }
  .dhm-u{font-size:11px; color:var(--text-2); font-weight:600; margin-top:1px;}
  .dhm-sep{font-size:22px; font-weight:800; color:var(--text-2); padding-bottom:26px;}
  .dhm-custom{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; margin-left:6px;
    border:1.5px dashed var(--border); background:#fff; color:var(--text-2);
    font-family:inherit; font-size:13px; font-weight:600; border-radius:11px; padding:11px 15px;
  }
  .dhm-custom:hover{border-color:var(--dark); color:var(--text);}
  .dhm-dialog{
    display:flex; align-items:flex-end; justify-content:center; gap:8px; margin-top:14px;
  }
  .dhm-dialog label{display:flex; flex-direction:column; gap:4px; align-items:center;}
  .dhm-dialog label span{font-size:11.5px; color:var(--text-2); font-weight:600;}
  .dhm-dialog select{
    font-family:inherit; font-size:19px; font-weight:800; text-align:center;
    padding:9px 6px; border-radius:9px; border:1.5px solid var(--border); background:#fff;
    min-width:74px;
  }
  .dhm-dialog .dhm-sep{padding-bottom:9px;}
  .dhm-preview{text-align:center; margin-top:12px; font-size:14px; font-weight:700;}
  @media (max-width:420px){
    .dhm-box{min-width:62px;}
    .dhm-n{font-size:22px; min-width:36px;}
    .dhm-custom{width:100%; justify-content:center; margin-left:0;}
  }
  .est-summary{margin-top:11px; font-size:13.5px; color:var(--text-2); display:flex; align-items:center; gap:10px;}
  .est-summary b{color:var(--text); font-size:15px;}
  .est-clear{
    border:none; background:transparent; color:var(--red); font-family:inherit;
    font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0;
  }
  .est-live{
    margin-top:12px; padding:11px 14px; border-radius:10px; background:var(--surface-2);
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .est-live b{font-size:17px; font-variant-numeric:tabular-nums;}
  .est-live .be-sub{font-size:12.5px; color:var(--text-2);}
  .est-live.pending{font-size:12.5px; color:var(--text-2); display:block;}
  .est-live.running{background:#e3f5e7;} .est-live.running b{color:#1c7a34;}
  .est-live.done{background:#e3f5e7;}    .est-live.done b{color:#1c7a34;}
  .est-live.late{background:var(--red-bg);} .est-live.late b{color:var(--red);}
  .est-restart{
    margin-left:auto; display:inline-flex; align-items:center; gap:4px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--text-2);
    font-family:inherit; font-size:12px; font-weight:600; border-radius:20px; padding:5px 11px;
  }
  .est-restart:hover{border-color:var(--dark); color:var(--text);}

  .est-chip-inline{
    display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700;
    background:#eef2f7; color:#30475E; border-radius:20px; padding:2px 9px; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .est-chip-inline.running{background:#e3f5e7; color:#1c7a34;}
  .est-chip-inline.done{background:#e3f5e7; color:#1c7a34;}
  .est-chip-inline.late{background:var(--red-bg); color:var(--red);}

  /* ---------- Delivered archive ---------- */
  .dv-hero{
    display:flex; align-items:center; gap:16px; padding:16px 18px; margin-bottom:14px;
    border-radius:14px; color:#fff;
    background:linear-gradient(135deg,#1c7a34,#2fa04d);
    box-shadow:0 6px 18px rgba(28,122,52,.25);
  }
  .dv-hero-mark{
    width:56px; height:56px; flex:0 0 56px; border-radius:50%;
    background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center;
  }
  .dv-hero-text{flex:1 1 auto; min-width:0;}
  .dv-hero-big{font-size:34px; font-weight:800; line-height:1;}
  .dv-hero-label{font-size:13px; opacity:.9; margin-top:3px;}
  .dv-hero-stats{display:flex; gap:10px; flex:0 0 auto;}
  .dv-stat{
    background:rgba(255,255,255,.16); border-radius:10px; padding:8px 13px;
    text-align:center; min-width:62px;
  }
  .dv-stat .n{display:block; font-size:20px; font-weight:800; line-height:1.1;}
  .dv-stat .l{display:block; font-size:11px; opacity:.9; margin-top:2px;}
  .dv-found{font-size:12.5px; color:var(--text-2); margin:2px 2px 8px;}
  .dv-daybar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; font-weight:700; color:var(--text-2);
    padding:9px 4px 5px; margin-top:6px; border-bottom:1px solid var(--border);
  }
  .dv-daynum{font-weight:600; opacity:.8;}
  .dv-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px; margin-top:8px;
    background:#fff; border:1px solid var(--border); border-left:4px solid #2fa04d;
    border-radius:10px; cursor:pointer; transition:box-shadow .15s, transform .1s;
  }
  .dv-row:hover{box-shadow:0 3px 12px rgba(0,0,0,.08);}
  .dv-row:active{transform:scale(.995);}
  .dv-thumb{
    width:62px; height:48px; flex:0 0 62px; border-radius:8px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-2);
  }
  .dv-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .dv-info{flex:1 1 auto; min-width:0;}
  .dv-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .dv-plate{font-size:15.5px; font-weight:800; letter-spacing:.5px;}
  .dv-ok{
    display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700;
    background:#e3f5e7; color:#1c7a34; border-radius:20px; padding:2px 9px;
  }
  .dv-model{font-size:13px; font-weight:600; margin-top:2px;}
  .dv-cust{font-size:12.5px; color:var(--text-2);}
  .dv-meta{font-size:11px; color:var(--text-2); margin-top:2px;}
  .dv-amt{flex:0 0 auto; text-align:right; padding-left:6px;}
  .dv-total{font-size:17px; font-weight:800; color:#1c7a34; line-height:1.1;}
  .dv-baht{font-size:10.5px; color:var(--text-2);}
  .dv-nototal{font-size:16px; color:var(--text-2);}
  .dv-acts{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}
  .dv-acts .btn{white-space:nowrap;}
  @media (max-width:640px){
    .dv-hero{flex-wrap:wrap; gap:12px;}
    .dv-hero-stats{width:100%;}
    .dv-stat{flex:1 1 0;}
    .dv-row{flex-wrap:wrap;}
    .dv-amt{text-align:right;}
    .dv-acts{flex-direction:row; width:100%; margin-top:2px;}
    .dv-acts .btn{flex:1 1 0;}
  }

  /* Recycle bin (Settings) — card rows so it stays readable on a phone */
  .trash-list{display:flex; flex-direction:column; gap:9px;}
  .trash-row{
    display:flex; align-items:center; gap:11px; padding:9px 11px;
    border:1px solid var(--border); border-radius:10px; background:var(--surface-2);
  }
  .trash-thumb{
    width:54px; height:42px; flex:0 0 54px; border-radius:7px; overflow:hidden;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-2);
  }
  .trash-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .trash-info{flex:1 1 auto; min-width:0;}
  .trash-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .trash-plate{font-weight:800; font-size:15px; letter-spacing:.4px;}
  .trash-sub{font-size:12.5px; color:var(--text-2); margin-top:1px;}
  .trash-meta{font-size:11px; color:var(--text-2); margin-top:3px;}
  .trash-acts{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}
  .trash-acts .btn{white-space:nowrap;}
  @media (max-width:560px){
    .trash-row{flex-wrap:wrap;}
    .trash-acts{flex-direction:row; width:100%; margin-top:2px;}
    .trash-acts .btn{flex:1 1 0;}
  }

  /* Theme picker (Settings) */
  .theme-grid{display:flex; gap:12px; flex-wrap:wrap;}
  .theme-card{cursor:pointer; border:2px solid var(--border); border-radius:10px; padding:10px; width:120px; text-align:center; transition:border-color .15s;}
  .theme-card:hover{border-color:var(--text-2);}
  .theme-card.active{border-color:var(--navy);}
  .theme-swatches{display:flex; height:28px; border-radius:6px; overflow:hidden; margin-bottom:8px;}
  .theme-swatches span{flex:1; display:block;}
  .theme-name{font-size:12.5px; font-weight:600;}

  /* Check-in */
  .plate-suggest-wrap{position:relative;}
  .match-card{
    border:1px solid var(--navy); background:#eef2f5; border-radius:8px; padding:12px 14px; margin-top:8px;
  }
  .match-card .mc-title{font-weight:700; font-size:14.5px; color:var(--navy); display:flex; align-items:center;}
  .match-card .mc-row{font-size:13px; color:var(--text-2); margin-top:4px;}
  .checklist-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .chk-cat-label{font-weight:700; font-size:12.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:0.4px; margin:4px 0 8px;}
  .chk-chip{
    border:1px solid var(--border); border-radius:999px; padding:9px 14px; font-size:13.5px;
    cursor:pointer; user-select:none; background:#fff;
  }
  .chk-chip.checked{background:var(--dark); color:#fff; border-color:var(--dark);}
  .custom-chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--red); color:var(--red);
    border-radius:999px; padding:7px 12px; font-size:13px; margin:4px 6px 0 0;
  }
  .custom-chip button{background:none; border:none; color:var(--red); cursor:pointer; font-size:13px; padding:0; display:inline-flex; align-items:center;}
  .photo-input-btn{
    border:1.5px dashed var(--border); border-radius:8px; padding:20px; text-align:center; color:var(--text-2);
    cursor:pointer; font-size:14px; background:var(--surface); display:flex; align-items:center; justify-content:center;
  }
  .photo-input-btn:hover{border-color:var(--navy); color:var(--navy);}
  .photo-thumb.photo-lg{width:104px; height:104px;}
  .photo-thumb.photo-lg img{width:100%; height:100%; object-fit:cover;}
  .photo-btn-row{display:flex; gap:10px; flex-wrap:wrap;}
  .photo-btn-row .photo-input-btn{flex:1 1 150px; padding:16px 12px;}
  .photo-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .photo-thumb{position:relative; width:78px; height:78px; border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

  /* Job detail */
  .detail-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .back-link{background:none; border:none; color:var(--text-2); cursor:pointer; font-size:14px; font-family:inherit; padding:6px 0; display:inline-flex; align-items:center;}
  .back-link:hover{color:var(--dark);}
  .detail-head h2{margin:0; font-size:18px;}
  .detail-print-btns{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .job-total-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; font-size:15px;}
  .job-total-row strong{font-size:18px; font-variant-numeric:tabular-nums;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; font-size:14px;}
  @media (max-width:480px){ .info-grid{grid-template-columns:1fr;} }
  .info-grid .k{color:var(--text-2); font-size:12px;}
  .info-grid .v{font-weight:600;}
  .complaint-tag{
    display:inline-block; background:var(--surface-2); border-radius:999px; padding:5px 12px;
    font-size:12.5px; margin:0 6px 6px 0;
  }
  .stepper{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px;}
  .step-btn{
    border:1px solid var(--border); background:#fff; color:var(--text-2); padding:9px 13px;
    border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .step-btn.current{background:var(--navy); color:#fff; border-color:var(--navy);}
  .timeline{border-left:2px solid var(--border); margin-left:6px; padding-left:16px;}
  .tl-item{position:relative; padding-bottom:14px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:''; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%;
    background:var(--navy); border:2px solid #fff; box-shadow:0 0 0 1px var(--navy);
  }
  .tl-item .st{font-weight:700; font-size:13.5px;}
  .tl-item .ts{color:var(--text-2); font-size:12px;}
  .photo-gallery{display:flex; flex-wrap:wrap; gap:8px;}
  .photo-gallery a{display:block; width:90px; height:90px; border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .photo-gallery img{width:100%; height:100%; object-fit:cover; display:block;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--dark); color:#fff; padding:10px 20px; border-radius:20px; font-size:13.5px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1;}

  /* Blank printable check-in form (handwriting) */
  .bf-toolbar{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .bf-page{border:1px solid var(--border); background:#fff; max-width:760px; margin:0 auto; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .bf-banner{background:#fff; color:var(--text); padding:18px 22px; border-bottom:3px solid var(--red);}
  .bf-title{font-weight:700; font-size:21px; letter-spacing:.5px; color:var(--text);}
