function startBoard(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  renderBoard();   // paint the shell immediately so the screen isn't blank
  db.collection('board').onSnapshot(snap => {
    const rows = [];
    snap.forEach(d => rows.push(Object.assign({}, d.data(), { id: d.id })));
    boardRows = rows;
    boardReady = true;
    renderBoard();
  }, err => {
    console.error('board', err);
    boardReady = true;
    renderBoard(err.code === 'permission-denied'
      ? 'ยังไม่ได้เปิดสิทธิ์ให้ดูกระดานนี้ กรุณาแจ้งพนักงาน'
      : 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่');
  });
  /* The clock ticks every second, but only the clock element is rewritten — redrawing
     the whole board once a second would be wasteful on a screen that sits on all day.
     The slower full redraw stays so the "today only" filter rolls over at midnight;
     the car data itself arrives through onSnapshot, not this timer. */
  setInterval(tickBoardClock, 1000);
  setInterval(() => { if(boardReady) renderBoard(); }, 60000);
}

/* Which cars belong on the waiting-room screen.

   Filtering to TODAY (as this did briefly) was wrong: a car dropped off yesterday and
   still on a lift would vanish from the list while its bay showed occupied — the owner
   sitting in the waiting room would conclude their car wasn't there. So every car still
   in the shop is listed regardless of arrival date. Cars already handed back come off
   immediately; the waiting room only needs what's still in progress.
   The day separation the shop asked for is done by GROUPING (see boardGroups), not by
   hiding rows. */
function boardVisibleRows(){
  return boardRows.filter(r => r.status !== 'delivered' && r.status !== 'carout');
}

function byQueueThenTime(a, b){
  const qa = parseInt(a.queueNo, 10);
  const qb = parseInt(b.queueNo, 10);
  if(isFinite(qa) && isFinite(qb) && qa !== qb) return qa - qb;
  if(isFinite(qa) !== isFinite(qb)) return isFinite(qa) ? -1 : 1;
  return String(a.createdAt||'').localeCompare(String(b.createdAt||''));
}

// Grouped by the day the car was checked in, newest day first.
function boardGroups(){
  const map = {};
  boardVisibleRows().forEach(r => {
    const k = dayKey(r.createdAt) || '—';
    (map[k] = map[k] || []).push(r);
  });
  return Object.keys(map)
    .sort((a, b) => b.localeCompare(a))
    .map(k => ({ key:k, label: k === '—' ? 'ไม่ระบุวัน' : dayLabel(k), rows: map[k].sort(byQueueThenTime) }));
}

// Rewrites just the clock text, leaving the rest of the board untouched.
function tickBoardClock(){
  const el = document.getElementById('board-clock');
  if(el){
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tickBoardEta();
}

/* The countdown block for one car. The numbers are baked in as data-* attributes so
   the ticker below can refresh them without re-rendering — the board is a screen that
   sits on all day, and rebuilding every card every second would make it flicker. */
function etaBlockHtml(r){
  const st = etaState(r.estMins, r.workStart, r.workEnd);
  if(!st) return '';
  return `<div class="bc-eta ${st.phase}" data-eta data-base="bc-eta" data-mins="${Number(r.estMins)||0}" data-start="${escapeAttr(r.workStart||'')}" data-end="${escapeAttr(r.workEnd||'')}">
    <div class="be-row">
      <span class="be-ico">${icon('clock',13)}</span>
      <span class="be-text">${escapeHtml(st.text)}</span>
    </div>
    <div class="be-sub">${escapeHtml(st.sub||'')}</div>
    <div class="be-bar"><span style="width:${st.pct}%"></span></div>
  </div>`;
}

// Refreshes every countdown on the board once a second, text and bar only.
function tickBoardEta(){
  const nodes = document.querySelectorAll('[data-eta]');
  for(let i = 0; i < nodes.length; i++){
    const el = nodes[i];
    const st = etaState(el.getAttribute('data-mins'), el.getAttribute('data-start'), el.getAttribute('data-end'));
    if(!st) continue;
    el.className = (el.getAttribute('data-base') || 'bc-eta') + ' ' + st.phase;
    const t = el.querySelector('.be-text');   if(t) t.textContent = st.text;
    const s = el.querySelector('.be-sub');    if(s) s.textContent = st.sub || '';
    const b = el.querySelector('.be-bar > span'); if(b) b.style.width = st.pct + '%';
    if(st.sub) el.title = st.sub;
  }
}

function renderBoard(errorMsg){
  const app = document.getElementById('app');
  const rows = boardVisibleRows();
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');

  let html = `<div class="board-wrap">
    <div class="hazard-edge"></div>
    <div class="board-head">
      <div>
        <div class="board-title">${escapeHtml(state && state.shop ? state.shop.name : 'POWER GROUP')}</div>
        <div class="board-sub">สถานะรถที่กำลังดำเนินการ</div>
      </div>
      <div class="board-clock mono" id="board-clock">${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</div>
    </div>`;

  /* When opened as a preview from Settings this is a normal browser tab with no way
     back into the app, which felt like a dead end. The waiting-room screen itself is
     launched fresh from a QR and has no history, so the button only appears when
     there IS somewhere to go back to. */
  if(window.history && window.history.length > 1){
    html += `<div class="board-back"><button class="btn secondary small" onclick="history.back()">${icon('back',14)} กลับ</button></div>`;
  }

  if(errorMsg){
    html += `<div class="board-empty">${escapeHtml(errorMsg)}</div>`;
  } else if(!boardReady){
    html += `<div class="board-empty">กำลังโหลด...</div>`;
  } else {
    /* Workshop floor. Deliberately NOT limited to today's cars the way the list below
       is — a car that came in yesterday and is still on a lift is still occupying that
       bay, and showing it as free would be wrong. Cars already handed back release
       their bay. Always drawn, even with an empty shop, so the layout is recognisable. */
    const bayOwner = {};
    boardRows.forEach(r => {
      if(!r.bay) return;
      if(r.status === 'delivered' || r.status === 'carout') return;
      if(!bayOwner[r.bay]) bayOwner[r.bay] = r;
    });
    const busy = WORK_BAYS.filter(b => bayOwner[b]).length;
    html += `<div class="board-bays">
      <div class="bb-head">
        <span class="bb-title">ช่องทำงาน</span>
        <span class="bb-count mono">${busy}/${WORK_BAYS.length}</span>
      </div>
      <div class="bay-grid">`;
    WORK_BAYS.forEach(bay => {
      const o = bayOwner[bay];
      html += `<div class="bay-cell ${o ? 'busy' : ''} ${bay === ALIGN_BAY ? 'align' : ''} ${o ? escapeAttr(o.statusCls||'') : ''}">
        <div class="bay-name">${escapeHtml(bay)}</div>
        ${o
          ? `<div class="bay-plate mono">${escapeHtml(o.plate || o.plateMasked || '-')}</div>
             <div class="bay-st">${escapeHtml(o.statusLabel || '')}</div>`
          : `<div class="bay-free">ว่าง</div>`}
      </div>`;
    });
    html += `</div></div>`;

    if(rows.length === 0){
      html += `<div class="board-empty">ยังไม่มีรถที่กำลังดำเนินการ</div>`;
    }
  }

  if(!errorMsg && boardReady && rows.length > 0){
    // Separated by check-in day, newest first — nothing is hidden, just grouped.
    boardGroups().forEach(group => {
      html += `<div class="board-day">
        <span class="bd-label">${escapeHtml(group.label)}</span>
        <span class="bd-count">${group.rows.length} คัน</span>
      </div>`;
      html += `<div class="board-grid">`;
      group.rows.forEach(r => {
        const carLine = [r.brand, r.model].filter(Boolean).join(' ') || 'ไม่ระบุรุ่น';
        html += `<div class="board-card ${escapeAttr(r.statusCls||'')}">
          <div class="bc-queue">
            <span class="bc-q-label">คิว</span>
            <span class="bc-q-no mono">${escapeHtml(r.queueNo || '—')}</span>
          </div>
          ${r.thumb
            ? `<img class="bc-photo" src="${r.thumb}" alt="">`
            : `<div class="bc-photo bc-photo-empty">${icon('car',26)}</div>`}
          <div class="bc-mid">
            <div class="bc-car">${escapeHtml(carLine)}</div>
            ${r.color ? `<div class="bc-color">สี ${escapeHtml(r.color)}</div>` : ''}
            ${(r.plate || r.plateMasked) ? plateHtml(r.plate || r.plateMasked, r.province, 'sm') : ''}
          </div>
          <div class="bc-endcol">
            <div class="bc-status ${escapeAttr(r.statusCls||'')}">${escapeHtml(r.statusLabel || '')}</div>
            ${r.bay ? `<div class="bc-bay">ช่อง ${escapeHtml(r.bay)}</div>` : ''}
          </div>
          ${etaBlockHtml(r)}
        </div>`;
      });
      html += `</div>`;
    });

    html += `<div class="board-legend">`;
    STATUS_FLOW.forEach(s => {
      html += `<span class="bl-item"><span class="sw ${s.cls}"></span>${escapeHtml(s.label)}</span>`;
    });
    html += `</div>`;
  }

  // Version shown here too — the board has no app bar, so without it there's no way to
  // tell whether the screen is running the latest deploy or a cached old one.
  html += `<div class="board-foot">
      หน้านี้อัปเดตอัตโนมัติ ไม่ต้องรีเฟรช · แสดงเฉพาะรถที่ยังดำเนินการอยู่ แยกตามวันที่รับรถ<br>
      ค้นหารถของท่านจากหมายเลขคิวที่ได้รับตอนฝากรถ · หากไม่พบ กรุณาสอบถามพนักงาน
      <div style="margin-top:8px; opacity:.55; font-size:11px;">v${APP_VERSION}</div>
    </div>
  </div>`;

  app.innerHTML = html;
}

  }
  // ?home = the landing page. Pure static, no Firebase needed.
  if(isHomeMode()){ renderHomePage(); return; }
  // ?board = the waiting-room screen. No login, and it never touches `jobs`.
  if(isBoardMode()){ startBoard(); return; }
  initFirebase();
  // Keeps the countdown chips on the job cards ticking without a full re-render
  // (which would close open menus and lose the search caret).
  setInterval(tickBoardEta, 1000);
}

boot();
</script>
</body>
</html>
