function saveEditJob(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const v = getVehicle(job.vehicleId);
  const c = getCustomer(job.customerId);
  const changes = [];

  function diff(label, oldVal, newVal){
    const o = (oldVal||'').toString().trim();
    const n = (newVal||'').toString().trim();
    if(o !== n) changes.push(`${label}: "${o||'-'}" → "${n||'-'}"`);
  }

  diff('ชื่อลูกค้า', c.name, view.je_customerName);
  diff('เบอร์โทร', c.phone, view.je_customerPhone);
  diff('ยี่ห้อ', v.brand, view.je_brand);
  diff('รุ่น', v.model, view.je_model);
  diff('ปี', v.year, view.je_year);
  diff('สี', v.color, view.je_color);
  diff('จังหวัด', v.province, view.je_province);
  diff('เลขไมล์', job.mileageIn, view.je_mileage);

  const newComplaintsList = [
    ...view.je_checked.map(text => ({ text, custom:false })),
    ...view.je_customComplaints.map(text => ({ text, custom:true }))
  ];
  const oldComplaintsText = job.complaints.map(cp => cp.text).sort().join(', ');
  const newComplaintsText = newComplaintsList.map(cp => cp.text).sort().join(', ');
  if(oldComplaintsText !== newComplaintsText){
    changes.push(`อาการที่แจ้ง: "${oldComplaintsText||'-'}" → "${newComplaintsText||'-'}"`);
  }

  if(changes.length === 0){
    flashToast('ไม่มีการเปลี่ยนแปลง');
    view.je_editing = false; view.je_jobId = null;
    render();
    return;
  }

  c.name = view.je_customerName.trim();
  c.phone = view.je_customerPhone.trim();
  v.brand = view.je_brand.trim().toUpperCase();
  v.model = view.je_model.trim().toUpperCase();
  v.year = view.je_year.trim();
  v.color = view.je_color.trim();
  v.province = view.je_province.trim();
  job.mileageIn = view.je_mileage.toString().trim();
  job.complaints = newComplaintsList;

  pushEditLog('edit', job.jobNumber, v.plate, changes.join(' | '));
  saveState(true);
  view.je_editing = false; view.je_jobId = null;
  flashToast('บันทึกการแก้ไขแล้ว');
  render();
}

function deleteJobConfirm(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const v = getVehicle(job.vehicleId) || {};
  const c = getCustomer(job.customerId) || {};
  uiConfirm(`ลบรายการรับรถนี้?\n${v.plate||'-'} · ${c.name||'-'}\n\nย้ายไปถังขยะ กู้คืนได้จากหน้าตั้งค่า`, () => {
    /* Soft delete — the record and its photos stay, only marked. A hard delete used to
       destroy the photos too, which made "undo" impossible. */
    job.deletedAt = nowIso();
    job.deletedBy = (currentUser && currentUser.name) || '';
    if(job.bay) job.bay = '';                 // free the lift immediately
    pushEditLog('delete', job.jobNumber, v.plate||'-', `ลบรายการรับรถ (ลูกค้า: ${c.name||'-'}, สถานะขณะลบ: ${statusOf(job.status).label})`);
    saveState(true);
    view.tab = 'joblist'; view.jobId = null;
    flashToast('ย้ายไปถังขยะแล้ว');

  }, 'ลบรายการ');
}

function restoreJob(jobId){

// The only irreversible path. Photos go with it, since nothing will reference them again.
function purgeJob(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const v = getVehicle(job.vehicleId) || {};
  uiConfirm(`ลบถาวร ${v.plate||job.jobNumber}?\n\nรวมรูปภาพทั้งหมด — กู้คืนไม่ได้อีก`, () => {

function emptyTrash(){
  const rows = deletedJobs();
  if(rows.length === 0){ flashToast('ถังขยะว่างอยู่แล้ว'); return; }
  uiConfirm(`ลบถาวรทั้งหมด ${rows.length} รายการ?\n\nรวมรูปภาพทั้งหมด — กู้คืนไม่ได้อีก`, () => {
    rows.forEach(j => deletePhotosForJob(j.id));
    const ids = rows.map(j => j.id);
    state.jobs = state.jobs.filter(j => ids.indexOf(j.id) === -1);
    saveState(true);

  }, 'ลบถาวรทั้งหมด');
}

/* Adds any model from the shop's parts-catalog list that isn't in the system yet.
   Matched on seedKey (brand|original name) rather than the current name, so a model
   that has since been RENAMED is not treated as missing and duplicated. Existing
   models keep their parts and prices — nothing is overwritten. */
function seedKeyOf(brand, name){
  return String(brand||'').trim().toUpperCase() + '|' + String(name||'').trim().toUpperCase();
}

function addCatalogModels(){
  const present = {};
  state.models.forEach(m => {
    if(m.seedKey) present[m.seedKey] = true;
    present[seedKeyOf(m.brand, m.name)] = true;   // pre-seedKey models match on name
  });
  const missing = CATALOG_VEHICLE_MODELS.filter(cm => !present[seedKeyOf(cm.brand, cm.name)]);
  if(missing.length === 0){ flashToast('มีรุ่นรถจากแคตตาล็อกครบแล้ว'); return; }

  uiConfirm(`เพิ่มรุ่นรถจากแคตตาล็อกอีก ${missing.length} รุ่น?\n\nรุ่นที่มีอยู่แล้วจะไม่ถูกแตะต้อง อะไหล่และราคาเดิมยังอยู่ครบ`, () => {
    missing.forEach(cm => state.models.push(makeCatalogModel(cm)));
    saveState(true);
    flashToast('เพิ่ม ' + missing.length + ' รุ่นแล้ว');
    render();
  }, 'เพิ่ม ' + missing.length + ' รุ่น');
}

/* Every model starts with the full master-parts list attached but NO prices and
   nothing preselected — parts are chosen per job at quoting time, not at check-in. */
function makeCatalogModel(cm){
  const parts = state.masterParts.map(mp => ({
    id: uid(), partName: mp.name, category: mp.category,
    qty:'', unit:'ชิ้น', brands: [], variant:''
  }));
  return {
    id: uid(),
    seedKey: seedKeyOf(cm.brand, cm.name),
    // Uppercased on insert as well as in the source list — every brand/model in the
    // system is uppercase, no exceptions.
    brand: String(cm.brand).toUpperCase(),
    name: String(cm.name).toUpperCase(),
    yearRange: cm.yearRange || '',
    parts,
    promotions: []
  };
}

/* Wipe every รุ่นรถ and rebuild from the catalogue. Destructive by design — the shop
   asked for the old, badly-split entries (ยี่ห้อ ACCORD / รุ่น GEN8) to be gone rather
   than sitting alongside the corrected ones. Jobs and vehicles are untouched; only the
   รุ่นรถ catalogue and the prices attached to it are replaced. */
function resetModelsToCatalog(){
  const oldCount = state.models.length;
  uiConfirm(
    `ลบรุ่นรถเดิมทั้งหมด (${oldCount} รุ่น) แล้วโหลดรายการใหม่ ${CATALOG_VEHICLE_MODELS.length} รุ่น?\n\n` +
    `ราคาอะไหล่ที่เคยตั้งไว้ในรุ่นเดิมจะหายไปด้วย — ย้อนกลับไม่ได้\n` +
    `รายการรับรถและข้อมูลลูกค้าไม่ได้รับผลกระทบ\n\n` +
    `แนะนำให้กด "บันทึกไฟล์สำรอง" ในหน้าตั้งค่าไว้ก่อน`,
    () => {
      state.models = CATALOG_VEHICLE_MODELS.map(makeCatalogModel);
      saveState(true);
      flashToast('โหลดรุ่นรถใหม่ ' + state.models.length + ' รุ่นแล้ว');
      view.modelId = null;
      render();
    },
    'ลบและโหลดใหม่'
  );
}

function onModelFieldChange(modelId, field, value){

// น้ำมันเครื่อง, คู่ for ปีกนก) can be used as the standard for the whole catalog.
// Parts that don't exist by name on another model, or that model doesn't have that
// part, are left untouched.
function syncUnitsFromModel(modelId){
  const source = getModel(modelId);
  if(!source) return;
  uiConfirm(`คัดลอกหน่วยนับของอะไหล่ทุกรายการจาก "${source.brand||''} ${source.name}" ไปทับหน่วยของรุ่นรถอื่นทั้งหมด?\n\n(จับคู่ตามชื่ออะไหล่ — จะทับหน่วยเดิมของรุ่นอื่น)`, () => {
    const unitByName = {};
    source.parts.forEach(p => { unitByName[p.partName] = p.unit; });
    let updatedParts = 0;
    let updatedModels = 0;
    state.models.forEach(m => {
      if(m.id === modelId) return;
      let changedHere = false;
      m.parts.forEach(p => {
        const u = unitByName[p.partName];
        if(u !== undefined && p.unit !== u){
          p.unit = u;
          updatedParts++;
          changedHere = true;
        }
      });
      if(changedHere) updatedModels++;
    });
    saveState(true);
    flashToast(`อัปเดตหน่วยแล้ว ${updatedParts} รายการ ใน ${updatedModels} รุ่น`);
    render();
  }, 'คัดลอกหน่วย');
}

// Split a part into independent ซ้าย/ขวา rows — each keeps its own qty/unit/brands
// so left and right can end up with completely different code/price if needed.
// Current row becomes "ซ้าย" (keeping its data); a fresh "ขวา" row is inserted after it.
function splitPartLR(modelId, partId){
  const model = getModel(modelId);
  const idx = model.parts.findIndex(p => p.id === partId);
  if(idx === -1) return;
  const part = model.parts[idx];
  if(!part.variant) part.variant = 'ซ้าย';
  const twin = { id: uid(), partName: part.partName, category: part.category, variant: 'ขวา', qty: part.qty, unit: part.unit, brands: [] };
  model.parts.splice(idx + 1, 0, twin);
  saveState(true);
  render();
}

// Duplicate this part as another variant row (covers cases beyond ซ้าย/ขวา — e.g. more
// than one distinct version under the same part name). Staff types the variant label.
function duplicatePartVariant(modelId, partId){
  const model = getModel(modelId);
  const idx = model.parts.findIndex(p => p.id === partId);

  const part = model.parts[idx];
  const clone = { id: uid(), partName: part.partName, category: part.category, variant: '', qty: part.qty, unit: part.unit, brands: [] };
  model.parts.splice(idx + 1, 0, clone);

// Active/upcoming/expired based on dateStart/dateEnd (blank = unlimited on that side).
function promoStatus(promo){
  const today = new Date(); today.setHours(0,0,0,0);
  if(promo.dateStart){
    const start = new Date(promo.dateStart); start.setHours(0,0,0,0);
    if(today < start) return 'upcoming';
  }
  if(promo.dateEnd){
    const end = new Date(promo.dateEnd); end.setHours(23,59,59,999);
    if(today > end) return 'expired';
  }
  return 'active';
}
function promoStatusLabel(status){
  return status === 'upcoming' ? 'ยังไม่เริ่ม' : status === 'expired' ? 'หมดอายุ' : 'กำลังใช้งาน';
}

// Each preset's 4 colors are stored darkest-first (sorted by lightness), so they
// map consistently onto the app's dark/accent/border/surface roles regardless of
// what order they were originally given in.
const THEME_PRESETS = [
  { id:'green',  label:'เขียวมะกอก', colors:['#2C3930','#3F4F44','#A27B5C','#DCD7C9'] },
  { id:'slate',  label:'เทาน้ำตาล',  colors:['#222831','#393E46','#948979','#DFD0B8'] },
  { id:'purple', label:'ม่วงเข้ม',   colors:['#18122B','#393053','#443C68','#635985'] }
];

function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  return { r: parseInt(hex.slice(0,2),16)||0, g: parseInt(hex.slice(2,4),16)||0, b: parseInt(hex.slice(4,6),16)||0 };
}
function rgbToHex(r,g,b){
  const c = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,'0');
  return '#' + c(r) + c(g) + c(b);
}
// Blend `hex` toward `toHex` by `ratio` (0 = hex unchanged, 1 = toHex). Used to
// derive readable light surfaces/borders/muted text from a theme's raw colors,
// regardless of how light or dark those raw colors happen to be.
function mixHex(hex, toHex, ratio){
  const a = hexToRgb(hex), b = hexToRgb(toHex);
  return rgbToHex(a.r + (b.r-a.r)*ratio, a.g + (b.g-a.g)*ratio, a.b + (b.b-a.b)*ratio);
}

// Applies (or clears) a theme by overriding the app's :root CSS variables. 'default'
// (or any unknown id) clears overrides, restoring the original built-in colors.
function applyTheme(themeId){
  const root = document.documentElement.style;
  const preset = THEME_PRESETS.find(t => t.id === themeId);
  const vars = ['--dark','--navy','--black','--text','--text-2','--border','--surface','--surface-2'];
  if(!preset){
    vars.forEach(v => root.removeProperty(v));
    return;
  }
  const [c1, c2, c3, c4] = preset.colors;
  root.setProperty('--dark', c1);
  root.setProperty('--navy', c2);
  root.setProperty('--black', c1);
  root.setProperty('--text', c1);
  root.setProperty('--text-2', mixHex(c1, '#ffffff', 0.45));
  root.setProperty('--border', mixHex(c3, '#ffffff', 0.35));
  root.setProperty('--surface', mixHex(c4, '#ffffff', 0.65));
  root.setProperty('--surface-2', mixHex(c4, '#ffffff', 0.5));
}

function setTheme(themeId){
  state.settings = state.settings || {};
  state.settings.themeId = themeId;
  saveState(true);
  applyTheme(themeId);
  render();
}

// Claude AI — for bigger/more complex jobs.
// Turns a raw HTTP status + error body from Claude/Gemini into a short, readable
// Thai message instead of a wall of JSON — especially for quota/billing (429) and
// invalid-key (401/403) cases, which are the most common ones users hit.
function friendlyApiError(provider, status, bodyText){
  const providerName = provider === 'gemini' ? 'Gemini' : 'Claude';
  let msg = bodyText;
  try{
    const parsed = JSON.parse(bodyText);
    const raw = (parsed.error && (parsed.error.message || parsed.error)) || parsed.message || bodyText;
    msg = typeof raw === 'string' ? raw : JSON.stringify(raw);
  }catch(e){ /* keep raw text as-is */ }

  if(status === 429){
    const billingUrl = provider === 'gemini' ? 'Google AI Studio (ai.google.dev)' : 'console.anthropic.com';
    const otherModel = provider === 'gemini' ? 'Claude AI' : 'Gemini';
    return `คำขอเกินโควต้าที่กำหนดของ ${providerName} API (429) — บัญชี/API Key นี้ใช้งานเกินสิทธิ์ที่มีอยู่ในขณะนี้ กรุณาตรวจสอบแผนการใช้งาน/บิลลิ่งที่ ${billingUrl} หรือลองสลับไปใช้ ${otherModel} แทนชั่วคราว`;
  }
  if(status === 401 || status === 403){
    return `API Key ของ ${providerName} ไม่ถูกต้องหรือไม่มีสิทธิ์ใช้งาน กรุณาตรวจสอบ API Key ที่กรอกไว้ในหน้านี้อีกครั้ง`;
  }
  if(status === 529){
    return `เซิร์ฟเวอร์ ${providerName} มีผู้ใช้งานหนาแน่นในขณะนี้ กรุณาลองใหม่อีกครั้งในอีกสักครู่`;
  }
  if(status === 503){
    return `เซิร์ฟเวอร์ ${providerName} มีผู้ใช้งานหนาแน่นชั่วคราว (503) — ระบบลองเรียกซ้ำให้อัตโนมัติแล้วแต่ยังไม่สำเร็จ กรุณากดสรุปงานอีกครั้งในอีกสักครู่`;
  }
  return `เรียก ${providerName} API ไม่สำเร็จ (${status}) ${msg}`.slice(0, 300);
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Status codes worth an automatic retry: transient overload/rate-limit, not
// auth/bad-request errors (those would never succeed on retry).
const RETRYABLE_STATUSES = [429, 503, 529];
const MAX_AI_RETRIES = 2; // total attempts = 1 + this

async function callClaude(apiKey, prompt){
  let lastErr;
  for(let attempt = 0; attempt <= MAX_AI_RETRIES; attempt++){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens: 700,
        messages:[{ role:'user', content: prompt }]
      })
    });
    if(res.ok){
      const data = await res.json();
      return (data.content && data.content[0] && data.content[0].text) || '(ไม่มีผลลัพธ์)';
    }
    const errBody = await res.text();
    lastErr = new Error(friendlyApiError('claude', res.status, errBody));
    if(!RETRYABLE_STATUSES.includes(res.status) || attempt === MAX_AI_RETRIES) throw lastErr;
    await sleep(1200 * (attempt + 1));
  }
  throw lastErr;
}

// Gemini — for everyday/general use. Uses 2.5 Flash-Lite: current stable model with
// the most generous free-tier quota (gemini-2.0-flash was retired by Google).
async function callGemini(apiKey, prompt){
  let lastErr;
  for(let attempt = 0; attempt <= MAX_AI_RETRIES; attempt++){
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=' + encodeURIComponent(apiKey), {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    if(res.ok){
      const data = await res.json();
      const cand = data.candidates && data.candidates[0];
      return (cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text) || '(ไม่มีผลลัพธ์)';
    }
    const errBody = await res.text();
    lastErr = new Error(friendlyApiError('gemini', res.status, errBody));
    if(!RETRYABLE_STATUSES.includes(res.status) || attempt === MAX_AI_RETRIES) throw lastErr;
    await sleep(1200 * (attempt + 1));
  }
  throw lastErr;
}

/* ---------------- Backup: Save / Open (File System Access, overwrite in place) ---------------- */
const BACKUP_FILENAME = "POWER GROUP_GSMS_blackup.json";
const FS_DB_NAME = 'pg-gsms-fs';
const FS_STORE_NAME = 'handles';
const FS_HANDLE_KEY = 'backupFileHandle';

function fsIdbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(FS_STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function fsIdbGet(key){
  return fsIdbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE_NAME, 'readonly');
    const req = tx.objectStore(FS_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function fsIdbSet(key, value){
  return fsIdbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE_NAME, 'readwrite');
    tx.objectStore(FS_STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

async function getBackupFileHandle(forcePick){
  if(!window.showSaveFilePicker) return null;
  if(!forcePick){
    try{
      const saved = await fsIdbGet(FS_HANDLE_KEY);
      if(saved){
        const perm = await saved.queryPermission({ mode:'readwrite' });
        if(perm === 'granted') return saved;
        if(perm === 'prompt'){
          const req = await saved.requestPermission({ mode:'readwrite' });
          if(req === 'granted') return saved;
        }
      }
    }catch(e){ /* handle missing/invalid — fall through to picker */ }
  }
  const handle = await window.showSaveFilePicker({
    suggestedName: BACKUP_FILENAME,
    types: [{ description:'JSON backup', accept: {'application/json':['.json']} }]
  });
  await fsIdbSet(FS_HANDLE_KEY, handle);
  return handle;
}

function downloadBackupFile(dataStr){
  const blob = new Blob([dataStr], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = BACKUP_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  try{
    if(window.showSaveFilePicker){
      const handle = await getBackupFileHandle(false);
      if(handle){
        const writable = await handle.createWritable();
        await writable.write(dataStr);
        await writable.close();
        flashToast('บันทึกทับไฟล์สำรองเดิมแล้ว');
        return;
      }
    }
    downloadBackupFile(dataStr);
    flashToast('บันทึกไฟล์สำรองแล้ว');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    downloadBackupFile(dataStr);
    flashToast('บันทึกไฟล์สำรองแล้ว (ดาวน์โหลดไฟล์ใหม่)');
  }
}

function importBackup(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    let parsed;
    try{
      parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.jobs) || !Array.isArray(parsed.vehicles)){
        throw new Error('invalid');
      }
    }catch(e){
      flashToast('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลที่ถูกต้อง');
      evt.target.value = '';
      return;
    }
    if(!isAdmin()){
      flashToast('เฉพาะผู้ดูแลระบบเท่านั้น');
      evt.target.value = '';
      return;
    }
    const counts = `รุ่นรถ ${(parsed.models||[]).length} · อะไหล่กลาง ${(parsed.masterParts||[]).length} · งาน ${(parsed.jobs||[]).length}`;
    uiConfirm(`นำเข้าข้อมูลจากไฟล์นี้?\n${counts}\n\nข้อมูลนี้จะถูกอัปโหลดขึ้นคลาวด์และแทนที่ข้อมูลเดิมทั้งหมด — ทุกเครื่องจะเห็นตรงกันทันที`, () => {
      // Bring the V1 blob up to the current schema before it goes to the cloud.
      state = parsed;
      if(!state.settings) state.settings = emptyState().settings;
      if(!state.shop) state.shop = emptyState().shop;
      if(!Array.isArray(state.deletedMasterPartNames)) state.deletedMasterPartNames = [];
      SYNC_COLLECTIONS.forEach(col => { if(!Array.isArray(state[col])) state[col] = []; });
      ensureCatalogFields();
      ensureModelBrandSplit();
      ensureRequiredModels();
      ensurePartFields();
      ensurePartCategories();
      ensureVehicleModelBrandFix();
      ensureBrandOptions();
      ensureJobFields();
      if(!state.complaintTypes || state.complaintTypes.length === 0){
        state.complaintTypes = DEFAULT_COMPLAINTS.map(name => ({ id: uid(), name }));
      }
      // Any record without an id would be dropped by the diff-based save.
      SYNC_COLLECTIONS.forEach(col => {
        state[col].forEach(row => { if(row && !row.id) row.id = uid(); });
      });
      renderAuthStatus('กำลังอัปโหลดข้อมูลขึ้นคลาวด์...');
      flushState(false);
      setTimeout(() => {
        view.tab = 'joblist'; view.jobId = null; view.modelId = null;
        render();
        flashToast('นำเข้าข้อมูลเรียบร้อยแล้ว');
      }, 900);
    }, 'นำเข้าข้อมูล');
    evt.target.value = '';
  };
  reader.onerror = function(){ flashToast('อ่านไฟล์ไม่สำเร็จ'); evt.target.value=''; };
  reader.readAsText(file);
}

    <button class="status-pill ${view.statusFilter==='all'?'active':''}" onclick="setStatusFilter('all')">ทั้งหมด <span class="n">${counts.all}</span></button>`;
  STATUS_FLOW.forEach(s => {
    if(s.key === 'delivered') return;                                // lives on its own page
    if(counts[s.key] === 0 && view.statusFilter !== s.key) return;   // hide empty stages
    html += `<button class="status-pill ${view.statusFilter===s.key?'active':''}" onclick="setStatusFilter('${s.key}')"><span class="sw ${s.cls}"></span>${escapeHtml(s.label)} <span class="n">${counts[s.key]}</span></button>`;
  });
  html += `</div>`;

  if(filtered.length === 0){
    // An empty list is the most likely moment to want a new job, so the action sits
    // right here rather than only in the floating button at the corner of the screen.
    html += `<div class="empty-state">
      <div>ไม่พบงานที่ตรงกับเงื่อนไข</div>
      <button class="btn" style="margin-top:14px;" onclick="goTab('checkin')">${icon('plus',15)} รับรถคันใหม่</button>
    </div>`;
    html += `<button class="fab" title="รับรถคันใหม่" onclick="goTab('checkin')">${icon('plus',26)}</button>`;
    return html;
  }

  // Column count — clamped to what the current device can actually fit (see jobColsMax).
  const maxCols = jobColsMax();
  const cols = Math.min(Math.max(view.jobCols || 2, 1), maxCols);
  html += `<div class="cols-bar">
    <span class="cols-label">คอลัมน์</span>`;
  for(let n = 1; n <= maxCols; n++){
    html += `<button class="cols-btn ${cols===n?'active':''}" onclick="setJobCols(${n})">${n}</button>`;
  }
  html += `</div>`;

  html += `<div class="job-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));">`;
  filtered.forEach(job => {
    const v = getVehicle(job.vehicleId) || {};
    const c = getCustomer(job.customerId) || {};
    const st = statusOf(job.status);
    const nextSt = nextStatusOf(job);
    const thumb = jobThumb(job);
    html += `<div class="job-card ${st.cls}">
      <div class="jc-main" onclick="openJob('${job.id}')">

            ? `<img class="jc-thumb" src="${thumb}" alt="">`
            : `<div class="jc-thumb jc-thumb-empty">${icon('camera',22)}</div>`}
          ${plateHtml(v.plate, v.province, 'fit')}
        </div>
        <div class="jc-left">
          <div class="jc-tags">
            ${job.queueNo ? `<span class="jc-queue">คิว ${escapeHtml(job.queueNo)}</span>` : ''}
            ${job.bay ? `<span class="bay-chip ${job.bay === ALIGN_BAY ? 'align' : ''}">${escapeHtml(job.bay)}</span>` : ''}
            ${jobEtaChipHtml(job)}
          </div>
          <div class="meta strong">${escapeHtml(v.brand||'')} ${escapeHtml(v.model||'')}${v.color ? ' · '+escapeHtml(v.color) : ''}</div>
          <div class="meta">${escapeHtml(c.name||'-')}</div>
          <div class="jn mono">${escapeHtml(job.jobNumber)} · ${fmtDT(job.createdAt)}</div>
        </div>
        <span class="badge ${st.cls}">${escapeHtml(st.label)}</span>
      </div>
      <div class="jc-actions">
        ${renderStatusTrack(job)}
        <button class="btn secondary small" onclick="openBayPicker('${job.id}', event)">${job.bay ? escapeHtml(job.bay) : 'เลือกช่อง'}</button>
        <button class="btn secondary small" onclick="openStatusPicker('${job.id}', event)">สถานะ</button>
        ${!isDecisionPoint(job.status) && nextSt
          ? `<button class="btn small hazard" onclick="setJobStatusFromList('${job.id}','${nextSt.key}', event)">${escapeHtml(nextSt.label)} ${icon('forward',12)}</button>`
          : ''}
        ${canDeleteJobs() ? `<button class="jc-del" title="ลบรายการนี้" onclick="deleteJobFromList('${job.id}', event)">${icon('trash',15)}</button>` : ''}
      </div>
      ${isDecisionPoint(job.status) ? `
      <div class="jc-decide">
        <span class="jd-label">ลูกค้าตอบว่า</span>
        <div class="jd-btns">
          ${DECISION_KEYS.map(k => {

          }).join('')}
        </div>
      </div>` : ''}
    </div>`;
  });
  html += `</div>`;

  // Floating "add car" button — check-in is the action staff reach for most often, and
  // hunting for the tab every time costs seconds all day. Sits clear of the bottom tab
  // bar on phones (see the responsive rule).
  html += `<button class="fab" title="รับรถคันใหม่" onclick="goTab('checkin')">${icon('plus',26)}</button>`;
  return html;
}

/* How many columns this device can sensibly show: phone 1-2, iPad 1-3, desktop 2-4.
   Matches the same touch/width split used by the responsive tiers. */
function jobColsMax(){
  const w = window.innerWidth || 1200;
  const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  if(w <= 700) return 1;                  // phone — a card is too tall to split in two
  if(coarse && w <= 1400) return 3;       // iPad, either orientation
  if(w <= 1100) return 3;
  return 4;                               // desktop
}
function setJobCols(n){ view.jobCols = n; render(); }

/* Progress track. The route depends on the customer's answer to the quote, so the
   track is built from whichever path this job is actually on rather than one fixed
   list — a rejected car shouldn't render as "3 of 8 done, 5 to go". */
function renderStatusTrack(job){
  const st = statusOf(job.status);
  let path;
  if(job.status === 'scheduled' || job.status === 'rejected'){
    path = ['received','inspecting','quoted', job.status, 'carout'];
  } else if(job.status === 'carout'){
    path = ['received','inspecting','quoted','—','carout'];
  } else {
    path = MAIN_PATH;
  }
  const idx = path.indexOf(job.status);
  return `<div class="jc-steps" title="${escapeAttr(st.label)}">${path.map((k, i) => {
    const s = STATUS_FLOW.find(x => x.key === k);
    const done = idx > -1 && i <= idx;
    return `<span class="jc-seg ${done ? 'done ' + (s ? s.cls : '') : ''} ${i === idx ? 'now' : ''}"></span>`;
  }).join('')}</div>`;
}

// Short d/m/yy date in Thai Buddhist Era (e.g. 9/7/69), used for the LINE group post.
function fmtDateBE(iso){
  const d = iso ? new Date(iso) : new Date();
  const beYear = d.getFullYear() + 543;
  return `${d.getDate()}/${d.getMonth()+1}/${String(beYear).slice(-2)}`;
}

// A customer counts as "ลูกค้าเดิม" (repeat) if they have any other job on file.
function isRepeatCustomer(customerId, excludeJobId){
  return activeJobs().some(j => j.customerId === customerId && j.id !== excludeJobId);
}

function onLineFieldInput(field, value){ view[field] = value; render(); }

function onJobQueueNoChange(jobId, value){
  const job = getJob(jobId);
  if(!job) return;
  job.queueNo = (value || '').trim();
  saveState(true);
  render();
}

/* ---------------- Job detail: quote parts (added after the mechanic inspects) ----------------
   A job normally starts with no parts at all — staff check the car in, print ใบรับรถ, hand it
   to the mechanic, and only then add the parts to be quoted. These helpers edit job.partsNeeded
   directly (a snapshot on the job, independent of the รุ่นรถ catalog it was seeded from). */
function getJobModel(job){
  const v = getVehicle(job.vehicleId);
  if(!v || !v.model) return null;
  return state.models.find(m => m.name === v.model) || null;
}

function jobPartsTotal(job){
  return (job.partsNeeded || []).reduce((sum, p) => {
    const price = parseFloat(p.price);
    if(!price) return sum;
    const qty = parseFloat(p.qty) || 1;
    return sum + price * qty;
  }, 0);
}

// Chip click in the "เลือกจากรุ่นรถ" picker: adds the part if not on the job yet,
// removes it if it is (matched on partName + variant, since job rows are snapshots).
function toggleJobPartFromModel(jobId, modelPartId){
  const job = getJob(jobId);
  if(!job) return;
  // Works for both sources — catalog model parts and the master-parts fallback,
  // which uses synthetic "master-<id>" keys (see jobPickableParts).
  const mp = jobPickableParts(job).items.find(p => p.id === modelPartId);
  if(!mp) return;
  const existingIdx = job.partsNeeded.findIndex(p => p.partName === mp.partName && (p.variant||'') === (mp.variant||''));
  if(existingIdx > -1){
    job.partsNeeded.splice(existingIdx, 1);
  } else {
    const firstPriced = (mp.brands || []).find(b => b.price);
    job.partsNeeded.push({
      id: uid(), partName: mp.partName, variant: mp.variant || '',
      qty: mp.qty || '', unit: mp.unit || 'ชิ้น',
      brand: firstPriced ? (firstPriced.brand || '') : '',
      price: firstPriced ? (firstPriced.price || '') : '',
      note: ''
    });
  }
  saveState(true);
  render();
}

function addCustomJobPart(jobId){
  const job = getJob(jobId);
  if(!job) return;
  uiPrompt('ชื่อรายการที่ต้องการเพิ่ม (เช่น ค่าแรง, อะไหล่นอกรายการ)', '', name => {
    const trimmed = name.trim();
    if(!trimmed) return;
    job.partsNeeded.push({ id: uid(), partName: trimmed, variant:'', qty:'1', unit:'ชิ้น', brand:'', price:'', note:'' });
    saveState(true);
    render();
  });
}

function onJobPartFieldChange(jobId, partRowId, field, value){
  const job = getJob(jobId);
  if(!job) return;
  const row = job.partsNeeded.find(p => p.id === partRowId);
  if(!row) return;
  row[field] = value;
  saveState(true);
  render();
}

function removeJobPart(jobId, partRowId){
  const job = getJob(jobId);
  if(!job) return;
  job.partsNeeded = job.partsNeeded.filter(p => p.id !== partRowId);
  saveState(true);
  render();
}

function clearJobParts(jobId){
  const job = getJob(jobId);
  if(!job || job.partsNeeded.length === 0) return;
  uiConfirm(`ล้างรายการอะไหล่ทั้งหมดของงานนี้? (${job.partsNeeded.length} รายการ)`, () => {
    job.partsNeeded = [];
    saveState(true);
    flashToast('ล้างรายการแล้ว');
    render();
  }, 'ล้างทั้งหมด');
}

// Pull in every pickable part at once (skipping any already added). Uses the same
// source as the chip picker, so it works for hand-typed models too.
function addAllModelPartsToJob(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const picker = jobPickableParts(job);
  if(!picker.items.length) return;
  let added = 0;
  picker.items.forEach(mp => {
    const exists = job.partsNeeded.some(p => p.partName === mp.partName && (p.variant||'') === (mp.variant||''));
    if(exists) return;
    const firstPriced = (mp.brands || []).find(b => b.price);
    job.partsNeeded.push({
      id: uid(), partName: mp.partName, variant: mp.variant || '',
      qty: mp.qty || '', unit: mp.unit || 'ชิ้น',
      brand: firstPriced ? (firstPriced.brand || '') : '',
      price: firstPriced ? (firstPriced.price || '') : '',
      note: ''
    });
    added++;
  });
  saveState(true);
  flashToast(added + ' รายการถูกเพิ่ม');
  render();
}

// Builds the exact plain-text format staff post to the shop's LINE group right
// after check-in: queue no. + date, customer (+ repeat tag), phone, plate,
// brand/model, color, optional prior-visit note (repeat customers only),
// symptoms, optional price note, closing line.
function buildLineSummaryText(job){
  const v = getVehicle(job.vehicleId) || {};
  const c = getCustomer(job.customerId) || {};
  const repeat = isRepeatCustomer(job.customerId, job.id);
  const q = (job.queueNo || view.line_queueNo || '').trim();
  const lines = [];
  lines.push(`คิวที่${q ? ' ('+q+')' : ''} ${fmtDateBE(job.createdAt)}`);
  lines.push(`คุณ${c.name || '-'}${repeat ? ' (ลูกค้าเดิม)' : ''}`);
  lines.push(c.phone || '-');
  lines.push(`${v.plate || '-'}${v.province || ''}`);
  lines.push(`${v.brand || ''} ${v.model || ''}`.trim() || '-');
  lines.push(v.color || '-');
  if(repeat && ((view.line_prevDate||'').trim() || (view.line_prevWork||'').trim())){
    if((view.line_prevDate||'').trim()) lines.push(`เข้าทำ ${view.line_prevDate.trim()}`);
    if((view.line_prevWork||'').trim()) lines.push(`- ${view.line_prevWork.trim()}`);
  }
  lines.push('อาการ');
  if(job.complaints.length === 0){
    lines.push('- ไม่มีข้อมูล');
  } else {
    job.complaints.forEach(cp => lines.push(`- ${cp.text}`));
  }
  /* Once parts have been quoted the same message gets posted to the LINE group a
     SECOND time, so from that point on it has to carry the quote and the customer's
     answer instead of still saying "รอเช็ค". */
  const parts = job.partsNeeded || [];
  if(parts.length > 0){
    lines.push('');
    lines.push('รายการเสนอราคา');
    parts.forEach(p => {
      const qty = parseFloat(p.qty) || 1;
      const price = parseFloat(p.price) || 0;
      const qtyTxt = p.qty ? ` ${p.qty} ${p.unit || ''}`.trimEnd() : '';
      const brandTxt = p.brand ? ` (${p.brand})` : '';
      const priceTxt = price ? ` = ${fmtMoney(price * qty)}` : '';
      lines.push(`- ${p.partName}${p.variant ? ' ('+p.variant+')' : ''}${qtyTxt}${brandTxt}${priceTxt}`);
    });
    const total = jobPartsTotal(job);
    if(total > 0) lines.push(`รวม ${fmtMoney(total)} บาท`);
  }

  if((view.line_priceNote||'').trim()) lines.push(`(${view.line_priceNote.trim()})`);

  // Closing line mirrors where the job actually is.
  const CLOSING = {
    received:  'รอเช็ค',
    inspecting:'รอเช็ค',
    quoted:    'รอลูกค้าตัดสินใจ',
    approved:  'อนุมัติ',
    scheduled: 'นัดวันมาทำ',
    rejected:  'ไม่อนุมัติ',
    repairing: 'กำลังซ่อม',
    aligning:  'รอตั้งศูนย์',
    ready:     'พร้อมส่ง',
    delivered: 'ส่งแล้ว',
    carout:    'เอารถลง'
  };
  lines.push(CLOSING[job.status] || 'รอเช็ค');
  return lines.join('\n');
}

function copyLineSummary(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const text = buildLineSummaryText(job);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      flashToast('คัดลอกข้อความแล้ว');
    }).catch(()=>{
      flashToast('คัดลอกไม่สำเร็จ (เบราว์เซอร์นี้อาจต้องเปิดผ่าน HTTPS)');
    });
  }
}

/* Printing from an iPhone/iPad home-screen app.
   When the app is launched from the Home Screen it runs in "standalone" mode, and iOS
   gives that window no print pipeline at all — window.print() simply does nothing, with
   no error. There is no JS workaround: the page has to be opened in Safari proper,
   which is where AirPrint lives. So in standalone we tell the user plainly and offer to
   hand the page over to Safari, rather than letting them tap a dead button. */
function isStandalone(){
  return (window.navigator && window.navigator.standalone === true)
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function doPrint(){
  if(isStandalone()){
    uiConfirm(
      'พิมพ์จากแอปที่เพิ่มไว้หน้าจอโฮมไม่ได้\n\n' +
      'เป็นข้อจำกัดของ iPhone/iPad เอง — แอปแบบนี้ระบบไม่เปิดช่องให้สั่งพิมพ์\n\n' +
      'กด "เปิดใน Safari" แล้วสั่งพิมพ์จากปุ่มแชร์ได้ตามปกติ',
      () => { window.open(location.href, '_blank'); },
      'เปิดใน Safari'
    );
    return;
  }
  setTimeout(() => window.print(), 60);
}

// The job detail page holds two different printable forms; only one is in the DOM at a
// time so the browser's print dialog never emits both. These set which, then print.
function printJobCheckin(jobId){
  view.printMode = 'checkin';
  render();
  doPrint();
}
function printJobQuote(jobId){
  view.printMode = 'quote';

/* Parts / quote editor on the job detail page. Staff use this after the mechanic has
   inspected the car: pick parts off the vehicle's รุ่นรถ catalog (or add free-text
   rows), set qty + price, then print ใบเสนอราคา for the customer to approve. */
/* The pickable parts for a job. If the vehicle matches a รุ่นรถ in the catalog we use
   that model's list (it carries qty + brand prices). If the model was typed by hand and
   isn't in the catalog, fall back to the master parts list so there is ALWAYS something
   to tick — previously those jobs got no picker at all and everything had to be typed. */
function jobPickableParts(job){
  const model = getJobModel(job);
  if(model && model.parts && model.parts.length){
    return { source:'model', label:`${model.brand||''} ${model.name}`.trim(), items: model.parts };
  }
  const items = (state.masterParts || []).map(mp => ({
    id: 'master-' + mp.id, partName: mp.name, category: mp.category, qty:'', unit:'ชิ้น', brands: [], variant:''
  }));
  return { source:'master', label:'รายการอะไหล่กลาง', items };
}

/* Printable "ใบรับรถ" page for a saved job — styled like the รุ่นรถ print page

function renderJobPrintPage(job){
  const st = statusOf(job.status);

    job.complaints.forEach(cp => { html += `<span class="pv-tag">${escapeHtml(cp.text)}</span>`; });
    html += `</div>`;

  if(job.partsNeeded && job.partsNeeded.length > 0){

      <tbody>`;
    job.partsNeeded.forEach((p, idx) => {

      const nameText = p.variant ? `${escapeHtml(p.partName)} <span class="muted">(${escapeHtml(p.variant)})</span>` : escapeHtml(p.partName);
      html += `<tr><td class="center">${idx+1}</td><td>${nameText}</td><td class="center">${qtyText}</td></tr>`;

  if(job.complaints && job.complaints.length > 0){
    html += `<div class="pv-section-title">อาการ / รายละเอียดที่แจ้ง</div><div class="pv-tags">`;
    job.complaints.forEach(cp => { html += `<span class="pv-tag">${escapeHtml(cp.text)}</span>`; });
    html += `</div>`;
  }

  html += `<div class="pv-section-title">รายการอะไหล่ / เสนอราคา (${parts.length})</div>`;

  if(parts.length === 0){

        <th>แบรนด์</th><th class="center">ราคา/หน่วย</th><th class="center">รวม (บาท)</th>
      </tr></thead><tbody>`;
    parts.forEach((p, idx) => {
      const qtyNum = parseFloat(p.qty) || 1;
      const priceNum = parseFloat(p.price) || 0;
      const qtyText = p.qty ? escapeHtml(p.qty) + ' ' + escapeHtml(p.unit||'') : '-';
      const nameText = p.variant ? `${escapeHtml(p.partName)} <span class="muted">(${escapeHtml(p.variant)})</span>` : escapeHtml(p.partName);

  html += `<div class="pv-foot">* ราคานี้เป็นราคาประเมินเบื้องต้น อาจเปลี่ยนแปลงได้หากพบความเสียหายเพิ่มเติมระหว่างซ่อม ทางร้านจะแจ้งให้ทราบก่อนดำเนินการทุกครั้ง</div>

function renderModelsTab(){
  const selecting = !!view.selectMode;
  const selectedIds = view.selectedModelIds || [];
  const filtered = getFilteredModels();
  const brands = Array.from(new Set(state.models.map(m => m.brand))).sort();
  const hasActiveFilter = !!(view.modelSearch || (view.modelBrandFilter && view.modelBrandFilter !== 'all'));

  let html = `<div class="search-filter-bar no-print">
    <div class="search-input search-wrap">
      ${icon('search',18)}
      <input type="text" id="model-search-input" placeholder="ค้นหารุ่นรถ (ชื่อรุ่นหรือปี)..." value="${escapeAttr(view.modelSearch)}" oninput="onModelSearchInput(this.value)">

      <option value="all" ${view.modelBrandFilter==='all'?'selected':''}>ทุกยี่ห้อ</option>
      ${brands.map(b => `<option value="${escapeAttr(b)}" ${view.modelBrandFilter===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}
    </select>
    ${hasActiveFilter ? `<button class="btn secondary small" onclick="clearModelSearch()">ล้างตัวกรอง</button>` : ''}
    <span class="select-hint">แสดง ${filtered.length} จาก ${state.models.length} รุ่น</span>
  </div>`;

  html += `<div class="models-toolbar no-print">`;
  if(!selecting){
    const presentKeys = {};
    state.models.forEach(m => {
      if(m.seedKey) presentKeys[m.seedKey] = true;
      presentKeys[seedKeyOf(m.brand, m.name)] = true;
    });
    const missingCount = CATALOG_VEHICLE_MODELS.filter(cm => !presentKeys[seedKeyOf(cm.brand, cm.name)]).length;
    html += `<button class="btn secondary" onclick="toggleSelectMode()">${icon('printer',15)} เลือกพิมพ์หลายรุ่น</button>`;
    if(missingCount > 0){
      html += `<button class="btn" onclick="addCatalogModels()">${icon('plus',15)} เพิ่มรุ่นที่ขาด (${missingCount})</button>`;
    }
    html += `<button class="btn danger" onclick="resetModelsToCatalog()">${icon('history',15)} ลบทั้งหมดแล้วโหลดรายการใหม่</button>`;
  } else {
    html += `<span class="select-hint">เลือกแล้ว ${selectedIds.length} รุ่น</span>
      <button class="btn secondary small" onclick="selectAllModels()">เลือกทั้งหมด (ที่แสดง)</button>
      <button class="btn secondary small" onclick="clearModelSelection()">ล้างที่เลือก</button>
      <button class="btn small" onclick="openBulkPrint()" ${selectedIds.length===0?'disabled':''}>${icon('printer',13)} พิมพ์ที่เลือก (${selectedIds.length})</button>
      <button class="btn danger small" onclick="toggleSelectMode()">ยกเลิก</button>`;
  }
  html += `</div>`;

  html += `<div class="model-grid">`;
  if(filtered.length === 0){
    html += `<div class="empty-state" style="grid-column:1/-1;">ไม่พบรุ่นรถที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
  } else {
    filtered.forEach(m => {
      const checked = selectedIds.includes(m.id);
      const clickAction = selecting ? `toggleModelSelect('${m.id}')` : `openModel('${m.id}')`;
      html += `<div class="model-card ${selecting?'selectable':''} ${checked?'selected':''}" onclick="${clickAction}">`;
      if(selecting){
        html += `<span class="select-check ${checked?'checked':''}">${checked?icon('check',12):''}</span>`;
      } else {
        html += `<button class="del" title="ลบรุ่นนี้" onclick="deleteModel('${m.id}', event)">${icon('x',13)}</button>`;
      }
      html += `<div class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</div>
        <div class="year">${escapeHtml(m.yearRange||'')}</div>
        <div class="count">${m.parts.length} อะไหล่ · ${m.promotions.length} โปรโมชั่น</div>
      </div>`;
    });
  }
  if(!selecting){
    html += `<div class="add-model-card" onclick="addModelPrompt()">+ เพิ่มรุ่นรถใหม่</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------------- ตำราราคา (parts price book, all models, read-only reference) ---------------- */
function getPriceBookModels(){
  if(Array.isArray(view.pb_printFilterIds)){
    const idSet = view.pb_printFilterIds;
    return state.models.filter(m => idSet.includes(m.id));
  }
  const q = (view.pb_query || '').trim().toLowerCase();
  const brand = view.pb_brand || 'all';
  return state.models.filter(m => {
    if(brand !== 'all' && m.brand !== brand) return false;
    if(!q) return true;
    const inModel = (m.name||'').toLowerCase().includes(q) || (m.brand||'').toLowerCase().includes(q) || (m.yearRange||'').toLowerCase().includes(q);
    const inParts = (m.parts||[]).some(p => (p.partName||'').toLowerCase().includes(q));
    return inModel || inParts;
  });
}
function onPbSearchInput(value){
  view.pb_query = value;
  const el = document.getElementById('pb-search-input');
  const cursorPos = el ? el.selectionStart : null;
  render();
  const newEl = document.getElementById('pb-search-input');
  if(newEl && cursorPos !== null){
    newEl.focus();
    newEl.setSelectionRange(cursorPos, cursorPos);
  }
}
function onPbBrandFilterChange(value){ view.pb_brand = value; render(); }
function clearPbFilter(){ view.pb_query = ''; view.pb_brand = 'all'; render(); }
function pbJumpTo(anchorId){
  const el = document.getElementById(anchorId);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---- เลือกพิมพ์เฉพาะรุ่น ---- */
function togglePbSelectMode(){
  view.pb_selectMode = !view.pb_selectMode;
  view.pb_selectedIds = [];
  view.pb_printFilterIds = null;
  render();
}
function togglePbModelSelect(modelId){
  const ids = view.pb_selectedIds || (view.pb_selectedIds = []);
  const i = ids.indexOf(modelId);
  if(i === -1) ids.push(modelId); else ids.splice(i, 1);
  render();
}
function selectAllPbModels(){
  view.pb_selectedIds = getPriceBookModels().map(m => m.id);
  render();
}
function clearPbSelection(){
  view.pb_selectedIds = [];
  render();
}
function confirmPbPrintSelection(){
  if(!view.pb_selectedIds || view.pb_selectedIds.length === 0) return;
  view.pb_printFilterIds = view.pb_selectedIds.slice();
  view.pb_selectMode = false;
  render();
}
function clearPbPrintFilter(){
  view.pb_printFilterIds = null;
  render();
}

function renderPbPriceCell(part){
  const brands = part.brands || [];
  if(brands.length === 0) return `<span class="muted">— ยังไม่ตั้งราคา —</span>`;
  return brands.map(b => {
    const label = b.brand ? escapeHtml(b.brand) : 'ไม่ระบุแบรนด์';
    return `<div class="pb-price-line"><span class="pb-price-brand">${label}</span><span class="pb-price">฿${fmtMoney(b.price)}</span></div>`;
  }).join('');
}

function renderPriceBookTab(){
  const printFilterActive = Array.isArray(view.pb_printFilterIds);
  const selecting = !!view.pb_selectMode;
  const selectedIds = view.pb_selectedIds || [];
  const q = view.pb_query || '';
  const brand = view.pb_brand || 'all';
  const brands = Array.from(new Set(state.models.map(m => m.brand))).filter(Boolean).sort();
  const filtered = getPriceBookModels();
  const hasActiveFilter = !!(q || (brand && brand !== 'all'));

  let html = '';

  if(printFilterActive){
    html += `<div class="preview-toolbar no-print">
      <button class="back-link" onclick="clearPbPrintFilter()">${icon('back',15)} กลับไปดูทั้งหมด</button>
      <span class="select-hint">กำลังแสดงเฉพาะรุ่นที่เลือก (${filtered.length} รุ่น)</span>
      <button class="btn secondary" onclick="doPrint()">${icon('printer',15)} พิมพ์ที่เลือก (${filtered.length} รุ่น)</button>
    </div>`;
  } else {
    html += `<div class="search-filter-bar no-print">
      <div class="search-input search-wrap">
        ${icon('search',18)}
        <input type="text" id="pb-search-input" placeholder="ค้นหารุ่นรถหรือชื่ออะไหล่..." value="${escapeAttr(q)}" oninput="onPbSearchInput(this.value)">
      </div>
      <select class="filter-select" onchange="onPbBrandFilterChange(this.value)">
        <option value="all" ${brand==='all'?'selected':''}>ทุกยี่ห้อ</option>
        ${brands.map(b => `<option value="${escapeAttr(b)}" ${brand===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}
      </select>
      ${hasActiveFilter ? `<button class="btn secondary small" onclick="clearPbFilter()">ล้างตัวกรอง</button>` : ''}
      <span class="select-hint">แสดง ${filtered.length} จาก ${state.models.length} รุ่น</span>
      ${!selecting ? `<button class="btn secondary small" onclick="togglePbSelectMode()">${icon('printer',13)} เลือกพิมพ์เฉพาะรุ่น</button>
      <button class="btn secondary small" onclick="doPrint()">${icon('printer',13)} พิมพ์ตำรา (ทั้งหมด)</button>` : ''}
    </div>`;

    if(selecting){
      html += `<div class="models-toolbar no-print">
        <span class="select-hint">เลือกแล้ว ${selectedIds.length} รุ่น</span>
        <button class="btn secondary small" onclick="selectAllPbModels()">เลือกทั้งหมด (ที่แสดง)</button>
        <button class="btn secondary small" onclick="clearPbSelection()">ล้างที่เลือก</button>
        <button class="btn small" onclick="confirmPbPrintSelection()" ${selectedIds.length===0?'disabled':''}>${icon('printer',13)} พิมพ์ที่เลือก (${selectedIds.length})</button>
        <button class="btn danger small" onclick="togglePbSelectMode()">ยกเลิก</button>
      </div>`;
    }
  }

  if(selecting){
    html += `<div class="model-grid no-print">`;
    if(filtered.length === 0){
      html += `<div class="empty-state" style="grid-column:1/-1;">ไม่พบรุ่นรถที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
    } else {
      filtered.forEach(m => {
        const checked = selectedIds.includes(m.id);
        html += `<div class="model-card selectable ${checked?'selected':''}" onclick="togglePbModelSelect('${m.id}')">
          <span class="select-check ${checked?'checked':''}">${checked?icon('check',12):''}</span>
          <div class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</div>
          <div class="year">${escapeHtml(m.yearRange||'')}</div>
          <div class="count">${m.parts.length} อะไหล่</div>
        </div>`;
      });
    }
    html += `</div>`;
    return html;
  }

  if(filtered.length === 0){
    html += `<div class="empty-state">ไม่พบรุ่นรถหรืออะไหล่ที่ตรงกับคำค้นหา/ตัวกรอง</div>`;
    return html;
  }

  const byBrand = {};
  const brandOrder = [];
  filtered.forEach(m => {
    const b = m.brand || 'ไม่ระบุยี่ห้อ';
    if(!byBrand[b]){ byBrand[b] = []; brandOrder.push(b); }
    byBrand[b].push(m);
  });
  brandOrder.sort((a,b) => a.localeCompare(b, 'th'));

  html += `<div class="pb-toc no-print">${brandOrder.map(b => `<button class="pb-toc-chip" onclick="pbJumpTo('pb-brand-${escapeAttr(b)}')">${escapeHtml(b)} (${byBrand[b].length})</button>`).join('')}</div>`;

  html += `<div class="pb-page">`;
  const s = state.shop;
  html += `<div class="pb-cover">
    <div class="pb-cover-title">ตำราราคาอะไหล่</div>
    <div class="pb-cover-sub">${escapeHtml(s.name)}${s.sub ? ' — '+escapeHtml(s.sub) : ''}</div>
  </div>`;

  brandOrder.forEach(b => {
    html += `<div class="pb-brand-heading" id="pb-brand-${escapeAttr(b)}">${escapeHtml(b)}</div>`;
    byBrand[b].forEach(m => {
      html += `<div class="pb-model-block">
        <div class="pb-model-head">
          <span class="name">${escapeHtml(m.brand||'')} ${escapeHtml(m.name)}</span>
          <span class="year">${escapeHtml(m.yearRange||'')}</span>
        </div>`;
      if(!m.parts || m.parts.length === 0){
        html += `<div class="empty-state" style="padding:12px 14px;">ยังไม่มีรายการอะไหล่</div>`;
      } else {
        html += `<table class="pb-table">
          <colgroup><col style="width:55%"><col style="width:45%"></colgroup>
          <thead><tr><th>รายการอะไหล่</th><th>ราคา</th></tr></thead><tbody>`;
        groupByCategory(m.parts).forEach(group => {
          html += `<tr class="pb-cat-row"><td colspan="2" class="pb-cat-header">${escapeHtml(group.category)}</td></tr>`;
          group.items.forEach(part => {
            html += `<tr>
              <td>${escapeHtml(part.partName)}${part.variant ? ' ('+escapeHtml(part.variant)+')' : ''}</td>
              <td>${renderPbPriceCell(part)}</td>
            </tr>`;
          });
        });
        html += `</tbody></table>`;
      }
      html += `</div>`;
    });
  });
  html += `</div>`;

  return html;
}

/* ---------------- QR for the waiting-room board ----------------
   The encoder is pulled from a CDN on demand rather than bundled — it's only ever
   needed on this one settings card, and the app is online by definition. */
function ensureQrLib(){
  if(window.QRCode) return Promise.resolve(true);
  if(window.__qrLoading) return window.__qrLoading;
  window.__qrLoading = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  return window.__qrLoading;
}

function drawBoardQr(){
  const box = document.getElementById('qr-box');
  if(!box) return;
  ensureQrLib().then(ok => {
    const el = document.getElementById('qr-box');
    if(!el) return;
    if(!ok){
      el.innerHTML = '<span class="muted">สร้าง QR ไม่สำเร็จ<br>(ต้องต่ออินเทอร์เน็ต)</span>';
      return;
    }
    el.innerHTML = '';
    new QRCode(el, {
      text: boardUrl(),
      width: 190, height: 190,
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

function copyBoardUrl(){
  const url = boardUrl();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(() => flashToast('คัดลอกลิงก์แล้ว'))
      .catch(() => flashToast('คัดลอกไม่สำเร็จ'));
  }
}

// Opens a clean, print-ready sign in a new window so printing the QR doesn't drag
// the whole settings page along with it.

    if(!ok){ flashToast('สร้าง QR ไม่สำเร็จ'); return; }
    const holder = document.createElement('div');
    new QRCode(holder, { text: boardUrl(), width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => {
      const img = holder.querySelector('img');
      const cvs = holder.querySelector('canvas');
      const src = img ? img.src : (cvs ? cvs.toDataURL() : '');

      if(!w){ flashToast('เบราว์เซอร์บล็อกหน้าต่างใหม่'); return; }

        <title>QR สถานะรถ</title>

        <img src="${src}" alt="QR">

function loadUsersList(){
  if(!isAdmin() || !db) return;
  view.usersLoaded = false;
  render();
  db.collection('users').get()
    .then(snap => {
      const rows = [];
      snap.forEach(doc => rows.push(Object.assign({}, doc.data(), { id: doc.id })));
      rows.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'th'));
      view.usersList = rows;
      view.usersLoaded = true;
      render();
    })
    .catch(err => {
      view.usersLoaded = true;
      flashToast('โหลดรายชื่อไม่สำเร็จ: ' + (err.message||err.code));
      render();
    });
}

function addUserAccess(){
  uiPrompt('วาง User UID ที่ก๊อปมาจาก Firebase Console\n(Authentication → คอลัมน์ User UID)', '', uidValue => {
    const targetUid = (uidValue||'').trim();
    if(!targetUid) return;

    /* Guard against the mistake this page used to allow silently: pasting a UID that
       already has access — most easily your OWN — overwrote that record, wiping the
       existing name and role. Now an existing UID is refused outright and has to be
       edited in the table instead. */
    const existing = (view.usersList || []).find(u => u.id === targetUid);
    if(existing){
      const who = targetUid === currentUser.uid
        ? 'บัญชีของคุณเอง'
        : `"${existing.name || targetUid}"`;
      uiConfirm(
        `UID นี้มีสิทธิ์อยู่แล้ว — เป็น${who}\n\n` +
        `ถ้าเพิ่มซ้ำจะไปทับข้อมูลเดิม จึงไม่อนุญาต\n` +
        `ถ้าต้องการแก้ชื่อหรือสิทธิ์ ให้แก้ในตารางด้านล่างแทน\n\n` +
        `หมายเหตุ: UID ของผู้ใช้ใหม่ต้องก๊อปมาจากแถวของบัญชีนั้นใน Firebase Console — ` +
        `ไม่ใช่แถวของคุณ`,
        () => {}, 'เข้าใจแล้ว'
      );
      return;
    }

    uiPrompt('ชื่อที่จะแสดงในระบบ (เช่น ช่างเอ)', '', name => {
      const displayName = (name||'').trim();
      if(!displayName) return;
      uiPrompt('อีเมลที่ใช้ล็อกอิน (ไว้ดูอ้างอิงเฉยๆ)', '', email => {
        uiChoice('ให้สิทธิ์ระดับไหน?', [
          { value:'staff', label:'พนักงาน — รับรถ เปลี่ยนสถานะ ใส่ราคา' },
          { value:'admin', label:'ผู้ดูแลระบบ — ทำได้ทุกอย่าง' }
        ], role => {
          db.collection('users').doc(targetUid)
            .set({ name: displayName, email: (email||'').trim(), role })
            .then(() => { flashToast('เพิ่มสิทธิ์ให้ ' + displayName + ' แล้ว'); loadUsersList(); })
            .catch(err => flashToast('บันทึกไม่สำเร็จ: ' + (err.message||err.code)));
        });
      });
    });
  });
}

/* The bootstrap account must never end up as staff — it's the key that unlocks the
   system if everything else goes wrong. Both the app and the security rules already
   treat this UID as admin regardless of its users/ document, but the stored record is
   repaired here too so the user list doesn't show something misleading. */
function repairBootstrapAdmin(){
  if(!db || !currentUser || currentUser.uid !== BOOTSTRAP_ADMIN_UID) return;
  db.collection('users').doc(BOOTSTRAP_ADMIN_UID).get()
    .then(doc => {
      const d = doc.exists ? doc.data() : null;
      if(d && d.role === 'admin') return;
      return db.collection('users').doc(BOOTSTRAP_ADMIN_UID).set({
        name: (d && d.name) || (currentUser.email || '').split('@')[0],
        email: (d && d.email) || currentUser.email || '',
        role: 'admin'
      });
    })
    .catch(() => {});
}

/* The email on a user record was only ever a hand-typed label, so it could drift from
   the address the account actually signs in with — and the overwrite bug left some
   records holding the wrong one. For the signed-in user the real address is known, so
   it's corrected automatically here. Other users' addresses can't be read by the client
   SDK (Firebase only exposes the current user), so those stay editable in the table. */
function syncOwnEmail(){
  if(!db || !currentUser || !currentUser.email) return;
  db.collection('users').doc(currentUser.uid).get()
    .then(doc => {
      if(!doc.exists) return;
      const stored = (doc.data() || {}).email || '';
      if(stored === currentUser.email) return;
      return db.collection('users').doc(currentUser.uid).update({ email: currentUser.email });
    })
    .catch(() => {});
}

function onUserFieldChange(targetUid, field, value){
  if(!isAdmin() || !db) return;
  if(targetUid === currentUser.uid && field === 'role'){
    flashToast('เปลี่ยนสิทธิ์ของตัวเองไม่ได้');
    render();
    return;
  }
  const patch = {};
  patch[field] = (value||'').trim();
  db.collection('users').doc(targetUid).update(patch)
    .then(() => {
      const u = (view.usersList||[]).find(x => x.id === targetUid);
      if(u) u[field] = patch[field];
      flashToast('บันทึกแล้ว');
    })

/* ---------------- Delivered archive ---------------- */
/* Cars that have gone home. The day list scopes to one day at a time, so once a car is
   handed over it effectively disappears the next morning — this page is the permanent
   record of everything the shop has finished. */
function deliveredJobs(){
  return activeJobs()
    .filter(j => j.status === 'delivered')
    .sort((a,b) => String(deliveredAtOf(b)).localeCompare(String(deliveredAtOf(a))));
}

// When the car actually left, not when it was checked in.
function deliveredAtOf(job){
  const h = job.statusHistory || [];
  for(let i = h.length - 1; i >= 0; i--){
    if(h[i].status === 'delivered') return h[i].changedAt;
  }
  return job.createdAt;
}

/* Marked delivered by mistake, or the car came back. Sends it to "พร้อมส่ง" so it
   reappears in the job list under the day it was checked in. */
function undeliverJob(jobId, e){
  if(e) e.stopPropagation();
  const job = getJob(jobId);
  if(!job) return;
  const v = getVehicle(job.vehicleId) || {};
  uiConfirm(`นำ ${v.plate || job.jobNumber} กลับเข้าอู่?\n\nสถานะจะกลับเป็น "พร้อมส่ง" และแสดงในรายการงานอีกครั้ง`, () => {
    setJobStatus(jobId, 'ready');
    flashToast('นำกลับเข้ารายการงานแล้ว');
  }, 'นำกลับ');
}

function onDeliveredSearch(val){
  view.dv_search = val;
  const wrap = document.getElementById('dv-results');
  if(wrap) wrap.innerHTML = deliveredResultsHtml();   // no full render — keeps the keyboard up
  const cnt = document.getElementById('dv-found');
  if(cnt) cnt.textContent = filteredDelivered().length;
}

function filteredDelivered(){
  const q = (view.dv_search || '').trim().toLowerCase();
  let rows = deliveredJobs();
  if(q){
    const terms = q.split(/\s+/).filter(Boolean);
    rows = rows.filter(j => {
      const blob = jobSearchBlob(j);
      return terms.every(t => blob.includes(t));
    });
  }
  return rows;
}

function deliveredResultsHtml(){
  const rows = filteredDelivered();
  if(rows.length === 0) return `<div class="empty-state">ไม่พบรายการที่ค้นหา</div>`;

  // Grouped by the day the car went out, newest first — reads like a delivery log.
  let html = '';
  let lastDay = null;
  rows.slice(0, 400).forEach(job => {
    const dAt = deliveredAtOf(job);
    const dk = dayKey(dAt);
    if(dk !== lastDay){
      lastDay = dk;
      const n = rows.filter(j => dayKey(deliveredAtOf(j)) === dk).length;
      html += `<div class="dv-daybar"><span>${escapeHtml(dayLabel(dk))}</span><span class="dv-daynum">${n} คัน</span></div>`;
    }
    const v = getVehicle(job.vehicleId) || {};
    const c = getCustomer(job.customerId) || {};
    const total = jobPartsTotal(job);
    const thumb = jobThumb(job);
    html += `<div class="dv-row" onclick="openJob('${job.id}')">
      <div class="dv-thumb">${thumb ? `<img src="${thumb}" alt="">` : icon('car',22)}</div>
      <div class="dv-info">
        <div class="dv-top">
          <span class="dv-plate mono">${escapeHtml(v.plate||'-')}</span>
          <span class="dv-ok">${icon('check',12)} ส่งแล้ว</span>
        </div>
        <div class="dv-model">${escapeHtml(v.brand||'')} ${escapeHtml(v.model||'')}${v.color ? ' · '+escapeHtml(v.color) : ''}</div>
        <div class="dv-cust">${escapeHtml(c.name||'-')}${c.phone ? ' · '+escapeHtml(c.phone) : ''}</div>
        <div class="dv-meta mono">${escapeHtml(job.jobNumber||'-')} · ส่งเมื่อ ${fmtDT(dAt)}</div>
      </div>
      <div class="dv-amt">
        ${total > 0 ? `<div class="dv-total">${total.toLocaleString('th-TH')}</div><div class="dv-baht">บาท</div>` : `<div class="dv-nototal">—</div>`}
      </div>
      <div class="dv-acts">
        <button class="btn secondary small" title="นำรถกลับเข้าอู่ (พร้อมส่ง)" onclick="undeliverJob('${job.id}', event)">${icon('undo',13)} นำกลับ</button>
        <button class="btn secondary small" onclick="openStatusPicker('${job.id}', event)">สถานะ</button>
      </div>
    </div>`;
  });
  if(rows.length > 400) html += `<div class="muted" style="text-align:center; padding:10px;">แสดง 400 รายการล่าสุด — ใช้ช่องค้นหาเพื่อหาคันที่ต้องการ</div>`;
  return html;
}

function renderModelWorkspace(modelId){
  const model = getModel(modelId);
  if(!model){ view.modelId = null; return renderModelsTab(); }

  const idx = state.models.findIndex(m => m.id === modelId);
  const prevModel = idx > 0 ? state.models[idx - 1] : null;
  const nextModel = idx > -1 && idx < state.models.length - 1 ? state.models[idx + 1] : null;

  let html = `<div class="workspace-head no-print">
    <button class="back-link" onclick="backToModels()">${icon('back',15)} กลับ</button>
    <h2>${escapeHtml(model.brand||'')} ${escapeHtml(model.name)}</h2>
    <span class="yr">${escapeHtml(model.yearRange||'')}</span>
    <button class="btn secondary small" title="แก้ไขชื่อรุ่น" onclick="toggleModelEdit()">${icon('edit',13)} แก้ชื่อรุ่น</button>
    <div class="model-nav-btns">
      <button class="btn secondary small" onclick="goToAdjacentModel('${model.id}', -1)" ${!prevModel?'disabled':''} title="${prevModel ? escapeAttr((prevModel.brand||'')+' '+prevModel.name) : ''}">${icon('back',13)} รุ่นก่อนหน้า</button>
      <button class="btn secondary small" onclick="goToAdjacentModel('${model.id}', 1)" ${!nextModel?'disabled':''} title="${nextModel ? escapeAttr((nextModel.brand||'')+' '+nextModel.name) : ''}">รุ่นถัดไป ${icon('forward',13)}</button>
    </div>
  </div>`;

  if(view.modelEditOpen){
    html += `<div class="card no-print">
      <h3>${icon('edit',15)} แก้ไขข้อมูลรุ่นรถ</h3>
      <div class="row3">
        <div class="field"><label>ยี่ห้อ</label>
          <input type="text" class="force-upper" value="${escapeAttr(model.brand||'')}" onchange="onModelFieldChange('${model.id}','brand', this.value)" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
        <div class="field" style="grid-column:span 2;"><label>ชื่อรุ่น</label>
          <input type="text" class="force-upper" value="${escapeAttr(model.name||'')}" onchange="onModelFieldChange('${model.id}','name', this.value)" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
      </div>
      <div class="field"><label>ปี (จะแสดงต่อท้ายชื่อรุ่น เว้นว่างได้)</label>
        <input type="text" value="${escapeAttr(model.yearRange||'')}" onchange="onModelFieldChange('${model.id}','yearRange', this.value)"></div>
      <p class="muted">เปลี่ยนชื่อแล้วจะมีผลทุกที่ที่อ้างถึงรุ่นนี้ · อะไหล่และราคาที่ตั้งไว้ยังอยู่ครบ</p>
      <button class="btn secondary small" onclick="toggleModelEdit()">${icon('check',13)} เสร็จแล้ว</button>
    </div>`;
  }

  html += `<div class="tabs no-print">
    <button class="tab-btn ${view.modelTab==='parts'?'active':''}" onclick="setModelTab('parts')">อะไหล่ในรุ่นนี้</button>
    <button class="tab-btn ${view.modelTab==='promotions'?'active':''}" onclick="setModelTab('promotions')">โปรโมชั่น</button>
    <button class="tab-btn ${view.modelTab==='preview'?'active':''}" onclick="setModelTab('preview')">พรีวิว / พิมพ์</button>
  </div>`;

  if(view.modelTab === 'parts') html += renderPartsTab(model);
  else if(view.modelTab === 'promotions') html += renderPromotionsTab(model);
  else if(view.modelTab === 'preview') html += renderPreviewTab(model);

  return html;
}

// Builds the "แบรนด์" <select> for one part/price row: the shared partBrandOptions
// list (defaults รีบิ้ว/OEM/POWERED + anything added), plus the row's current value
// if it's somehow not in that list yet, plus a "+ เพิ่มแบรนด์ใหม่..." action item.
function renderBrandNameSelect(modelId, partId, b){
  const names = (state.partBrandOptions || []).map(o => o.name);
  const current = (b.brand || '').trim();
  if(current && !names.includes(current)) names.push(current);
  return `<select class="brand-name-select" onchange="onBrandNameSelectChange('${modelId}','${partId}','${b.id}', this.value)">
    <option value="" ${!current?'selected':''}>— เลือกแบรนด์ —</option>
    ${names.map(n => `<option value="${escapeAttr(n)}" ${current===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
    <option value="${ADD_BRAND_OPTION_VALUE}">+ เพิ่มแบรนด์ใหม่...</option>
  </select>`;
}

function renderPartsTab(model){

          <input type="text" class="part-name-input" style="width:100%;" value="${escapeAttr(part.partName)}" oninput="onPartFieldInput('${model.id}','${part.id}','partName', this.value)">
        </td>
        <td class="center" rowspan="${rowspan}">
          <input type="text" class="unit-input" style="width:100%;" placeholder="เช่น ซ้าย" value="${escapeAttr(part.variant||'')}" oninput="onPartFieldInput('${model.id}','${part.id}','variant', this.value)">
          <div class="part-variant-actions">
            ${!part.variant ? `<button class="add-brand-btn" title="แยกเป็นซ้าย/ขวา (เพิ่มแถวขวาให้อัตโนมัติ)" onclick="splitPartLR('${model.id}','${part.id}')">แยกซ้าย/ขวา</button>` : ''}
            <button class="add-brand-btn" title="เพิ่มตัวแปรอื่นของอะไหล่นี้ (คัดลอกแถวนี้)" onclick="duplicatePartVariant('${model.id}','${part.id}')">+ ตัวแปร</button>

        <td class="center" rowspan="${rowspan}">
          <div class="qty-inline">

            <select class="unit-select" onchange="onPartFieldInput('${model.id}','${part.id}','unit', this.value)">
              ${(UNIT_OPTIONS.includes(part.unit) || !part.unit ? UNIT_OPTIONS : [part.unit, ...UNIT_OPTIONS]).map(u =>
                `<option value="${escapeAttr(u)}" ${part.unit===u?'selected':''}>${escapeHtml(u)}</option>`
              ).join('')}

      const delPartCell = `<td class="center" rowspan="${rowspan}"><button class="icon-btn" title="ลบอะไหล่นี้ทั้งแถว" onclick="deletePartFromModel('${model.id}','${part.id}')">${icon('trash',13)}</button></td>`;

      if(part.brands.length === 0){

          <td class="center"><button class="add-brand-btn" onclick="addBrandToPart('${model.id}','${part.id}')">+ เพิ่มแบรนด์/ราคา</button></td>

  const availableToAdd = state.masterParts.filter(mp => !model.parts.some(p => p.partName === mp.name));
  html += `<div class="card">

    html += `<p class="muted">เพิ่มครบทุกรายการจากรายการกลางแล้ว</p>`;

    html += `<div style="margin-top:10px;"><button class="btn" onclick="addExistingPartsToModel('${model.id}')">+ เพิ่มที่เลือกเข้ารุ่นนี้</button></div>`;
  }
  html += `</div>`;

  html += `<div class="card">
    <h3>+ เพิ่มอะไหล่ชื่อใหม่ (เฉพาะรุ่นนี้)</h3>
    <div class="row-flex">

      </div>
      <button class="btn secondary" onclick="addCustomPartToModel('${model.id}')">+ เพิ่ม</button>
    </div>
  </div>`;

  return html;
}

function renderPromotionsTab(model){
  let html = `<div class="card">
    <h3>สร้างโปรโมชั่นใหม่</h3>
    <div class="field"><label>ชื่อโปรโมชั่น</label><input type="text" id="promo-name-input" style="width:100%;" placeholder="เช่น แพ็คช่วงล่างหน้า"></div>
    <label>เลือกอะไหล่ที่รวมในชุดนี้</label>`;
  if(model.parts.length === 0){
    html += `<p class="muted">ยังไม่มีอะไหล่ในรุ่นนี้ ไปเพิ่มที่แท็บ "อะไหล่ในรุ่นนี้" ก่อน</p>`;
  } else {
    groupByCategory(model.parts).forEach(group => {
      html += `<div class="chk-cat-label">${escapeHtml(group.category)}</div><div class="checklist">`;
      group.items.forEach(p => {
        html += `<label><input type="checkbox" class="promo-item-check" value="${p.id}"> ${escapeHtml(p.partName)}${p.variant ? ' <span class="muted">('+escapeHtml(p.variant)+')</span>' : ''}</label>`;
      });
      html += `</div>`;
    });
  }
  html += `
    <div class="pv-intake-row" style="margin-top:10px; gap:16px;">
      <div class="field" style="flex:1;"><label>ราคาชุดโปรโมชั่น (บาท)</label><input type="text" id="promo-price-input" placeholder="บาท"></div>
      <div class="field" style="flex:1;"><label>เริ่มเมื่อ</label><input type="date" id="promo-date-start-input"></div>
      <div class="field" style="flex:1;"><label>จบเมื่อไหร่ (เว้นว่าง = ไม่มีกำหนด)</label><input type="date" id="promo-date-end-input"></div>
    </div>
    <button class="btn" style="margin-top:10px;" onclick="addPromotion('${model.id}')">+ สร้างโปรโมชั่น</button>
  </div>`;

  const counts = { all: model.promotions.length, active:0, upcoming:0, expired:0 };
  model.promotions.forEach(p => { counts[promoStatus(p)]++; });
  const filterDefs = [
    ['all','ทั้งหมด'], ['active','กำลังใช้งาน'], ['upcoming','ยังไม่เริ่ม'], ['expired','หมดอายุ']
  ];
  html += `<div class="card"><h3>โปรโมชั่นในรุ่นนี้ (${model.promotions.length})</h3>
    <div class="status-pills">`;
  filterDefs.forEach(([key,label]) => {
    html += `<button class="status-pill ${view.promoFilter===key?'active':''}" onclick="setPromoFilter('${key}')">${escapeHtml(label)} <span class="n">${counts[key]}</span></button>`;
  });
  html += `</div>`;

  const shown = model.promotions.filter(p => view.promoFilter === 'all' || promoStatus(p) === view.promoFilter);
  if(shown.length === 0){
    html += `<div class="empty-state">ไม่มีโปรโมชั่นในตัวกรองนี้</div>`;
  } else {
    shown.forEach(promo => {
      const itemNames = promo.itemIds.map(id => {
        const p = model.parts.find(pp => pp.id === id);
        return p ? p.partName : '(ถูกลบแล้ว)';
      }).join(', ');
      const status = promoStatus(promo);
      html += `<div class="promo-card">
        <div class="promo-card-head">
          <input type="text" class="promo-name-input" value="${escapeHtml(promo.name)}" onchange="onPromoFieldInput('${model.id}','${promo.id}','name', this.value)">
          <span class="promo-status ${status}">${promoStatusLabel(status)}</span>
        </div>
        <div class="pitems">${escapeHtml(itemNames)}</div>
        <div class="pv-intake-row" style="gap:16px; margin-top:6px;">
          <span class="pv-field"><label>ราคา</label><input type="text" style="border:1px solid var(--border); border-radius:4px; padding:2px 6px; width:90px;" value="${escapeHtml(promo.price || '')}" onchange="onPromoFieldInput('${model.id}','${promo.id}','price', this.value)"></span>
          <span class="pv-field"><label>เริ่ม</label><input type="date" style="border:1px solid var(--border); border-radius:4px; padding:2px 6px;" value="${escapeHtml(promo.dateStart || '')}" onchange="onPromoFieldInput('${model.id}','${promo.id}','dateStart', this.value)"></span>
          <span class="pv-field"><label>ถึง</label><input type="date" style="border:1px solid var(--border); border-radius:4px; padding:2px 6px;" value="${escapeHtml(promo.dateEnd || '')}" onchange="onPromoFieldInput('${model.id}','${promo.id}','dateEnd', this.value)"></span>
        </div>
        <div style="margin-top:8px;"><button class="btn danger small" onclick="deletePromotion('${model.id}','${promo.id}')">ลบโปรโมชั่นนี้</button></div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

// Comma-separated money formatting, e.g. 400 -> "400", 12000 -> "12,000".

  const num = Number(n) || 0;

}
